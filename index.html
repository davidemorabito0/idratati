      interactive:false,zIndexOffset:1000}).addTo(map);
  } else meMarker.setLatLng([pos.lat,pos.lon]);
}

/* ============================================================
   DATI: snapshot statico -> Overpass -> Supabase
   ============================================================ */
/* ============================================================
   L'ELENCO DEI RIQUADRI CHE ESISTONO
   L'archivio copre l'Italia, non il Mediterraneo. Guardando Messina o
   la costa, metà schermo è mare: l'app chiedeva riquadri che non
   esistono, si prendeva un errore per ognuno, e ripiegava su Overpass —
   che a sua volta falliva. Dopo tre errori compariva "non riesco a
   raggiungere i server" mentre la mappa era piena di fontanelle.
   Ora si scarica una volta sola l'elenco dei riquadri prodotti dal
   workflow (poche decine di kilobyte) e non si chiede più ciò che non
   c'è. Meno richieste, meno attesa, e l'avviso torna a dire la verità.
   ============================================================ */
var INDICE_TILE = null;      // {chiave: 1} dei riquadri esistenti, o null se non si sa
var indiceChiesto = false;

function caricaIndice(){
  if(indiceChiesto) return;
  indiceChiesto = true;
  fetch(CFG.DATA_BASE + '/index.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d || !d.tiles || !d.tiles.length) return;
      var m = {};
      d.tiles.forEach(function(k){ m[k] = 1; });
      INDICE_TILE = m;
      DIARIO.indice = d.count || 0;
      DIARIO.indiceRiquadri = d.tiles.length;
    })
    .catch(function(){ /* senza elenco si continua come prima */ });
}

function tileKey(lat,lon){
  return (Math.floor(lat/TILE)*TILE).toFixed(1)+'_'+(Math.floor(lon/TILE)*TILE).toFixed(1);
}
function tilesForView(){
  var b=map.getBounds(), keys={}, out=[];
  for(var la=Math.floor(b.getSouth()/TILE)*TILE; la<=b.getNorth(); la+=TILE)
    for(var lo=Math.floor(b.getWest()/TILE)*TILE; lo<=b.getEast(); lo+=TILE){
      var k=tileKey(la,lo);
      if(!keys[k]){ keys[k]=1; out.push(k); }
    }
  return out;
}
function addPoints(arr){
  var added=0;
  arr.forEach(function(p){
    if(byId[p.id]) return;
    byId[p.id]=p; points.push(p); added++;
  });
  return added;
}
/* ============================================================
   DOVE HO GIÀ CERCATO
   La regola che deve valere ovunque in Italia — montagna, paese, città,
   nord o sud — è una sola: se sei in una zona che l'app non ha mai
   esplorato, deve succedere qualcosa. O cerca da sola, o ti offre il
   pulsante. Non esiste un terzo caso in cui resta muta.
   Per garantirlo bisogna sapere dove si è già guardato: senza questo
   registro non si distingue "non ho cercato" da "ho cercato e qui non
   c'è niente", e sono due situazioni che meritano risposte opposte.
   ============================================================ */
var zoneEsplorate = [];        // {lat, lon, raggio, trovati}

function registraZona(c, raggio, trovati){
  zoneEsplorate.push({lat:c.lat, lon:c.lon, raggio:raggio, trovati:trovati});
  if(zoneEsplorate.length > 60) zoneEsplorate.shift();
}

function giaEsplorata(c){
  for(var i = 0; i < zoneEsplorate.length; i++){
    var z = zoneEsplorate[i];
    // dentro il cuore della zona già cercata, non ai bordi
    if(dist(z, c) < z.raggio * 0.7) return z;
  }
  return null;
}

/* Il pulsante che chiede il permesso di cercare più in là. */
function mostraCercaQui(){
  var b = document.getElementById('cercaQui');
  if(b) b.hidden = false;
}
function nascondiCercaQui(){
  var b = document.getElementById('cercaQui');
  if(b){ b.hidden = true; b.classList.remove('sto-cercando'); }
}

/* L'archivio copre già questo pezzo di mappa?
   Se sì, chiedere gli stessi punti anche a OpenStreetMap è lavoro
   sprecato: sono server pubblici affollati, spesso non rispondono, e
   ogni loro intoppo faceva comparire "non riesco a raggiungere i
   server" — anche a Milano, dove di problemi di rete non ce n'erano.
   Il prezzo di questa scelta: una fontanella aggiunta a OpenStreetMap
   ieri comparirà col prossimo aggiornamento mensile, non oggi. */
function archivioCopreLaVista(){
  if(!INDICE_TILE || !map || !map.getBounds) return false;
  var keys = tilesForView();
  if(!keys.length) return false;
  for(var i = 0; i < keys.length; i++){
    var s = tilesLoaded[keys[i]];
    if(s !== 'ok' && s !== 'vuoto') return false;
  }
  return true;
}

function loadArea(center){
  sfoltisci();
  var keys=tilesForView(), pending=[];
  keys.forEach(function(k){
    var stato = tilesLoaded[k];
    /* Un riquadro che non è arrivato — rete che cade, server lento —
       veniva segnato come "mancante" e non veniva più richiesto per
       tutta la sessione: un buco temporaneo diventava definitivo, e
       quella zona restava vuota anche tornandoci. Dopo tre minuti si
       riprova. */
    if(typeof stato === 'string' && stato.indexOf('miss:') === 0){
      var quando = +stato.slice(5) || 0;
      if(Date.now() - quando > 180000) stato = null;
    }
    /* Se l'elenco dice che quel riquadro non esiste, non lo si chiede:
       lì non c'è mai stata una fontanella (mare, o zona senza nulla
       mappato). Non è un errore, è un'informazione. */
    if(!stato && INDICE_TILE && !INDICE_TILE[k]){ tilesLoaded[k]='vuoto'; return; }
    if(!stato){ tilesLoaded[k]='loading'; pending.push(k); }
  });

  pending.forEach(function(k){
    fetch(CFG.DATA_BASE+'/'+k+'.json')
      .then(function(r){ if(!r.ok) throw new Error('404'); return r.json(); })
      .then(function(d){
        tilesLoaded[k]='ok';
        DIARIO.snapshot += (d.p||[]).length;
        // si segna la provenienza: serve a capire, quando si sfoltisce,
        // quali riquadri sono rimasti davvero senza niente
        var arrivati = (d.p||[]).map(decodePoint);
        arrivati.forEach(function(p){ p.tile = k; });
        addPoints(arrivati);
        // i dati stanno arrivando: qualunque avviso di rete non ha più senso
        nascondiAvvisoRete();
        render();
        salvaPuntiInLocale();
      })
      .catch(function(){
        tilesLoaded[k]='miss:'+Date.now();
        DIARIO.snapshotMancanti++;
        /* Ora la fonte principale è l'archivio: se non risponde lui, è
           qui che si capisce se c'è un problema vero di rete. */
        segnalaFallimentoRete();
        // senza elenco non si sa se il riquadro esiste: si tenta Overpass
        if(!INDICE_TILE) overpass(center);
      });
  });

  if(!lastQ || dist(lastQ,center)>1200){ lastQ=center; loadSupabase(center); }

  /* Quando chiedere altri punti a OpenStreetMap.
     Prima la condizione era "solo se non c'è nemmeno un punto entro
     2,5 km": bastava un segnaposto rimasto ai bordi e l'app dava l'area
     per coperta, lasciando vuoto tutto il resto dello schermo.
     Ora conta quanti punti ci sono davvero in quello che si vede, e
     soprattutto se ci si è spostati fuori dall'area già cercata. */
  /* ── La decisione, in tre casi che coprono tutto ──
     1. Zona già esplorata → niente da fare (o l'invito ad aggiungere,
        se davvero lì non c'è nulla)
     2. Zona nuova ma a due passi → cerca da sola
     3. Zona nuova e lontana → offre il pulsante
     Non esiste un quarto caso: qualunque punto d'Italia ricade in uno
     di questi tre. */

  var zona = giaEsplorata(center);

  if(zona){
    nascondiCercaQui();
    // qui si è già guardato: se non c'era niente, si dice a chi passa
    var b0 = map.getBounds();
    var quiOra = points.filter(function(p){
      return p.lat >= b0.getSouth() && p.lat <= b0.getNorth() &&
             p.lon >= b0.getWest()  && p.lon <= b0.getEast();
    }).length;
    if(!quiOra) mostraNessunaQui(); else nascondiNessunaQui();
    return;
  }

  // zona mai esplorata: da qui in avanti succede sempre qualcosa
  nascondiNessunaQui();

  /* Se i riquadri di questa vista sono tutti già risolti dall'archivio,
     i punti ci sono: non si chiede niente a nessuno e non si disturba
     l'utente con inviti a cercare. */
  if(archivioCopreLaVista()){ nascondiCercaQui(); return; }

  var raggio = lastOverpassRaggio || raggioPerVista();
  var vicino = lastOverpassAt_center &&
               dist(lastOverpassAt_center, center) <= raggio * 1.2;

  if(vicino){
    var passato = Date.now() - lastOverpassAt;
    if(passato < 2500){
      // il freno è ancora attivo: ci si riprova fra poco, da soli
      clearTimeout(window._riprovaZona);
      window._riprovaZona = setTimeout(function(){ loadArea(map.getCenter ?
        {lat:map.getCenter().lat, lon:map.getCenter().lng} : center); }, 2600);
      return;
    }
    nascondiCercaQui();
    overpass(center);
    return;
  }

  // lontano da tutto quello che si conosce: si chiede il permesso
  mostraCercaQui();
}

/* formato compatto dello snapshot: [osmid, lat, lon, kind, name, flags] */
function decodePoint(a){
  var kind = a[3]===1 ? 'casa' : 'fontanella';
  var tags = {};
  if(a[4]) tags.name=a[4];
  var f=a[5]||0;
  if(f&1) tags.drinking_water='yes';
  if(f&2) tags.drinking_water='no';
  if(f&4) tags.fee='yes';
  if(f&8) tags.fee='no';
  if(f&16) tags.bottle='yes';
  if(f&32) tags.seasonal='yes';
  if(f&64) tags.wheelchair='yes';
  if(f&128) tags.wheelchair='limited';
  if(f&256) tags.dog='yes';
  if(a[6]) tags.check_date=a[6];
  return {id:a[0], target:'osm/'+a[0], lat:a[1], lon:a[2], kind:kind, tags:tags};
}

/* Overpass è gratuito e spesso affollato: affidarsi a un server solo
   vuol dire mappa vuota ogni volta che quello fa i capricci. Qui se ne
   provano tre a turno, e chi resta appeso viene mollato dopo venti
   secondi invece di bloccare tutte le richieste successive. */
var SERVER_OSM = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'
];
var serverCorrente = 0;

/* Quanto lontano cercare: tanto quanto se ne vede.
   Con un raggio fisso, a mappa ampia si riempiva un cerchietto in mezzo
   e tutto il resto restava vuoto. */
function raggioPerVista(){
  if(!map || !map.getBounds) return 2200;
  var b = map.getBounds();
  var mezzaDiagonale = dist(
    {lat:b.getNorth(), lon:b.getWest()},
    {lat:b.getSouth(), lon:b.getEast()}
  ) / 2;
  // sotto gli 1,5 km non ha senso, sopra i 15 la richiesta diventa pesante
  return Math.round(Math.min(Math.max(mezzaDiagonale * 1.15, 1500), 15000));
}

function overpass(c){
  if(fetching) return;
  fetching=true;
  clearTimeout(window._sbloccaOverpass);
  window._sbloccaOverpass = setTimeout(function(){ fetching = false; }, 20000);
  lastOverpassAt=Date.now(); lastOverpassAt_center=c;
  if(!firstLoadDone) toast('Cerco i punti d\'acqua qui intorno…', 2600);
  var raggio = raggioPerVista();
  lastOverpassRaggio = raggio;
  var a='(around:'+raggio+','+c.lat.toFixed(5)+','+c.lon.toFixed(5)+')';
  /* Non tutti mappano le fontanelle allo stesso modo. A Milano si usa
     quasi sempre amenity=drinking_water; a Messina, Palermo e in gran
     parte del Sud si usa amenity=fountain con l'indicazione che è
     potabile — ed è il motivo per cui lì la nostra mappa risultava
     vuota mentre altre app mostravano decine di punti.
     Le fontane ornamentali restano fuori: si prendono solo quelle
     dichiarate potabili. */
  var q='[out:json][timeout:25];('+
    'nwr["amenity"="drinking_water"]'+a+';'+
    'nwr["man_made"="water_tap"]["drinking_water"!="no"]'+a+';'+
    'nwr["amenity"="water_point"]'+a+';'+
    'nwr["amenity"="vending_machine"]["vending"~"water"]'+a+';'+
    'nwr["natural"="spring"]["drinking_water"="yes"]'+a+';'+
    'nwr["amenity"="fountain"]["drinking_water"="yes"]'+a+';'+
    'nwr["amenity"="fountain"]["drinking_water:legal"="yes"]'+a+';'+
    'nwr["man_made"="water_well"]["drinking_water"="yes"]'+a+';'+
    'nwr["man_made"="drinking_fountain"]'+a+';);out center tags 900;';
  fetch(SERVER_OSM[serverCorrente],{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      fetching=false;
      clearTimeout(window._sbloccaOverpass);
      nascondiAvvisoRete();
      nascondiCercaQui();
      var quanti = (d.elements||[]).length;
      registraZona(c, lastOverpassRaggio || 2200, quanti);
      if(quanti) nascondiNessunaQui();
      DIARIO.overpass += (d.elements||[]).length;
      DIARIO.ultimoServer = SERVER_OSM[serverCorrente];
      var prima=points.length;
      addPoints((d.elements||[]).map(function(e){
        var lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
        var lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
        if(lat==null||lon==null) return null;
        var tags=e.tags||{};
        if(tags.access==='private'||tags.access==='no') return null;
        var id=e.type+'/'+e.id;
        return {id:id, target:'osm/'+id, lat:lat, lon:lon, tags:tags, kind:classify(tags)};
      }).filter(Boolean));
      render();
      salvaPuntiInLocale();
      var nuovi = points.length - prima;
      if(!firstLoadDone){
        firstLoadDone = true;
        if(!nuovi && !points.length)
          toast('Qui non risulta mappato nessun punto d\'acqua. Prova a spostarti o cerca un\'altra zona.', 5000);
      }
    })
    .catch(function(err){
      fetching = false;
      clearTimeout(window._sbloccaOverpass);
      segnalaFallimentoRete();
      DIARIO.overpassErrori.push(
        SERVER_OSM[serverCorrente].replace('https://','').split('/')[0] +
        ': ' + (err && err.message ? err.message : 'nessuna risposta'));
      if(DIARIO.overpassErrori.length > 5) DIARIO.overpassErrori.shift();
      // questo server non ce l'ha fatta: il prossimo tentativo va altrove
      var eraUltimo = (serverCorrente === SERVER_OSM.length - 1);
      serverCorrente = (serverCorrente + 1) % SERVER_OSM.length;
      setTimeout(function(){
        if(!points.length){ lastOverpassAt = 0; overpass(c); }
      }, eraUltimo ? 8000 : 600);
    });
}

function loadSupabase(c){
  if(!SB.on()) return;
  var d=0.06;
  SB.select('fountains?select=*&hidden=eq.false'
    +'&lat=gte.'+(c.lat-d)+'&lat=lte.'+(c.lat+d)
    +'&lon=gte.'+(c.lon-d)+'&lon=lte.'+(c.lon+d)+'&limit=1000')
    .then(function(rows){
      var custom=[];
      rows.forEach(function(r){
        if(r.osm_id){ overrides[r.osm_id]=r; }
        else {
          custom.push({id:'db/'+r.id, target:'db/'+r.id, lat:r.lat, lon:r.lon,
                       kind:r.kind, tags:{name:r.name}, ov:r, custom:true});
        }
      });
      DIARIO.supabase = rows.length;
      addPoints(custom);
      points.forEach(function(p){ if(overrides[p.id]) p.ov=overrides[p.id]; });
      render();
    });
  SB.select('v_status?select=*&limit=5000').then(function(rows){
    rows.forEach(function(r){ statusAgg[r.target]=r; }); render();
  });
  /* Serve al filtro in alto: senza questo, "Accessibili" e "Con
     vaschetta cani" conoscerebbero solo le fontanelle di cui si è già
     aperta la scheda. */
  SB.select('v_dettagli?select=*&limit=5000').then(function(rows){
    rows.forEach(function(r){ dettagliAgg[r.target]=r; }); render();
  });
  SB.select('v_reviews?select=*&limit=5000').then(function(rows){
    rows.forEach(function(r){ reviewAgg[r.target]=r; }); render();
  });
  // chi ha una foto pubblicata: non serve il file, solo saperlo
  SB.select('photos?select=target&approved=eq.true&limit=5000').then(function(rows){
    rows.forEach(function(r){ fotoConferma[r.target] = true; }); render();
  });
}

/* La verifica più forte che esista: qualcuno non solo ha detto che
   funziona, l'ha anche dimostrato con una foto. Due cose diverse — lo
   stato dice cosa è successo, la foto lo prova — e meritano un segno
   diverso, non solo un colore più acceso. */
function verificataConFoto(p){
  return verificata(p) && !!fotoConferma[p.target];
}

/* ============================================================
   RENDER
   ============================================================ */
var IC_F='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3s7 8.4 7 12.6A7 7 0 0 1 5 15.6C5 11.4 12 3 12 3Z"/></svg>';
var IC_C='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#07242F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M10 20v-6h4v6"/></svg>';
var IC_FOTO_G='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
var IC_FOTO='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#07242F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';

function visible(){
  return points.filter(function(p){
    if(!show[p.kind]) return false;
    var st=stateOf(p);
    if(st.s==='removed') return false;
    if(show.okonly && (st.s==='broken' || st.s==='works' || st.s==='missing' ||
                       st.s==='doubt')) return false;
    if(show.freeonly && feeOf(p)==='paid') return false;
    // non più solo le etichette di OpenStreetMap: conta anche
    // quello che ha risposto chi c'è stato
    if(show.access && dettaglioDi(p, 'accessibile') !== true) return false;
    if(show.dog && dettaglioDi(p, 'cani') !== true) return false;
    if(show.daverificare && verificata(p)) return false;
    return true;
  });
}
/* ============================================================
   DISEGNO DELLA MAPPA
   Con l'Italia intera i punti sono decine di migliaia: disegnarli
   tutti significa bloccare il telefono. Quindi si disegna solo
   quello che è davvero inquadrato, e da lontano si raggruppa.
   ============================================================ */
/* Si vedono tutte le fontanelle inquadrate: allargando la mappa devono
   essere tante, perché è così che uno si fa un'idea di quanta acqua ha
   intorno e sceglie quale raggiungere — una in un sottopasso, una nel
   parco. Si raggruppa solo da molto lontano, dove i segnaposti si
   sovrapporrebbero comunque uno sull'altro. */
/* Le celle si misurano in PIXEL, non in gradi: così sono sempre grandi
   uguali sullo schermo, a qualunque distanza. Avvicinandosi, i numeri si
   sciolgono da soli in segnaposti singoli, senza salti e senza soglie
   arbitrarie. È il comportamento che si vede su Share Now o Airbnb.
   Il vantaggio vero non è estetico: invece di disegnare mille segnaposti
   sovrapposti se ne disegnano qualche decina, e il telefono respira. */
var LATO_CELLA = 64;         // lato della cella, in pixel di schermo
var ZOOM_SINGOLI = 17;       // da qui in su non si raggruppa più: si è in strada
var MAX_PIN = 1200;          // tetto di sicurezza per non piantare il telefono

function inVista(){
  var b = map.getBounds().pad(0.6);   // largo: chi si sposta li trova già lì
  return visible().filter(function(p){
    return p.lat >= b.getSouth() && p.lat <= b.getNorth() &&
           p.lon >= b.getWest()  && p.lon <= b.getEast();
  });
}

function raggruppa(punti, zoom){
  // Ogni punto viene proiettato sullo schermo e assegnato alla sua cella
  // di 64 pixel. Due fontanelle che sullo schermo si sovrapporrebbero
  // finiscono nella stessa cella, quale che sia lo zoom.
  var celle = {}, elenco = [];
  punti.forEach(function(p){
    var pt;
    try { pt = map.project([p.lat, p.lon], zoom); }
    catch(e){ return; }
    var k = Math.floor(pt.x / LATO_CELLA) + ':' + Math.floor(pt.y / LATO_CELLA);
    var c = celle[k];
    if(!c){ c = celle[k] = {n:0, lat:0, lon:0, uno:null}; elenco.push(c); }
    c.n++; c.lat += p.lat; c.lon += p.lon; c.uno = p;
  });
  elenco.forEach(function(c){ c.lat /= c.n; c.lon /= c.n; });
  return elenco;
}

function disegnaPin(p){
  var casa = p.kind === 'casa', st = stateOf(p);
  var mio = myVotes[p.target];

  /* Due correzioni al colore del segnaposto.
     La prima: quello che hai segnalato tu vale subito per te, anche se
     il sistema aspetta una conferma prima di dirlo a tutti.
     La seconda: una segnalazione di guasto, pur da confermare, si vede.
     Nascondere un possibile guasto manda la gente a camminare a vuoto,
     che è esattamente ciò che l'app dovrebbe evitare. */
  // stateOf tiene già conto della tua segnalazione: qui basta leggerlo
  var guasto = (st.s === 'broken' || st.s === 'missing');
  var dubbio = false;                      // il "forse rotta" non esiste più
  var lavori = (st.s === 'works');
  var conFoto = verificataConFoto(p);
  L.marker([p.lat, p.lon], {icon: L.divIcon({className:'',
    html:'<div class="pin'+(casa?' casa':'')+(guasto?' broken':'')+
         (dubbio?' dubbio':'')+(lavori?' lavori':'')+(conFoto?' confoto':'')+
         (verificata(p) ? '' : ' daverificare')+
         (selected && selected.target === p.target ? ' sel' : '')+'">'+
         (casa?IC_C:IC_F)+
         (feeOf(p)==='paid'?'<span class="fee">€</span>':'')+
         (conFoto?'<span class="foto-mark">'+IC_FOTO+'</span>':'')+'</div>',
    iconSize:[30,30], iconAnchor:[15,28]})})
   .on('click', function(){ openSheet(p); }).addTo(layer);
}

function render(){
  DIARIO.disegnati = points.length;
  if(!layer) return;
  layer.clearLayers();

  var zoom = map.getZoom();
  var punti = inVista();

  if(zoom < ZOOM_SINGOLI){
    var gruppi = raggruppa(punti, zoom);
    if(gruppi.length > MAX_PIN){
      var cg = map.getCenter(), centroG = {lat:cg.lat, lon:cg.lng};
      gruppi.sort(function(a,b){ return dist(centroG,a) - dist(centroG,b); });
      gruppi = gruppi.slice(0, MAX_PIN);
    }
    gruppi.forEach(function(c){
      // una cella con un punto solo non è un gruppo: è una fontanella
      if(c.n === 1){ disegnaPin(c.uno); return; }
      var grande = c.n > 99;
      L.marker([c.lat, c.lon], {icon: L.divIcon({className:'',
        html:'<div class="grappolo'+(grande?' grande':'')+'">'+(c.n>999?'999+':c.n)+'</div>',
        iconSize:[grande?46:38, grande?46:38], iconAnchor:[grande?23:19, grande?23:19]})})
       .on('click', function(){
          // due passi di zoom: il gruppo si apre senza saltare troppo avanti
          map.setView([c.lat, c.lon], Math.min(19, zoom + 2), {animate:true});
       }).addTo(layer);
    });
  } else {
    // in strada si vedono tutte, una per una
    if(punti.length > MAX_PIN){
      var cc = map.getCenter(), centro = {lat:cc.lat, lon:cc.lng};
      punti.sort(function(a,b){ return dist(centro,a) - dist(centro,b); });
      punti = punti.slice(0, MAX_PIN);
    }
    punti.forEach(disegnaPin);
  }

  // il punto aperto resta visibile anche se finisce fuori inquadratura
  if(selected && punti.indexOf(selected) === -1) disegnaPin(selected);

  // quante ne aspettano ancora qualcuno che le controlli, qui intorno
  var q = document.getElementById('quanteNuove');
  if(q){
    var mai = punti.filter(function(x){ return !verificata(x); }).length;
    q.textContent = mai ? ' ' + mai : '';
  }

  if(!selected) showNearest();

  /* I dati arrivano dopo, con calma. I due cartelli — "qui non c'è
     niente" e "cerca in questa zona" — venivano accesi mentre la mappa
     era ancora vuota e poi non li spegneva più nessuno. Qui si guarda
     lo stato di adesso: se si vedono fontanelle, i cartelli se ne vanno. */
  if(!vistaVuota()){ nascondiNessunaQui(); nascondiCercaQui(); }
}

/* La memoria non è infinita: oltre una certa soglia si tengono solo
   i punti più vicini, tanto gli altri si ricaricano quando servono. */
function sfoltisci(){
  if(points.length < 6000) return;
  var c = map.getCenter(), centro = {lat:c.lat, lon:c.lng};
  points.sort(function(a,b){ return dist(centro,a) - dist(centro,b); });
  points.splice(4000).forEach(function(p){
    if(selected && selected.target === p.target){ points.push(p); return; }
    delete byId[p.id];
  });

  /* I punti buttati via venivano da certi riquadri dell'archivio. Se non
     si toglie anche il segno "già scaricato", quei riquadri non vengono
     più richiesti: si torna indietro e la zona è vuota, per sempre.
     È il motivo per cui la mappa si svuotava spostandosi. */
  /* Contano solo i punti che vengono davvero dall'archivio.
     Le fontanelle aggiunte dalle persone non se ne vanno mai dalla
     memoria: contandole anche qui, tenevano il loro riquadro segnato
     come "già scaricato" pur essendo rimaste sole — ed è esattamente
     perché tornando a Milano si vedevano soltanto quelle. */
  var ancoraPieni = {};
  points.forEach(function(p){ if(p.tile) ancoraPieni[p.tile] = 1; });
  Object.keys(tilesLoaded).forEach(function(k){
    if(tilesLoaded[k] === 'ok' && !ancoraPieni[k]) delete tilesLoaded[k];
    // i "mancanti" li gestisce il timer dei tre minuti, non si toccano qui
  });
}
function nearest(){
  if(!myPos) return null;
  var best=null,bd=Infinity;
  visible().forEach(function(p){
    if(p.tags.drinking_water==='no') return;
    var sq=stateOf(p).s;
    if(sq==='broken' || sq==='works' || sq==='missing') return;
    var d=dist(myPos,p); if(d<bd){bd=d;best=p;}
  });
  return best?{p:best,d:bd}:null;
}
/* Oltre questa distanza, una fontanella non è più "la più vicina":
   è solo l'unica che l'app conosce. Proporre un punto d'acqua a
   novantasei chilometri è peggio che non proporne nessuno. */
var TROPPO_LONTANA = 15000;

/* C'è qualcosa nel pezzo di mappa che si sta guardando adesso? */
function vistaVuota(){
  if(!map || !map.getBounds) return true;
  var b = map.getBounds();
  return !visible().some(function(p){
    return p.lat >= b.getSouth() && p.lat <= b.getNorth() &&
           p.lon >= b.getWest()  && p.lon <= b.getEast();
  });
}

function showNearest(){
  var n = nearest();
  if(!n || n.d > TROPPO_LONTANA){
    hideCard();
    /* Il cartello dice "qui non risulta niente" e offre di aggiungerne
       una nel punto inquadrato: ha senso solo se è vuoto QUELLO. Prima
       bastava che fosse lontana la fontanella più vicina a te, e così
       chi guardava il Piemonte stando a Milano se lo vedeva comparire
       sopra una mappa piena di segnaposti. */
    if(vistaVuota()) mostraNessunaQui(); else nascondiNessunaQui();
    return;
  }
  nascondiNessunaQui();
  fillCard(n.p, n.d, true);
}

/* Quando qui intorno non risulta niente, l'app deve dirlo — e dire anche
   che è una lacuna della mappa, non l'assenza di acqua. Chi conosce quel
   posto meglio di chiunque altro è proprio chi ci si trova adesso. */
function mostraNessunaQui(){
  if(document.getElementById('nessunaQui')) return;
  if(!map || !map.getZoom || map.getZoom() < 11) return;   // troppo alti per dirlo
  var d = document.createElement('div');
  d.id = 'nessunaQui';
  d.innerHTML =
    '<div class="nq-t">Qui non risulta mappata nessuna fontanella</div>'+
    '<div class="nq-s">Non vuol dire che non ce ne siano: vuol dire che '+
    'nessuno le ha ancora segnalate.</div>'+
    '<button class="nq-b" id="nqAggiungi">Aggiungine una</button>';
  document.body.appendChild(d);
  document.getElementById('nqAggiungi').onclick = function(){
    nascondiNessunaQui();
    if(typeof startAdd === 'function') startAdd();
  };
}

function nascondiNessunaQui(){
  var d = document.getElementById('nessunaQui');
  if(d) d.remove();
}
/* La card ha tre stati: nascosta, piccola, aperta.
   Lo stato lo decide chi guarda, e resta finché non lo cambia lui. */
var cardAperta = false;

function hideCard(){
  document.getElementById('card').classList.add('hidden');
  document.body.classList.add('card-hidden');
  document.body.classList.remove('card-mini');
}
function apriCard(){
  cardAperta = true;
  var c = document.getElementById('card');
  if(!c) return;
  c.classList.remove('mini');
  document.body.classList.remove('card-mini');
  var r = document.getElementById('rigaMini');
  if(r) r.setAttribute('aria-expanded','true');
  // niente suono qui: aprire una scheda è un gesto di lettura, non un
  // contributo. I suoni restano dove confermano che qualcosa è partito.
}
function riduciCard(){
  cardAperta = false;
  var c = document.getElementById('card');
  if(!c) return;
  c.classList.add('mini');
  document.body.classList.add('card-mini');
  var r = document.getElementById('rigaMini');
  if(r) r.setAttribute('aria-expanded','false');
}
function fillCard(p,d,isNearest){
  var min=d!=null?walkMin(d):null;
  document.getElementById('cEyebrow').textContent =
    isNearest ? (p.kind==='casa'?"La più vicina · casa dell'acqua":'La più vicina · fontanella')
              : (p.kind==='casa'?"Casa dell'acqua":'Fontanella');
  var incerta = myPos && myPos.acc > SOGLIA_INCERTA;
  document.getElementById('cHead').innerHTML =
    (isNearest && min!=null)
      ? (incerta ? 'Circa <b>'+min+' minut'+(min===1?'o':'i')+'</b> '+MODI[modo].nome
                 : 'A <b>'+min+' minut'+(min===1?'o':'i')+'</b> '+MODI[modo].nome)
      : esc(labelFor(p));
  var sub=[]; if(isNearest) sub.push(labelFor(p));
  if(d!=null) sub.push(fmtDist(d)+(isNearest?'':' · '+walkMin(d)+' min '+MODI[modo].nome));
  if(myPos && myPos.acc > SOGLIA_INCERTA) sub.push('posizione approssimativa');
  document.getElementById('cSub').textContent=sub.join(' · ');
  var tw=document.getElementById('cTags');
  // lo stato occupa la sua riga per intero, le etichette la riga sotto:
  // prima erano tutti dentro lo stesso allineamento orizzontale e le
  // pastiglie venivano stirate in altezza come lo stato
  tw.innerHTML = rigaStato(p) +
    '<div class="tags">' +
    senzaStato(tagsFor(p)).slice(0,3).map(function(t){
      return '<span class="tag'+(t.c?' '+t.c:'')+'">'+esc(t.s)+'</span>';
    }).join('') + '</div>';
  document.getElementById('cActions').innerHTML=
    '<div class="modeseg" id="cMode">'+
      '<button data-m="piedi"'+(modo==='piedi'?' class="on"':'')+'>A piedi</button>'+
      '<button data-m="auto"'+(modo==='auto'?' class="on"':'')+'>In auto</button></div>'+
    '<div style="display:flex;gap:8px;width:100%;margin-top:11px">'+
      '<a class="btn primario" id="cNav" href="'+navUrl(p,'g')+'" target="_blank" rel="noopener">'+
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>'+
        'Portami</a>'+
      '<button class="btn ghost" id="cOpen">Dettagli</button></div>';
  document.getElementById('cActions').style.flexWrap='wrap';
  document.getElementById('cOpen').onclick=function(){ openSheet(p); };

  // la riga piccola: una frase sola, quella che serve davvero
  var mp = document.getElementById('miniPrimo');
  if(!mp) return;
  mp.innerHTML =
    (isNearest && min!=null)
      ? '<b>'+min+' min</b> '+MODI[modo].nome+' · '+esc(labelFor(p))
      : esc(labelFor(p));
  var sec = [];
  if(d!=null) sec.push(fmtDist(d));
  var fs = fraseStato(p);
  var breve = {'Confermata funzionante':'funziona','Segnalata rotta':'rotta',
               'Lavori in corso':'lavori','Nessuno riesce a trovarla':'non si trova',
               'Una segnalazione di guasto':'rotta','Rimossa':'rimossa',
               'Controllata sul posto':'controllata',
               "Non l'ha ancora controllata nessuno":'mai controllata'}[fs.t] || fs.t.toLowerCase();
  sec.push(fs.q ? breve+' · '+fs.q : breve);
  if(myPos && myPos.acc > SOGLIA_INCERTA) sec.push('posizione approssimativa');
  var ms = document.getElementById('miniSecondo');
  if(ms) ms.textContent = sec.join(' · ');
  document.getElementById('cMode').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      modo=b.getAttribute('data-m');
      store.set('idr_modo', modo);
      if(selected) openSheet(p); else showNearest();
    };
  });
  document.getElementById('card').classList.remove('hidden');
  document.body.classList.remove('card-hidden');
  // rispetta lo stato scelto da chi guarda, non lo riapre di sua iniziativa
  if(cardAperta) apriCard(); else riduciCard();
}
function navUrl(p,which){
  var M=MODI[modo];
  if(which==='a') return 'https://maps.apple.com/?daddr='+p.lat+','+p.lon+'&dirflg='+M.a;
  return 'https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lon+'&travelmode='+M.g;
}

/* ============================================================
   SHEET DETTAGLIO
   ============================================================ */
var STARS=[['findability','Facile da raggiungere'],
           ['cleanliness','Stato della fontana'],
           ['taste',"Qualità dell'acqua"]];

/* La temperatura non è un voto: è una descrizione. Tre scelte, non cinque
   stelle, perché "tre stelle di temperatura" non vuol dire niente.
   Sotto resta un numero (1/3/5) solo perché è così che sta nel database. */
var TEMPI = [[1,'Calda'],[3,'Ambiente'],[5,'Fresca']];
function nomeTemperatura(media){
  if(media == null) return null;
  if(media < 2.34) return {c:'calda',    t: media < 1.5 ? 'Calda' : 'Perlopiù calda'};
  if(media < 3.67) return {c:'ambiente', t:'Temperatura ambiente'};
  return {c:'fresca', t: media > 4.5 ? 'Fresca' : 'Perlopiù fresca'};
}
/* Il voto complessivo tiene conto solo dei tre giudizi veri. */
function mediaVera(r){
  var v = [r.findability, r.cleanliness, r.taste].filter(function(x){ return x != null; });
  if(!v.length) return null;
  return Math.round(v.reduce(function(a,b){ return a + (+b); }, 0) / v.length * 10) / 10;
}

function starSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>'; }

  h+='<div class="actions" style="margin-top:8px">'+

  /* L'ordine segue il gesto: prima le stelle e la temperatura, poi i

     '<div class="hint">Vota solo quello che vuoi, anche una stella sola. '+
     'Il giudizio sull\'acqua è l\'esperienza di chi ha bevuto, non un\'analisi di laboratorio: '+
     'se l\'acqua ti sembra sospetta non berla e segnala la fontanella.</div></div>';

  h+='<div class="sec" id="bloccoFoto"><div class="sec-t">Aggiungi una foto</div>'+
     '<label class="btn-foto" for="photoFile">'+
       '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
       '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'+

/* Il pulsante che conta prima di chiudere. Serve a far vedere che è
   successo qualcosa e a dare il tempo di accorgersene, invece di far
   sparire il pannello di colpo come se non fosse mai esistito. */
function contoAllaRovescia(bottone, primaRiga, secondi, poi){
  if(!bottone){ poi(); return; }
  var n = secondi || 3;
  bottone.classList.add('conta');
  bottone.innerHTML = '<span class="c-testo">'+primaRiga+'</span>';
  if(suoniAccesi) tick(880, .12);

  setTimeout(function(){ passo(); }, 620);

  function passo(){
    if(n <= 0){
      bottone.classList.remove('conta');
      poi();
      return;
    }
    bottone.innerHTML = '<span class="c-testo">'+primaRiga+'</span>'+
                        '<span class="c-num">'+n+'</span>';
    if(suoniAccesi) tick(520 + n*90, .07);
    n--;
    setTimeout(passo, 620);
  }
}

/* Il ringraziamento a schermo intero. Si chiude da solo, o al tocco per
   chi ha fretta: nessuno deve restare bloccato a guardarlo. */
var timerGrazie = null;
function grazie(titolo, testo, quanto){
  var box = document.getElementById('grazie');
  if(!box) return;
  document.getElementById('gTitolo').textContent = titolo;
  document.getElementById('gTesto').textContent  = testo;
  var n = quanto == null ? contributi() : quanto;
  document.getElementById('gConto').textContent =
    n > 1 ? 'È il tuo ' + n + '° contributo.' : 'Il primo di tanti, speriamo.';
  box.classList.add('on');
  if(suoniAccesi) suonoGoccia();
  vibra(30);
  clearTimeout(timerGrazie);
  timerGrazie = setTimeout(chiudiGrazie, 2800);
}
function chiudiGrazie(){
  clearTimeout(timerGrazie);
  var box = document.getElementById('grazie');
  if(box) box.classList.remove('on');
}

/* Il segnaposto batte due volte: vedere l'effetto di quello che hai fatto
   vale più di qualsiasi messaggio. */
function festeggia(p){
  setTimeout(function(){
    var pin = document.querySelector('.leaflet-marker-icon .pin.sel');
    if(pin) pin.classList.add('appena');
  }, 60);
}

/* Le pastiglie in cima alla scheda, aggiornate senza toccare il resto. */
function aggiornaEtichette(p){
  // la testa si rifà intera: stato, voto e prova cambiano insieme
  var c = document.querySelector('#sheetBody .coppia');
  if(c){
    var vecchiaFascia = document.querySelector('#sheetBody .verifica-foto');
    if(vecchiaFascia) vecchiaFascia.remove();
    var vecchiaGriglia = document.querySelector('#sheetBody .info-griglia');
    if(vecchiaGriglia) vecchiaGriglia.remove();
    c.outerHTML = testaScheda(p) + riquadriInfo(p);
  }
  var w = document.querySelector('#sheetBody .tags');
  if(w) w.innerHTML = senzaStato(tagsFor(p)).map(function(t){
    return '<span class="tag'+(t.c?' '+t.c:'')+'">'+esc(t.s)+'</span>';
  }).join('');
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  selected=null; render();
}
/* Solo il riquadro dello stato. Rigenerare tutta la scheda cancellerebbe
   la foto scelta e le stelle già toccate: l'ordine con cui uno compila
   è affar suo. */
function renderStato(p){
  var w = document.getElementById('statoBox');
  if(!w) return;
  var mio = myVotes[p.target];
  var h = '';   // la data sta già nella riga di stato, in cima alla scheda

  /* Sui pulsanti che aprono la fotocamera si mette una macchina
     fotografica: così si capisce cosa succede PRIMA di premere, invece
     di scoprirlo quando lo schermo cambia di colpo. "Funziona" non ce
     l'ha, perché non chiede niente. */
  function b(id, cls, val, testo){
    var conFoto = !!STATI_CON_PROVA[val];
    return '<button class="btn '+cls+(mio===val?' scelto':'')+'" id="'+id+'"'+
           (mio===val?' aria-pressed="true"':'')+'>'+
           (conFoto ? '<svg class="ic-cam" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+
                      '<path d="'+IC_CAMERA+'" fill-rule="evenodd"/></svg>' : '')+
           '<span>'+testo+'</span></button>';
  }
  h += '<div class="state3">'+
       b('voteOk','ok','ok','Funziona')+
       b('voteWk','works','works','Lavori')+
       b('voteKo','bad','broken','Rotta')+'</div>'+
       '<div class="statebox" style="margin-top:6px">'+
       b('voteNo','ghost','missing','Sono qui e non la trovo')+'</div>';

  /* Una segnalazione in attesa non sparisce: chi passa di qui deve
     sapere che qualcuno ha segnalato qualcosa, senza che la fontanella
     venga dichiarata rotta sulla parola di uno solo. */
  var ag = statusAgg[p.target];
  if(ag && ag.in_verifica){
    var che = {broken:'un guasto', works:'dei lavori', missing:'che non si trova'}[ag.in_verifica] || 'qualcosa';
    h += '<div class="in-verifica"><b>Segnalato '+che+', in verifica.</b>'+
         '<span>È arrivata con una foto e sta aspettando il controllo. '+
         'Fino ad allora la fontanella resta com\'era.</span></div>';
  }

  if(mio){
    var nomi = {ok:'funzionante', works:'in lavori', broken:'rotta', missing:'non trovata'};
    var n = contributi();
    h += '<div class="grazie">Grazie: adesso chi arriva qui sa che è <b>'+nomi[mio]+'</b>.'+
         (n > 1 ? '<span>Hai dato una mano '+n+' volte.</span>' : '')+'</div>';
    h += '<div class="hint">Ti sei sbagliato o è cambiata? Tocca un\'altra voce e la tua '+
         'segnalazione viene corretta: non se ne aggiunge una seconda.</div>';
  } else {
    h += '<div class="hint"><b>Lavori</b> se c\'è un cantiere o è transennata: non è rotta, tornerà. '+
         '<b>Non la trovo</b> se al suo posto non c\'è più niente: forse è stata rimossa.</div>';
  }
  w.innerHTML = h;

  // sempre cliccabili: si può cambiare idea quante volte si vuole
  document.getElementById('voteOk').onclick=function(){ sendReport(p,'ok'); };
  document.getElementById('voteWk').onclick=function(){ sendReport(p,'works'); };
  document.getElementById('voteKo').onclick=function(){ sendReport(p,'broken'); };
  document.getElementById('voteNo').onclick=function(){ sendReport(p,'missing'); };
}

function renderAgg(p){
  var r=reviewAgg[p.target], w=document.getElementById('aggWrap');
  if(!r||!r.n){ w.innerHTML='<div class="empty">Ancora nessun voto. Il primo puoi darlo tu.</div>'; return; }
  var h='';

    var v=r[s[0]];
    h+='<div class="starrow"><span>'+s[1]+'</span>'+
       '<div class="bar"><i style="width:'+((v||0)/5*100)+'%"></i></div>'+
       '<span style="font-weight:600;min-width:26px;text-align:right">'+(v!=null?String(v).replace('.',','):'–')+'</span></div>';
  });
  var nt = nomeTemperatura(r.temperature);
  if(nt) h+='<div class="temprow"><span>Temperatura dell\'acqua</span>'+
            '<span class="tempval '+nt.c+'">'+nt.t+'</span></div>';
  h+='<div style="margin-top:10px">'+
     (r.last_review?bollo(r.last_review,'ultimo voto'):'')+'</div>';
  w.innerHTML=h;
}

var dettagliAgg = {};      // quello che ha detto la gente, per fontanella
var mieiDettagli = {};     // quello che ho detto io, per vederlo subito

function dettaglioDi(p, campo){
  var mio = mieiDettagli[p.target] && mieiDettagli[p.target][campo];
  if(mio !== undefined) return mio;
  var d = dettagliAgg[p.target];
  if(d && d[campo] !== null && d[campo] !== undefined) return d[campo];
  // niente risposte: si ricade su quello che dice OpenStreetMap
  var t = p.tags || {};
  if(campo === 'accessibile'){
    if(t.wheelchair === 'yes') return true;
    if(t.wheelchair === 'no')  return false;
    return null;
  }
  if(t.dog === 'yes' || t.bowl === 'yes' || t['drinking_water:dog'] === 'yes') return true;
  return null;
}

function renderDettagli(p){
  var w = document.getElementById('dettagliBox');
  if(!w) return;
  var voci = [
    {campo:'accessibile', icona:IC_ACCESSO, testo:'Accessibile'},
    {campo:'cani',        icona:IC_CANE,    testo:'Vaschetta cani'}
  ];
  w.innerHTML = '<div class="dett-riga">' + voci.map(function(v){
    var val = dettaglioDi(p, v.campo);
    return '<button class="dett-b'+(val === true ? ' si' : val === false ? ' no' : '')+'" '+
           'data-campo="'+v.campo+'" aria-pressed="'+(val === true ? 'true' : 'false')+'">'+
           '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">'+
           '<path d="'+v.icona+'" fill-rule="evenodd"/></svg>'+
           '<span>'+v.testo+'</span></button>';
  }).join('') + '</div>' +
  '<div class="hint" style="margin-top:6px">Tocca se c\'è, ritocca se ti sei sbagliato.</div>';

  w.querySelectorAll('.dett-b').forEach(function(b){
    b.onclick = function(){ inviaDettaglio(p, b.getAttribute('data-campo'), b); };
  });
}

function inviaDettaglio(p, campo, bottone){
  if(needSB()) return;
  var adesso = dettaglioDi(p, campo);
  var nuovo = (adesso === true) ? false : true;   // acceso -> spento -> acceso

  // si mostra subito: chi tocca deve vedere l'effetto, non aspettare il server
  if(!mieiDettagli[p.target]) mieiDettagli[p.target] = {};
  mieiDettagli[p.target][campo] = nuovo;
  renderDettagli(p);
  render();

  SB.rpc('dettaglio', Object.assign({
    p_target: p.target, p_campo: campo, p_valore: nuovo, p_client: CLIENT
  }, (function(){ var f = firma(p); return {p_device: f.device, p_distanza: f.distanza}; })()))
   .then(function(){
     if(suoniAccesi) tick(760, .10);
     caricaDettagli(p);
   })
   .catch(function(err){
     // non ha funzionato: si torna indietro invece di mentire
     mieiDettagli[p.target][campo] = adesso;
     renderDettagli(p);
     render();
     toast(String(err && err.message || 'Non sono riuscito a salvare.').slice(0,120), 4000);
   });
}

function caricaDettagli(p){
  if(!SB.on()) return;
  SB.select('v_dettagli?select=*&target=eq.'+encodeURIComponent(p.target))
    .then(function(rows){
      if(rows && rows.length) dettagliAgg[p.target] = rows[0];
      renderDettagli(p);
      render();
    });
}

var myRating={};
function renderMyStars(){
  myRating={};
  var h='';
  STARS.forEach(function(s){
    h+='<div class="starrow"><span>'+s[1]+'</span><div class="stars" data-k="'+s[0]+'">';
    for(var i=1;i<=5;i++) h+='<button class="star" data-v="'+i+'" aria-label="'+i+' stelle">'+starSvg()+'</button>';
    h+='</div></div>';
  });
  h+='<div class="starrow" style="display:block;padding-top:12px">'+
     '<span style="display:block;margin-bottom:7px">Temperatura dell\'acqua</span>'+
     '<div class="tempseg" id="tempSeg">'+
       TEMPI.map(function(t){ return '<button data-v="'+t[0]+'">'+t[1]+'</button>'; }).join('')+
     '</div></div>';

  var w=document.getElementById('myStars'); w.innerHTML=h;

  var seg=document.getElementById('tempSeg');
  seg.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      var v=+b.getAttribute('data-v');
      // ritoccando la stessa scelta la si annulla
      if(myRating.temperature===v){ delete myRating.temperature; b.classList.remove('on'); return; }
      myRating.temperature=v;
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    };
  });
  w.querySelectorAll('.stars').forEach(function(row){
    row.querySelectorAll('.star').forEach(function(b){
      b.onclick=function(){
        var k=row.getAttribute('data-k'), v=+b.getAttribute('data-v');
        myRating[k]=v;
        row.querySelectorAll('.star').forEach(function(x){
          x.classList.toggle('on', +x.getAttribute('data-v')<=v);
        });
      };
    });
  });
}
/* Una fotografia invecchia: in tre mesi cambiano i lavori, le siepi, i
   cartelli, e a volte la fontanella stessa. Passati novanta giorni, chi
   ci passa può sostituirla; prima no, altrimenti si accumulano dieci
   scatti uguali dello stesso giorno. */
var GIORNI_FOTO = 90;

function aggiornaBloccoFoto(p, dataUltima){
  var sez = document.getElementById('bloccoFoto');
  if(!sez) return;
  var eti = sez.querySelector('.sec-t');
  var bottone = sez.querySelector('.btn-foto');
  var nota = sez.querySelector('.hint');
  if(!bottone) return;

  var giorni = dataUltima ? daysAgo(dataUltima) : null;

  if(giorni == null){
    if(eti) eti.textContent = 'Aggiungi una foto';
    bottone.classList.remove('bloccato');
    bottone.lastChild.textContent = 'Scatta o scegli una foto';
    if(nota) nota.innerHTML = 'È la cosa che aiuta di più a ritrovarla. '+
      'Fotografa la fontanella: niente persone e niente targhe, altrimenti non viene pubblicata.';
    return;
  }

  if(giorni >= GIORNI_FOTO){
    if(eti) eti.textContent = 'La foto è vecchia: aggiornala';
    bottone.classList.remove('bloccato');
    bottone.lastChild.textContent = 'Scatta una foto aggiornata';
    if(nota) nota.innerHTML = 'L\'ultima è di <b>'+esc(agoText(giorni))+'</b>. '+
      'Se nel frattempo è cambiato qualcosa, una foto nuova vale più di mille parole.';
  } else {
    var mancano = GIORNI_FOTO - giorni;
    if(eti) eti.textContent = 'La foto è recente';
    bottone.classList.add('bloccato');
    bottone.lastChild.textContent = 'Si potrà aggiornare fra ' +
      (mancano > 45 ? Math.round(mancano/30)+' mesi'
       : mancano > 1 ? mancano+' giorni'
       : 'un giorno');

/* ---------- invii ---------- */
function needSB(){
  if(SB.on()) return false;
  toast('Le segnalazioni non sono ancora attive su questo sito.',3800);
  return true;
}
var COLONNA = {ok:'ok_votes', works:'works_votes', broken:'broken_votes', missing:'missing_votes'};

/* Gli stati che richiedono una prova fotografica. "Funziona" no: è la
   conferma positiva, e se è sbagliata al massimo qualcuno fa un viaggio
   a vuoto. Gli altri allontanano la gente da una fontanella, quindi
   devono costare qualcosa a chi li scrive. */
var STATI_CON_PROVA = {broken:1, works:1, missing:1};

function sendReport(p,status){
  if(needSB()) return;
  var precedente = myVotes[p.target];
  if(precedente === status) return;      // ha ritoccato la stessa voce

  /* Serve la fotografia: invece di dire "serve una foto" e lasciare la
     persona a cercarsi il pulsante, si apre direttamente la fotocamera.
     Chi è davanti a una fontanella rotta ce l'ha già in mano. */
  if(STATI_CON_PROVA[status]){
    var ingresso = document.getElementById('fotoGuasto');
    if(!ingresso){ toast('Non riesco ad aprire la fotocamera su questo dispositivo.', 4000); return; }
    ingresso.value = '';
    ingresso.onchange = function(ev){
      var file = ev.target.files && ev.target.files[0];
      ingresso.onchange = null;
      if(!file) return;                       // ha annullato: non succede niente
      mandaSegnalazioneConFoto(p, status, file);
    };
    ingresso.click();
    return;
  }

  mandaSegnalazione(p, status, null, null);
}

/* Prima la fotografia, poi la segnalazione: se la foto non parte, non si
   scrive niente — meglio nessuna segnalazione che una segnalazione senza
   la prova che le dà valore. */
function mandaSegnalazioneConFoto(p, status, file){
  bloccaStato(true);
  toast('Preparo la foto…', 6000);
  comprimiBene(file).then(function(blob){
    var nome = 'problemi/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.jpg';
    return SB.upload(blob, nome).then(function(url){
      return mandaSegnalazione(p, status, nome, url);
    });
  }).catch(function(err){
    bloccaStato(false);
    toast('Foto non caricata: ' + String(err && err.message || 'riprova').slice(0,100), 5000);
  });
}

function bloccaStato(si){
  ['voteOk','voteWk','voteKo','voteNo'].forEach(function(id){
    var b=document.getElementById(id); if(b) b.disabled = !!si;
  });
}

function mandaSegnalazione(p, status, fotoPath, fotoUrl){
  var precedente = myVotes[p.target];

  bloccaStato(true);

  // la scrittura la fa il database: corregge la riga di questo
  // dispositivo e nessun'altra
  var f = firma(p);
  return SB.rpc('segnala', {p_target:p.target, p_status:status, p_client:CLIENT,
                     p_device:f.device, p_distanza:f.distanza,
                     p_photo_path:fotoPath || null, p_photo_url:fotoUrl || null})
    .then(function(){
      myVotes[p.target]=status;
      var a=statusAgg[p.target]||{target:p.target,ok_votes:0,broken_votes:0,works_votes:0,missing_votes:0};
      // se stava correggendo, il vecchio voto se ne va
      if(precedente && COLONNA[precedente])
        a[COLONNA[precedente]] = Math.max(0, (a[COLONNA[precedente]]||0) - 1);
      a[COLONNA[status]] = (a[COLONNA[status]]||0) + 1;
      if(status==='works')   a.last_works   = new Date().toISOString();
      if(status==='missing') a.last_missing = new Date().toISOString();
      a.last_report=new Date().toISOString();
      statusAgg[p.target]=a;
      /* Le segnalazioni con foto non sono pubbliche finché non vengono
         controllate: dirlo subito evita che qualcuno torni fra un'ora,
         non veda cambiato niente e pensi che il suo contributo sia
         andato perso. */
      if(STATI_CON_PROVA[status]){
        a.in_verifica = status;
        a.in_verifica_quando = new Date().toISOString();
        toast('Segnalazione e foto ricevute. Compare a tutti appena controllata.', 5000);
      } else {
        toast(precedente ? 'Segnalazione corretta. Grazie.'
                         : 'Segnata come funzionante. Grazie.', 4200);
      }
      // si aggiorna solo il riquadro dello stato: foto e stelle restano dove sono
      if(!precedente) contaContributo();
      renderStato(p);
      aggiornaEtichette(p);
      render();
      festeggia(p);
    })
    .catch(function(err){
      bloccaStato(false);
      toast('Non è partita: '+(err.message||'riprova').slice(0,90), 5000);
      throw err;
    });
}
function sendReview(p){
  if(needSB()) return;
  var keys=Object.keys(myRating);
  if(!keys.length){ toast('Tocca almeno una stella prima di inviare.'); return; }
  var row=Object.assign({target:p.target, client_id:CLIENT,
    comment:(document.getElementById('revComment').value||'').trim()||null}, firma(p));
  STARS.forEach(function(s){ row[s[0]]=myRating[s[0]]||null; });
  row.temperature = myRating.temperature || null;
  // tutto è facoltativo: si può mandare anche una sola voce
  var b=document.getElementById('revSend'); b.disabled=true; b.textContent='Invio…';

  function riuscito(){
    var n = contaContributo();
    loadSupabase({lat:p.lat, lon:p.lon});
    festeggia(p);

    var com = document.getElementById('revComment');
    if(com) com.disabled = true;

    // Il pulsante conta prima di chiudere: si vede che è successo qualcosa.
    contoAllaRovescia(document.getElementById('revSend'), '✓ Voto inviato!', 3, function(){
      if(fotoInCorso) return;      // se sta ancora caricando una foto, resta aperta
      closeSheet();
      grazie('Voto registrato',
             'Adesso chi cerca acqua da queste parti sa cosa aspettarsi.', n);
    });
  }
  function fallito(err){
    b.disabled=false; b.textContent='Invia il voto';
    toast('Non è partita: '+(err && err.message ? err.message : 'riprova').slice(0,120), 6000);
  }

  SB.insert('reviews', row)
    .then(riuscito)
    .catch(function(err){
      var m = (err && err.message ? err.message : '').toLowerCase();
      // Se il database non conosce ancora la colonna temperature (schema
      // appena modificato e cache non ricaricata), rimando il voto senza
      // quella stella invece di far perdere tutto all'utente.
      if(m.indexOf('temperature') > -1 || m.indexOf('column') > -1 || m.indexOf('pgrst204') > -1){
        var ridotta = {};
        Object.keys(row).forEach(function(k){ if(k!=='temperature') ridotta[k]=row[k]; });
        return SB.insert('reviews', ridotta).then(riuscito).catch(fallito);
      }
      fallito(err);
    });
}
/* Quanto deve pesare la foto di una fontanella.
   Non è una fotografia d'autore: serve a riconoscere il posto e a dare
   corpo a una segnalazione. Mille pixel sul lato lungo e una qualità
   media bastano — e chi la guarda per strada, spesso in rete mobile,
   ringrazia. Se il risultato resta pesante, si ricomprime finché non
   sta sotto il tetto. */
/* ============================================================
   LA COMPRESSIONE DELLE FOTO
   Due regole, e vengono prima di tutto il resto.

   1. Una foto non viene MAI rifiutata perché pesa troppo.
      Chi scatta col telefono non sceglie quanto pesa lo scatto e non
      ha alcun modo di rimediare: rifiutarlo vorrebbe dire dare la colpa
      a chi non ne ha. Se serve si scende di qualità e di dimensioni
      finché entra, e alla peggio si carica la versione più piccola che
      si è ottenuta. Una foto sgranata vale infinitamente più di
      nessuna foto.

   2. Deve essere leggera, non bella.
      Serve a far riconoscere la fontanella dentro un riquadro largo
      poco più di trecento punti — è un'indicazione, non una stampa.
      ============================================================ */
var FOTO_OBIETTIVO    = 110 * 1024;        // il peso a cui si punta
var FOTO_LATO         = 900;               // lato lungo di partenza
var FOTO_INGRESSO_MAX = 60 * 1024 * 1024;  // solo per non piantare il telefono

/* La scala, dal più bello al più leggero. Si prende il primo gradino
   che sta sotto l'obiettivo. Gli ultimi stringono anche le dimensioni:
   servono alle fotografie molto dettagliate — fogliame, ghiaia, folla —
   che con la sola qualità non scenderebbero mai. All'ultimo gradino
   qualunque scatto al mondo è leggero. */
var FOTO_GRADINI = [
  {lato:900, q:.60},
  {lato:900, q:.48},
  {lato:900, q:.38},
  {lato:780, q:.38},
  {lato:660, q:.36},
  {lato:560, q:.34},
  {lato:460, q:.30}
];

/* La fotografia si decodifica una volta sola per ogni dimensione: è
   l'operazione cara sul telefono, e rifarla a ogni gradino farebbe
   aspettare chi sta caricando. */
function disegnaSuTela(file, maxPx){
  return conScadenza(new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,maxPx/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('immagine illeggibile')); };
    img.src=url;
  }), 25, 'Non riesco a leggere questa foto. Provane un\'altra.');
}

function daTela(tela, q){
  return new Promise(function(res,rej){
    tela.toBlob(function(b){ b?res(b):rej(new Error('canvas')); }, 'image/jpeg', q);
  });
}

function comprimiBene(file){
  if(file.size > FOTO_INGRESSO_MAX)
    return Promise.reject(new Error('Questa immagine è troppo grande da aprire (' +
      Math.round(file.size / 1048576) + ' MB). Riprova con uno scatto della fotocamera.'));

  var migliore = null, tele = {};

  function tela(lato){
    if(tele[lato]) return Promise.resolve(tele[lato]);
    return disegnaSuTela(file, lato).then(function(c){ tele[lato] = c; return c; });
  }

  function gradino(i){
    // finiti i gradini si consegna il più leggero ottenuto: mai un rifiuto
    if(i >= FOTO_GRADINI.length) return Promise.resolve(migliore);
    var g = FOTO_GRADINI[i];
    return tela(g.lato).then(function(c){ return daTela(c, g.q); }).then(function(b){
      if(!migliore || b.size < migliore.size) migliore = b;
      if(b.size <= FOTO_OBIETTIVO) return b;
      return gradino(i + 1);
    }).catch(function(){
      // un gradino può fallire per memoria: si prova il successivo,
      // che è più piccolo, invece di far fallire tutto il caricamento
      return gradino(i + 1);
    });
  }

  return gradino(0).then(function(b){
    if(b) return b;
    throw new Error('Non riesco a preparare questa foto. Provane un\'altra.');
  });
}

/* Resta per compatibilità: qualcuno potrebbe ancora chiamarla. */
function shrink(file,maxPx,q){
  return disegnaSuTela(file, maxPx).then(function(c){ return daTela(c, q); });
}

  document.getElementById('crosshair').classList.add('on');

function stopAdd(){
  adding=false; addPhoto=null;
  document.getElementById('addbar').classList.remove('on');
  document.getElementById('crosshair').classList.remove('on');

  showNearest();
}

/* ============================================================
   CONDIVIDERE UNA FONTANELLA
   Il link porta chi lo riceve esattamente su questo punto,
   non sulla sua posizione.
   ============================================================ */
function linkDi(p){
  var base = location.origin + location.pathname;
  return base + '?f=' + encodeURIComponent(p.target);
}
function condividi(p){
  var url = linkDi(p);
  var titolo = labelFor(p);
  var testo = 'Acqua potabile: ' + titolo;
  if(navigator.share){
    navigator.share({title:'IDRATATI', text:testo, url:url})
      .catch(function(e){
        // se ha solo annullato non serve dire niente; se è andata storta sì
        if(e && e.name === 'AbortError') return;
        if(navigator.clipboard){
          navigator.clipboard.writeText(url)
            .then(function(){ toast('Link copiato negli appunti.', 3600); })
            .catch(function(){ toast(url, 8000); });
        } else toast(url, 8000);
      });
    return;
  }
  if(navigator.clipboard){
    navigator.clipboard.writeText(url)
      .then(function(){ toast('Link copiato. Incollalo dove vuoi.', 3600); })
      .catch(function(){ toast(url, 8000); });
  } else {
    toast(url, 8000);
  }
}

/* Se si arriva da un link condiviso, si apre subito quella fontanella.
   Se invece arriva da una pagina città, ci si porta sopra quella città. */
function apriDaLink(){
  var c = location.search.match(/[?&]c=(-?[\d.]+),(-?[\d.]+)/);
  if(c){
    map.setView([parseFloat(c[1]), parseFloat(c[2])], 14, {animate:false});
    loadArea({lat:parseFloat(c[1]), lon:parseFloat(c[2])});
  }
  var m = location.search.match(/[?&]f=([^&]+)/);
  if(!m) return;
  var target = decodeURIComponent(m[1]);

  function prova(tentativi){
    var p = points.filter(function(x){ return x.target === target; })[0];
    if(p){
      map.setView([p.lat, p.lon], 17, {animate:false});
      openSheet(p);
      return;
    }
    if(tentativi <= 0){ recuperaDaOsm(target); return; }
    setTimeout(function(){ prova(tentativi - 1); }, 700);
  }
  prova(5);
}

/* Il punto non è tra quelli caricati: lo chiedo direttamente a
   OpenStreetMap, così il link funziona anche da dall'altra parte d'Italia. */
function recuperaDaOsm(target){
  if(target.indexOf('osm/node/') !== 0){
    // punto nostro: sta su Supabase
    if(target.indexOf('db/') === 0 && SB.on()){
      SB.select('fountains?select=*&id=eq.'+target.slice(3)).then(function(rows){
        if(!rows.length) return;
        var r = rows[0];
        var p = {id:'db/'+r.id, target:'db/'+r.id, lat:r.lat, lon:r.lon,
                 kind:r.kind, tags:{name:r.name}, ov:r, custom:true};
        addPoints([p]); map.setView([p.lat,p.lon],17); render(); openSheet(p);
      });
    }
    return;
  }
  fetch('https://api.openstreetmap.org/api/0.6/node/'+target.slice(9)+'.json')
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var e = (d.elements||[])[0];
      if(!e) throw new Error('vuoto');
      var tags = e.tags || {};
      var p = {id:'node/'+e.id, target:target, lat:e.lat, lon:e.lon,
               tags:tags, kind:classify(tags)};
      addPoints([p]);
      map.setView([p.lat, p.lon], 17);
      render();
      openSheet(p);
    })
    .catch(function(){ toast('Non trovo la fontanella di quel link.', 4200); });
}

/* ============================================================
   IL METODO VELOCE
   Tieni premuto quattro secondi sulla mappa: il segnaposto si pianta
   lì e parte subito la scheda. Quattro secondi sono tanti apposta,
   così non parte per sbaglio mentre trascini la mappa.
   ============================================================ */
var propMarker=null;

function piazzaSegnaposto(lat, lon){
  if(propMarker) map.removeLayer(propMarker);
  propMarker = L.marker([lat,lon], {
    icon: L.divIcon({className:'', html:'<div class="prop-pin"></div>',
                     iconSize:[34,34], iconAnchor:[17,32]}),
    zIndexOffset:2000, interactive:false
  }).addTo(map);
}

/* Prima di aggiungerne una nuova, guarda se c'è già.
   Trenta metri: la distanza entro cui due segnaposti sono quasi
   sicuramente la stessa fontanella vista da due persone diverse. */
function giaPresente(lat, lon, raggio){
  var vicini = points.filter(function(p){
    return dist({lat:lat, lon:lon}, p) <= (raggio || 30);
  });
  vicini.sort(function(a,b){
    return dist({lat:lat,lon:lon}, a) - dist({lat:lat,lon:lon}, b);
  });
  return vicini[0] || null;
}

function registraQui(lat, lon){
  if(needSB()) return;

  var esistente = giaPresente(lat, lon, 30);
  if(esistente){
    toast('Qui c\'è già ' + labelFor(esistente) + '. Ti apro quella.', 5000);
    if(suoniAccesi) tick(392, .12);
    map.setView([esistente.lat, esistente.lon], 18, {animate:true});
    openSheet(esistente);
    return;
  }

  var preciso = false;
  // Se sei praticamente lì, il GPS sa la posizione meglio del tuo dito.
  if(myPos && dist(myPos, {lat:lat, lon:lon}) < 25){
    lat = myPos.lat; lon = myPos.lon; preciso = true;
  }
  adding = true; addPhoto = null; addKind = 'fontanella';
  hideCard();
  closeSheet();
  piazzaSegnaposto(lat, lon);
  map.panTo([lat, lon], {animate:true});
  document.getElementById('addbar').classList.add('on');
  document.getElementById('crosshair').classList.remove('on');
  confirmAdd({lat:lat, lng:lon});
  toast(preciso ? 'Segnaposto messo sulla tua posizione GPS.'
                : 'Segnaposto piantato qui.', 2600);
}

/* Il gesto ha due tempi.
   Primi sette decimi di secondo: silenzio. Chi trascina la mappa si muove
   entro quel tempo, quindi non vede né sente niente e non fa partire nulla.
   Poi la cornice comincia a chiudersi, e da lì la mano può ballare
   parecchio senza che il conto alla rovescia si interrompa. */
var RITARDO       = 700;    // il tempo che serve a capire che non stai trascinando
var DURATA        = 1300;   // poi il conto alla rovescia della cornice
var TOLL_ATTESA   = 20;     // pixel concessi nella fase silenziosa
var TOLL_CORNICE  = 80;     // pixel concessi una volta partito

function attivaPressioneLunga(){
  var el = map.getContainer(), cornice = document.getElementById('lpfull');
  var attesa = null, conto = null, battiti = [];
  var sx = 0, sy = 0, punto = null, fase = null;

  function ferma(){
    if(attesa){ clearTimeout(attesa); attesa = null; }
    if(conto){  clearTimeout(conto);  conto  = null; }
    battiti.forEach(clearTimeout); battiti = [];
    fase = null;
    vibra(0);
    cornice.classList.remove('on');
  }

  function avvia(x, y){
    if(adding) return;
    ferma();
    sx = x; sy = y; fase = 'attesa';
    var r = el.getBoundingClientRect();
    // Il punto si prende adesso: se poi la mappa scorre un po' sotto il dito,
    // la fontanella indicata resta quella che stavi toccando.
    punto = map.containerPointToLatLng(L.point(x - r.left, y - r.top));

    attesa = setTimeout(function(){
      fase = 'cornice';
      void cornice.offsetWidth;          // riavvio pulito delle animazioni
      cornice.classList.add('on');

      var scala = [440, 554, 659, 880];  // un tocco per ogni lato, sempre più acuto
      tick(scala[0], 0.10);
      battiti = [1,2,3].map(function(i){
        return setTimeout(function(){ tick(scala[i], 0.10 + i*0.02); }, i * 325);
      });
      vibra([10, 315, 14, 311, 18, 307, 22]);

      conto = setTimeout(function(){
        ferma();
        vibra(45);
        suonoGoccia();
        registraQui(punto.lat, punto.lng);
      }, DURATA);
    }, RITARDO);
  }

  function muovi(x, y){
    if(!fase) return;
    var limite = (fase === 'attesa') ? TOLL_ATTESA : TOLL_CORNICE;
    if(Math.abs(x - sx) > limite || Math.abs(y - sy) > limite) ferma();
  }

  el.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ ferma(); return; }
    avvia(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1){ ferma(); return; }
    muovi(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchend',    ferma, {passive:true});
  el.addEventListener('touchcancel', ferma, {passive:true});

  // stesso gesto col mouse, per chi prova da computer
  el.addEventListener('mousedown', function(e){
    if(e.button === 0) avvia(e.clientX, e.clientY);
  });
  el.addEventListener('mousemove', function(e){ muovi(e.clientX, e.clientY); });
  el.addEventListener('mouseup',    ferma);
  el.addEventListener('mouseleave', ferma);
  // Lo zoom è sempre un'altra intenzione; il semplice scorrimento invece
  // lo lascio gestire alla tolleranza qui sopra.
  map.on('zoomstart', ferma);
}

var searchTimer;

  var q=e.target.value.trim();
  clearTimeout(searchTimer);
  if(q.length<3){ document.getElementById('results').classList.remove('on'); return; }
  searchTimer=setTimeout(function(){
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=it&q='+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(rows){
        var w=document.getElementById('results');
        if(!rows.length){
          w.innerHTML='<div style="padding:14px;font-size:13.5px;color:var(--muted)">'+
            'Nessun posto trovato con questo nome.</div>';
          w.classList.add('on');
          return;
        }
        w.innerHTML='';
        rows.forEach(function(r){
          var b=document.createElement('button');
          b.textContent=r.display_name;
          b.onclick=function(){
            var lat = +r.lat, lon = +r.lon;
            map.setView([lat, lon], 15);
            w.classList.remove('on');
            document.getElementById('search').value='';
            document.getElementById('search').blur();

            /* Cercare una città è già una richiesta esplicita: non ha
               senso far comparire il pulsante e chiedere conferma una
               seconda volta. Si carica subito, saltando ogni freno. */
            nascondiCercaQui();
            lastOverpassAt = 0;
            setTimeout(function(){ overpass({lat:lat, lon:lon}); }, 260);
          };
          w.appendChild(b);
        });
        w.classList.add('on');
      }).catch(function(){
        var w=document.getElementById('results');
        w.innerHTML='<div style="padding:14px;font-size:13.5px;color:var(--muted)">'+
          'La ricerca non risponde. Riprova fra un momento.</div>';
        w.classList.add('on');
      });
  },420);
});

var LONTANO_DA_TUTTO = 40000;   // oltre 40 km non si spaccia una città per vicina

function cittaPiuVicina(c){
  var best = null, bd = Infinity;
  for(var i = 0; i < CITTA.length; i++){
    var d = dist(c, {lat: CITTA[i][2], lon: CITTA[i][3]});
    if(d < bd){ bd = d; best = CITTA[i]; }
  }
  return best && bd <= LONTANO_DA_TUTTO ? best : null;
}

function aggiornaNomeCitta(){
  var e = document.getElementById('brandNome');
  if(!e || !map || !map.getCenter) return;
  var c = map.getCenter();
  var citta = cittaPiuVicina({lat: c.lat, lon: c.lng});
  e.textContent = citta ? citta[0] : 'Italia';
}

(function menuCitta(){
  var pannello = document.getElementById('pannelloCitta');
  var elenco   = document.getElementById('pcElenco');
  var cerca    = document.getElementById('pcCerca');
  var apri     = document.getElementById('brand');
  if(!pannello || !elenco || !apri) return;

  function senzaAccenti(s){
    return String(s).toLowerCase()
      .replace(/[àáâä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
      .replace(/[òóôö]/g,'o').replace(/[ùúûü]/g,'u');
  }

  function disegna(filtro){
    var c = map && map.getCenter ? {lat: map.getCenter().lat, lon: map.getCenter().lng} : null;
    var f = senzaAccenti(filtro || '').trim();
    var righe = CITTA.filter(function(x){
      return !f || senzaAccenti(x[0]).indexOf(f) === 0 || senzaAccenti(x[0]).indexOf(f) > 0;
    });
    /* In ordine alfabetico: un elenco di città si scorre cercando un
       nome, e l'ordine per distanza costringe a leggerle tutte.
       La distanza resta scritta accanto a ciascuna. */
    righe = righe.slice().sort(function(a,b){
      return a[0].localeCompare(b[0], 'it', {sensitivity:'base'});
    });
    if(!righe.length){
      elenco.innerHTML = '<div class="pc-vuoto">Nessuna città con questo nome.</div>';
      return;
    }
    elenco.innerHTML = righe.map(function(x){
      var d = c ? dist(c,{lat:x[2],lon:x[3]}) : null;
      var quanto = d == null ? '' : (d < 1000 ? 'qui' : Math.round(d/1000) + ' km');
      return '<button class="pc-riga" data-lat="'+x[2]+'" data-lon="'+x[3]+'">'+
             '<b>'+esc(x[0])+'</b><span>'+esc(x[1])+(quanto ? ' · '+quanto : '')+'</span></button>';
    }).join('');
  }

  function mostra(){
    disegna('');
    cerca.value = '';
    pannello.hidden = false;
    apri.setAttribute('aria-expanded','true');
  }
  function nascondi(){
    pannello.hidden = true;
    apri.setAttribute('aria-expanded','false');
  }

  apri.onclick = mostra;
  document.getElementById('pcChiudi').onclick = nascondi;
  document.getElementById('pcFondo').onclick = nascondi;
  cerca.addEventListener('input', function(){ disegna(cerca.value); });

  elenco.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('.pc-riga') : null;
    if(!b) return;
    var lat = parseFloat(b.getAttribute('data-lat')), lon = parseFloat(b.getAttribute('data-lon'));
    nascondi();
    if(!map) return;
    map.setView([lat, lon], 14, {animate:false});
    /* si è chiesto esplicitamente di andare lì: non ha senso far
       comparire il pulsante "cerca in questa zona" e chiedere conferma */
    nascondiCercaQui();
    lastOverpassAt = 0;
    loadArea({lat:lat, lon:lon});
    render();
    aggiornaNomeCitta();
  });

  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !pannello.hidden) nascondi();
  });
})();
