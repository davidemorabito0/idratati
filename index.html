<style>
:root{
  --ink:#07242F; --ink-2:#123A4A;
  --surface:#F2F7F6; --card:#FFFFFF;
  --acqua:#00A6A6; --acqua-deep:#00807F;
  --getto:#FFB020; --rotta:#E5484D;
  --muted:rgba(7,36,47,.58); --line:rgba(7,36,47,.10);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Inter Tight',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Su iPhone l'altezza della finestra cambia in continuazione: la barra di
   Safari si ritrae, l'app installata ha la sua area sicura in basso. Invece
   di rincorrere quel numero, si inchioda tutto allo schermo. */
/* se per un istante qualcosa non coprisse, sotto c'è il colore della
   mappa e non il bianco: nessuna striscia chiara può comparire */
html{background:#dfe8e7}
/* Nessuna altezza dichiarata, di proposito.
   Quando un elemento ha insieme top, bottom e height, il browser usa top
   e height e butta via bottom. Qualsiasi altezza calcolata — 100%, dvh,
   fill-available — nell'app installata risulta più corta dello schermo
   vero, e la differenza resta scoperta in fondo.
   Ancorando solo cima e fondo la misura è esatta per costruzione, in
   ogni contesto: browser, app installata, con o senza barra. */
html,body{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;margin:0;overflow:hidden;overscroll-behavior:none;
}
body{font-family:var(--body);background:transparent;color:var(--ink);
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none}
/* si scrive solo dove serve scrivere */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acqua);outline-offset:2px}

/* ---------- SPLASH ---------- */
/* La sfumatura chiara resta come fondo: se la fotografia c'è le va sopra,
   se manca o tarda non si vede una schermata vuota. */
#splash{position:fixed;inset:0;z-index:9000;
  background:linear-gradient(135deg,#F6FBFA,#D8EEEC);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .45s ease,visibility .45s;overflow:hidden}
#splash .sfondo{position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity .6s ease}
#splash .sfondo.pronta{opacity:1}
/* un velo chiaro sopra la foto: il nome e lo slogan restano leggibili
   qualunque cosa ci sia nello scatto */
#splash .velo{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(246,251,250,.35),rgba(246,251,250,.72))}
#splash .drop-stage,#splash .wordmark,#splash .tagline{position:relative;z-index:2}
#splash.gone{opacity:0;visibility:hidden}
/* Il marchio sta dentro un disco bianco: così si stacca da qualunque
   fotografia gli finisca dietro, senza dipendere dai colori dello scatto. */
.drop-stage{width:min(54vw,200px);height:min(54vw,200px);
  background:#fff;border-radius:50%;padding:min(6vw,22px);
  box-shadow:0 10px 40px rgba(7,36,47,.22);
  display:flex;align-items:center;justify-content:center}
.drop-stage svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
/* Le due persone arrivano dai lati, la goccia cade fra loro: il logo
   si monta sotto gli occhi di chi apre l'app. */
.figA{animation:daSinistra .7s cubic-bezier(.2,.9,.3,1) both}
.figB{animation:daDestra .7s cubic-bezier(.2,.9,.3,1) .12s both}
.gocciaM{animation:cade .6s cubic-bezier(.4,0,.3,1.4) .5s both}
@keyframes daSinistra{from{transform:translateX(-46px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes daDestra{from{transform:translateX(46px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes cade{from{transform:translateY(-70px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .figA,.figB,.gocciaM{animation:none;opacity:1}
}
.wordmark{position:relative;font-family:var(--display);font-weight:800;
  font-size:clamp(28px,8.6vw,40px);letter-spacing:.15em;color:#07242F;
  margin-left:.15em;line-height:1;white-space:nowrap}
.wordmark span{display:inline-block}
.acc{position:absolute;top:-.30em;left:0;width:.09em;height:.26em;background:var(--acqua-deep);
  border-radius:.05em;transform:rotate(-22deg);transform-origin:50% 100%;
  opacity:0;transition:left .85s cubic-bezier(.65,0,.25,1),opacity .35s ease}
.ver{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:0;right:0;
  text-align:center;font-size:10px;letter-spacing:.1em;color:rgba(7,36,47,.5);
  z-index:9001;cursor:pointer}
.ver a.pvLink{color:inherit;text-decoration:none;pointer-events:auto}
.ver a.pvLink:active{opacity:.6}
#splash.gone ~ .ver{display:none}
.tagline{font-size:clamp(9.5px,2.7vw,11.5px);letter-spacing:.13em;text-transform:uppercase;
  /* misurato sopra la fotografia: il turchese chiaro scendeva a 2,3:1
     sul verde degli alberi. Questo tono ne fa 5,2 e resta turchese. */
  font-weight:600;color:#04454A;margin-top:-4px;text-align:center;padding:0 18px;line-height:1.5}
@media (prefers-reduced-motion:reduce){ .acc{transition:none} }

/* ---------- MAPPA ---------- */
#map{position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;background:#dfe8e7}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.82);
  font-family:var(--body);padding-bottom:calc(env(safe-area-inset-bottom) * .5)}
.leaflet-control-zoom{display:none}

/* ---------- TOP ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:600;
  padding:calc(var(--safe-t) + 9px) 10px 0;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.09em;
  color:var(--surface);background:var(--ink);padding:10px 11px 10px 13px;border-radius:999px;
  white-space:nowrap;flex:0 0 auto;box-shadow:0 4px 18px rgba(7,36,47,.28);
  border:none;display:flex;align-items:center;gap:5px;max-width:44vw;cursor:pointer;
  font-family:var(--display);-webkit-tap-highlight-color:transparent}
.brand:active{transform:scale(.96)}
#brandNome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand svg{flex:0 0 auto;opacity:.75;margin-top:1px}

/* ── il pannello delle città ── */
#pannelloCitta{position:fixed;inset:0;z-index:9000;display:flex;align-items:flex-end}
#pannelloCitta[hidden]{display:none}
.pc-fondo{position:absolute;inset:0;background:rgba(7,36,47,.45);backdrop-filter:blur(2px)}
.pc-foglio{position:relative;width:100%;max-height:76vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(var(--safe-b) + 12px);
  box-shadow:0 -8px 34px rgba(7,36,47,.3);animation:pcSu .22s ease-out}
@keyframes pcSu{from{transform:translateY(22px);opacity:.6}to{transform:translateY(0);opacity:1}}
.pc-testa{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pc-t{font-family:var(--display);font-weight:700;font-size:18px}
.pc-x{border:none;background:rgba(7,36,47,.07);width:34px;height:34px;border-radius:50%;
  font-size:21px;line-height:1;color:var(--ink);cursor:pointer}
#pcCerca{width:100%;border:none;border-radius:12px;padding:11px 13px;font-size:15px;
  font-family:var(--body);background:rgba(7,36,47,.06);color:var(--ink);margin-bottom:8px}
.pc-elenco{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:120px}
.pc-riga{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;
  border:none;background:none;text-align:left;padding:12px 6px;font-size:15.5px;
  font-family:var(--body);color:var(--ink);border-bottom:1px solid rgba(7,36,47,.07);cursor:pointer}
.pc-riga:active{background:rgba(0,166,166,.09)}
.pc-riga b{font-weight:600}
.pc-riga span{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.pc-vuoto{padding:22px 6px;color:var(--muted);font-size:14px}
#search{flex:1;min-width:0;border:none;border-radius:999px;padding:11px 14px;font-size:14px;
  font-family:var(--body);background:rgba(255,255,255,.95);color:var(--ink);
  box-shadow:0 4px 14px rgba(7,36,47,.18)}
#search::placeholder{color:rgba(7,36,47,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:11.5px;font-weight:600;border:none;cursor:pointer;padding:8px 11px;
  border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.95);color:var(--ink);
  box-shadow:0 3px 12px rgba(7,36,47,.16);display:flex;align-items:center;gap:5px;flex:0 0 auto}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--acqua)}
.chip.casa .dot{background:var(--getto)}
.chip.okonly .dot{background:var(--acqua-deep)}
.chip.freeonly .dot{background:var(--getto)}
.chip.access .dot{background:#1E7BFF}
.chip.dog .dot{background:#9B6BD8}
.chip.nuove .dot{background:#8A93A0}
.chip.nuove span:last-child{opacity:.65;font-weight:700}
.chip[aria-pressed="false"]{background:rgba(255,255,255,.5);color:rgba(7,36,47,.38)}
.chip[aria-pressed="false"] .dot{background:rgba(7,36,47,.18)}
#results{position:absolute;left:10px;right:10px;top:calc(var(--safe-t) + 58px);
  background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(7,36,47,.24);display:none}
#results.on{display:block}
#results button{display:block;width:100%;text-align:left;border:none;background:none;
  padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
#results button:last-child{border-bottom:none}

/* ---------- MARKER ---------- */
.pin{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--acqua);border:2px solid #fff;box-shadow:0 3px 10px rgba(7,36,47,.35);
  display:flex;align-items:center;justify-content:center}
.pin .foto-mark{position:absolute;bottom:-5px;right:-6px;width:16px;height:16px;border-radius:50%;
  background:#FFD75E;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;
  transform:rotate(45deg);box-shadow:0 1px 3px rgba(7,36,47,.35)}
.pin .foto-mark svg{transform:rotate(-45deg)}
.pin.casa .foto-mark{transform:rotate(0)}
.pin.casa .foto-mark svg{transform:rotate(0)}
/* l'anello dorato: la verifica più forte che esiste si vede anche da
   lontano, prima ancora di distinguere il piccolo distintivo */
.pin.confoto{box-shadow:0 0 0 2.5px #FFD75E,0 3px 10px rgba(7,36,47,.35)}
.pin.confoto.sel{box-shadow:0 0 0 3px #FFD75E,0 0 0 6px rgba(255,215,94,.35),0 5px 16px rgba(7,36,47,.45)}
.pin .fee{position:absolute;top:-6px;right:-7px;width:17px;height:17px;border-radius:50%;
  background:var(--ink);color:var(--getto);border:1.5px solid #fff;
  font-family:var(--body);font-size:10px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;transform:rotate(45deg)}
.pin.casa .fee{transform:rotate(0);top:-7px;right:-7px}
.pin.casa{background:var(--getto);border-radius:9px;transform:rotate(0)}
/* Rotta o sparita: rosso pieno, anello rosso attorno, sempre in primo piano.
   È l'informazione che risparmia una camminata a vuoto. */
.pin.broken{background:var(--rotta) !important;
  box-shadow:0 0 0 3px rgba(229,72,77,.28),0 3px 10px rgba(7,36,47,.4);
  z-index:4}
/* Lavori in corso: arancione, distinto dall'ambra delle case dell'acqua. */
/* Una segnalazione di guasto ancora da confermare: rosso più tenue,
   ma inequivocabilmente rosso. */
.pin.dubbio{background:#EE7B7E !important;
  box-shadow:0 0 0 3px rgba(229,72,77,.2),0 3px 10px rgba(7,36,47,.32);
  z-index:3}
.pin.dubbio.daverificare{opacity:1}
.pin.lavori{background:#E8730C !important;
  box-shadow:0 0 0 3px rgba(232,115,12,.24),0 3px 10px rgba(7,36,47,.35);
  z-index:3}
.pin svg{transform:rotate(45deg)}
.pin.casa svg{transform:rotate(0)}
/* Il colore deve dire a colpo d'occhio chi fidarsi: piena dove qualcuno
   ha confermato di persona, quasi sbiadita dove nessuno l'ha ancora fatto. */
.pin.daverificare{opacity:.5}
.pin.broken.daverificare,.pin.lavori.daverificare{opacity:1}   /* un guasto va visto comunque */
.pin.daverificare.sel{opacity:.9}   /* aperta, resta leggibile ma si vede che è ancora grigia */
.pin.sel{opacity:1;transform:rotate(-45deg) scale(1.2);
  box-shadow:0 0 0 6px rgba(0,166,166,.32),0 5px 16px rgba(7,36,47,.45);z-index:5}
.pin.casa.sel{transform:scale(1.2)}
/* quando arriva la tua segnalazione, il segnaposto reagisce */
.pin.appena{animation:battito .7s ease-out 2}
@keyframes battito{
  0%,100%{box-shadow:0 0 0 0 rgba(0,166,166,.55),0 3px 10px rgba(7,36,47,.35)}
  50%{box-shadow:0 0 0 14px rgba(0,166,166,0),0 3px 10px rgba(7,36,47,.35)}
}
.grappolo{width:38px;height:38px;border-radius:50%;background:rgba(0,166,166,.92);
  border:2.5px solid #fff;box-shadow:0 3px 12px rgba(7,36,47,.35);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--body);font-size:13px;font-weight:600}
.grappolo.grande{width:46px;height:46px;font-size:14px;background:rgba(0,128,127,.94)}
.me{width:18px;height:18px;border-radius:50%;background:#1E7BFF;border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(30,123,255,.18),0 2px 8px rgba(0,0,0,.3)}

/* ---------- CARD "PIÙ VICINA" ---------- */
#card{position:fixed;left:10px;right:10px;z-index:700;bottom:calc(var(--safe-b) + 12px);
  background:var(--surface);border-radius:20px;
  box-shadow:0 -2px 40px rgba(7,36,47,.22);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;touch-action:pan-x}
#card.hidden{transform:translateY(calc(100% + 40px))}
#card .grande{padding:4px 16px 16px}
#card.mini .grande{display:none}
#card.mini .close{display:none}
.riga-mini{display:flex;align-items:center;gap:11px;width:100%;
  padding:13px 15px;border:none;background:none;font-family:var(--body);
  text-align:left;cursor:pointer;color:var(--ink)}
#card:not(.mini) .riga-mini{padding-bottom:6px}
.riga-mini .goccia{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  background:var(--acqua);display:flex;align-items:center;justify-content:center}
.riga-mini .testi{flex:1;min-width:0}
.riga-mini .primo{display:block;font-size:14.5px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga-mini .primo b{color:var(--acqua-deep)}
.riga-mini .secondo{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga-mini .freccia{flex:0 0 auto;color:rgba(7,36,47,.35);transition:transform .3s}
/* A card aperta la freccia non serve più e finirebbe sotto la X. */
#card:not(.mini) .riga-mini .freccia{display:none}
.presa{width:36px;height:4px;border-radius:99px;background:rgba(7,36,47,.14);margin:7px auto 0}
#card:not(.mini) .presa{display:none}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acqua-deep);font-weight:600}
.headline{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.08;
  margin:7px 0 3px;letter-spacing:-.01em}
.headline b{font-weight:800;color:var(--acqua-deep)}
.sub{font-size:13.5px;color:var(--muted);line-height:1.35}
.info-griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
  gap:9px;margin-top:9px}
.info-q{background:rgba(0,166,166,.11);color:var(--acqua-deep);
  border-radius:13px;padding:15px 12px;text-align:center;
  font-size:14.5px;font-weight:700;line-height:1.25}
.info-q.attenzione{background:rgba(255,176,32,.2);color:#8A5B00}
.coppia{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.q{border-radius:15px;padding:14px;display:flex;flex-direction:column;
   justify-content:center;min-height:112px;background:rgba(7,36,47,.06)}
.q-segno{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:800;margin-bottom:9px;
  background:rgba(7,36,47,.12);color:var(--muted)}
.q-t{font-size:14.5px;font-weight:700;line-height:1.2}
.q-q{font-size:12px;opacity:.75;margin-top:3px;line-height:1.3}
.q-stato.ok{background:rgba(0,166,166,.13);color:var(--acqua-deep)}
.q-stato.ok .q-segno{background:var(--acqua);color:#fff}
.q-stato.bad{background:rgba(229,72,77,.11);color:var(--rotta)}
.q-stato.bad .q-segno{background:var(--rotta);color:#fff}
.q-stato.warn{background:rgba(255,176,32,.2);color:#8A5B00}
.q-stato.warn .q-segno{background:var(--getto);color:#3D2800}
/* Tutti i riquadri condividono lo stesso celeste: a dire com'è andata
   sono il numero e le stelle, non il colore del fondo. */
.q-voto{background:rgba(0,166,166,.11);color:var(--acqua-deep)}
.q-voto.buona{background:rgba(0,166,166,.11);color:var(--acqua-deep)}
.q-voto.media{background:rgba(0,166,166,.11);color:#8A5B00}
.q-voto.rossa{background:rgba(229,72,77,.1);color:var(--rotta)}
.q-voto.vuoto{background:rgba(7,36,47,.05);color:var(--muted)}
.q-num{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;
  letter-spacing:-.03em}
.q-stelle{display:flex;gap:1px;margin-top:7px}
.q-stelle .stella-g{width:17px;height:17px}
.q-voto.vuoto{background:rgba(7,36,47,.05);color:var(--muted)}
.q-voto.vuoto .q-num{opacity:.35}
/* la prova, stretta e centrata sotto i due quadrati */
/* Celeste, non ambra: una fontanella dimostrata con una fotografia è
   la conferma più forte che esiste, non un avviso. L'ambra resta al solo
   "attenzione", altrimenti smette di voler dire qualcosa. */
.verifica-foto{display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:9px;padding:11px 14px;border-radius:13px;background:rgba(0,166,166,.13);
  color:var(--acqua-deep);font-size:13px;font-weight:700}
.verifica-foto svg{flex:0 0 auto;color:var(--acqua-deep);width:17px;height:17px}
.giudizio{display:flex;align-items:center;gap:14px;margin-top:9px;
  padding:13px 15px;border-radius:14px;background:rgba(255,176,32,.1)}
.giudizio.vuoto{display:block;background:rgba(7,36,47,.05);padding:12px 15px}
.giudizio .nessuno{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.giudizio .invito{display:block;font-size:12.5px;color:var(--muted);opacity:.8;margin-top:2px}
.voto-grande{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.voto-grande .numero{font-family:var(--display);font-weight:800;font-size:32px;
  line-height:1;color:#8A5B00;letter-spacing:-.02em}
.stelle-g{display:flex;gap:2px}
.stella-g{width:19px;height:19px;display:block}
.voto-lato{display:flex;flex-direction:column;gap:4px;min-width:0}
.voto-lato .quanti{font-size:12.5px;color:var(--acqua-deep);opacity:.85;font-weight:500}
.tempb{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;align-self:flex-start}
.tempb.calda{background:rgba(245,166,35,.28);color:#7A4E00}
.tempb.ambiente{background:rgba(7,36,47,.1);color:var(--muted)}
.tempb.fresca{background:rgba(49,182,216,.22);color:#0A5C72}
.stato-riga{display:flex;align-items:center;gap:10px;margin-top:11px;
  padding:11px 13px;border-radius:13px;background:rgba(7,36,47,.06)}
.stato-riga .segno{flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:rgba(7,36,47,.12);color:var(--muted)}
.stato-riga .testo{font-size:14px;font-weight:600;line-height:1.3}
.stato-riga .testo b{display:block;font-weight:500;font-size:12.5px;opacity:.78;margin-top:2px}
.stato-riga.ok{background:rgba(0,166,166,.13);color:var(--acqua-deep)}
.stato-riga.ok .segno{background:var(--acqua);color:#fff}
.stato-riga.bad{background:rgba(229,72,77,.11);color:var(--rotta)}
.stato-riga.bad .segno{background:var(--rotta);color:#fff}
.stato-riga.warn{background:rgba(255,176,32,.2);color:#8A5B00}
.stato-riga.warn .segno{background:var(--getto);color:#3d2800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{align-self:flex-start;flex:0 0 auto;
  font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;
  background:rgba(7,36,47,.06);color:rgba(7,36,47,.72)}
.tag.ok{background:rgba(0,166,166,.13);color:var(--acqua-deep)}
/* celeste appena accennato: si vedono senza gridare */
.tag.acqua{background:rgba(0,166,166,.07);color:#227781}
.tag.warn{background:rgba(255,176,32,.2);color:#8A5B00}
.tag.bad{background:rgba(229,72,77,.13);color:var(--rotta)}
.actions{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;border:none;cursor:pointer;font-size:14px;font-weight:600;padding:13px 10px;
  border-radius:13px;background:var(--ink);color:var(--surface);text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:rgba(7,36,47,.07);color:var(--ink)}
/* Portare qualcuno all'acqua è il gesto per cui si apre l'app:
   deve essere il pulsante più grande e più evidente. */
.btn.primario{flex:1.7;background:var(--ink);color:var(--surface);font-size:15px}
.btn.small{padding:10px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;pointer-events:none}
.close{position:absolute;top:20px;right:13px;width:34px;height:34px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(229,72,77,.12);color:var(--rotta);
  font-size:20px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;z-index:3}
.close:active{background:rgba(229,72,77,.24)}

/* ---------- SHEET ---------- */
#scrim{position:fixed;inset:0;z-index:750;background:rgba(7,36,47,.45);
  opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
/* Mai sotto il notch: così l'angolo in alto a destra resta sempre uno
   spazio vero, e la X non si schiaccia contro la fotocamera del telefono. */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--surface);
  border-radius:22px 22px 0 0;
  max-height:calc(88dvh - env(safe-area-inset-top) - 10px);
  display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -6px 40px rgba(7,36,47,.3)}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:999px;background:rgba(7,36,47,.18);margin:9px auto 0;flex:0 0 auto}
.sheet-close{position:absolute;top:16px;right:16px;z-index:6;width:40px;height:40px;
  border:none;border-radius:50%;background:var(--surface);color:var(--rotta);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .16s,transform .12s;
  box-shadow:0 3px 10px rgba(7,36,47,.18),inset 0 0 0 1.5px rgba(229,72,77,.18)}
.sheet-close:active{background:rgba(229,72,77,.1);transform:scale(.93)}
.sheet-body > .eyebrow,.sheet-body > .sheet-h{padding-right:52px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(var(--safe-b) + 18px)}
.sheet-h{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:10px 0 2px}
/* Le fontanelle sono alte e strette: le foto arrivano quasi sempre
   in verticale. Con un'altezza fissa e il ritaglio al centro si
   vedeva solo una striscia orizzontale, senza la cima né la
   vaschetta. Ora l'immagine tiene le sue proporzioni: si adatta
   alla larghezza, non supera mai metà schermo in altezza, e non
   viene tagliata in nessun caso. */
.hero{width:100%;aspect-ratio:3/4;max-height:62vh;object-fit:cover;object-position:center;border-radius:14px;margin-top:12px;background:rgba(7,36,47,.06);display:block}
/* i due pulsanti sotto le stelle: spenti sono neutri, accesi si vedono */
/* ambra: attenzione, non guasto accertato */
/* icona e parola sulla stessa riga, senza far crescere il pulsante */
.state3 .btn, .statebox .btn{display:flex;align-items:center;justify-content:center;gap:5px}
.ic-cam{width:14px;height:14px;flex:0 0 auto;opacity:.9}
.statebox .ic-cam{width:15px;height:15px}

.in-verifica{margin-top:10px;padding:11px 13px;border-radius:12px;
  background:rgba(255,176,32,.16);color:#7A4E00;font-size:13.5px;line-height:1.45}
.in-verifica b{display:block;font-weight:700;margin-bottom:3px}
.in-verifica span{display:block;font-size:12.5px;opacity:.9}

.dett-riga{display:flex;gap:8px;margin-top:10px}
.dett-b{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid rgba(7,36,47,.14);background:rgba(7,36,47,.03);color:rgba(7,36,47,.45);
  border-radius:13px;padding:11px 8px;font-family:var(--body);font-size:13.5px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.dett-b:active{transform:scale(.97)}
.dett-b.si{background:rgba(0,166,166,.13);border-color:var(--acqua);color:var(--acquascuro,#00807F)}
.dett-b.no{background:rgba(7,36,47,.04);border-color:rgba(7,36,47,.12);color:rgba(7,36,47,.32)}
.dett-b svg{flex:0 0 auto}

.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{height:78px;width:auto;max-width:110px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.sec{margin-top:20px}
.sec-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}
.tempseg{display:flex;gap:4px;background:rgba(7,36,47,.06);border-radius:13px;padding:4px;margin-top:2px}
.tempseg button{flex:1;border:none;background:none;color:var(--muted);padding:11px 6px;
  border-radius:10px;font-size:13px;font-weight:600;font-family:var(--body);transition:.16s}
.tempseg button.on[data-v="1"]{background:#F5A623;color:#3d2600}
.tempseg button.on[data-v="3"]{background:rgba(7,36,47,.75);color:var(--surface)}
.tempseg button.on[data-v="5"]{background:#31B6D8;color:#04222c}
.temprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px}
.tempval{font-weight:600;padding:4px 11px;border-radius:8px;font-size:12.5px}
.tempval.calda{background:rgba(245,166,35,.2);color:#8A5B00}
.tempval.ambiente{background:rgba(7,36,47,.08);color:var(--muted)}
.tempval.fresca{background:rgba(49,182,216,.18);color:#0A5C72}
.starrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.starrow span{font-size:13.5px}
.stars{display:flex;gap:1px;flex:0 0 auto;margin-right:-4px}
.star{width:38px;height:38px;border:none;background:none;padding:4px;cursor:pointer;
  color:rgba(7,36,47,.18);transition:color .12s,transform .12s}
.star.on{transform:scale(1.05)}
.star:active{transform:scale(.88)}
.star.on{color:var(--getto)}
.star svg{width:100%;height:100%;display:block}
.bar{height:6px;border-radius:99px;background:rgba(7,36,47,.09);overflow:hidden;flex:1;max-width:110px}
.bar i{display:block;height:100%;background:var(--acqua);border-radius:99px}
.statebox{display:flex;gap:8px;margin-top:4px}
.statebox .btn{font-size:13.5px}
.btn.ok{background:rgba(0,166,166,.14);color:var(--acqua-deep)}
.btn.bad{background:rgba(229,72,77,.12);color:var(--rotta)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-family:var(--body);font-size:14px;background:var(--card);color:var(--ink);resize:none}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:8px}
.grazie{margin-top:11px;padding:12px 14px;border-radius:13px;
  background:rgba(0,166,166,.11);color:var(--acqua-deep);
  font-size:13.5px;font-weight:600;line-height:1.4;
  animation:conferma .3s cubic-bezier(.2,1.5,.4,1)}
.grazie b{font-weight:800}
.grazie span{display:block;margin-top:4px;font-weight:500;opacity:.8;font-size:12.5px}
.age{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;
  background:rgba(7,36,47,.07);color:var(--muted)}
.age.fresh{background:rgba(0,166,166,.15);color:var(--acqua-deep)}
.age.medium{background:rgba(255,176,32,.2);color:#8A5B00}
.age.stale{background:rgba(7,36,47,.08);color:rgba(7,36,47,.45)}
.modeseg{display:inline-flex;gap:2px;background:rgba(7,36,47,.06);border-radius:10px;padding:2px;margin-top:9px}
.modeseg button{border:none;background:none;color:var(--muted);padding:6px 11px;
  border-radius:8px;font-size:12px;font-weight:600;font-family:var(--body)}
.modeseg button.on{background:var(--ink);color:var(--surface)}
.state3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.state3 .btn{font-size:12.5px;padding:12px 4px;border-radius:11px}
.btn.works{background:rgba(255,176,32,.2);color:#8A5B00}
/* La conferma di un invio riuscito: verde, grande, senza dubbi. */
.btn.conta,.b.conta{
  background:#2FBF71 !important;color:#052e1a !important;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:700;font-size:16px;pointer-events:none;
  position:relative;overflow:hidden;
  animation:conferma .3s cubic-bezier(.2,1.5,.4,1)}
.btn.conta .c-num,.b.conta .c-num{
  min-width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;
  animation:pulsaNum .6s ease-out}
@keyframes pulsaNum{from{transform:scale(1.5);opacity:.3}to{transform:scale(1);opacity:1}}
.btn-foto{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--acqua);color:#fff;border-radius:14px;padding:16px 14px;
  font-size:15.5px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,166,166,.3);transition:transform .14s,filter .14s}
.btn-foto:active{transform:scale(.98);filter:brightness(.95)}
.btn-problema{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:rgba(229,72,77,.09);border:none;border-radius:13px;padding:15px;
  font-family:var(--body);font-size:14.5px;font-weight:600;color:var(--rotta);cursor:pointer;
  min-height:48px;transition:background .16s,transform .12s}
.btn-problema:active{background:rgba(229,72,77,.16);transform:scale(.985)}
.motivi{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.motivi button{text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:11px;padding:12px 14px;font-family:var(--body);font-size:14px;
  color:var(--ink);cursor:pointer;transition:.15s}
.motivi button.on{border-color:var(--rotta);background:rgba(229,72,77,.07);
  color:var(--rotta);font-weight:600}
.foto-attesa{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px;
  padding:11px 13px;border-radius:12px;background:rgba(255,176,32,.16);
  color:#8A5B00;font-size:13px;line-height:1.42;font-weight:500}
.foto-attesa svg{flex:0 0 auto;margin-top:1px}
.conta{font-size:11.5px;color:rgba(242,247,246,.5);text-align:right;margin-top:-4px}
.conta.finiti{color:var(--getto)}
.btn-foto.bloccato{background:rgba(7,36,47,.07);color:var(--muted);
  box-shadow:none;pointer-events:none;font-weight:500}
.btn.fatto{background:#E4F6EC;color:#127A47;font-size:17px;font-weight:700;
  pointer-events:none;animation:conferma .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes conferma{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
.btn.scelto{box-shadow:inset 0 0 0 2.5px currentColor}
.btn.scelto::before{content:'✓ ';font-weight:700}
.photocap{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:var(--muted)}
.rev{border-top:1px solid var(--line);padding:11px 0;font-size:13.5px}
.rev .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.empty{font-size:13px;color:var(--muted);padding:12px 0}

/* ---------- FAB ---------- */
.fab{position:fixed;right:12px;z-index:650;width:46px;height:46px;border-radius:15px;border:none;
  cursor:pointer;background:var(--surface);color:var(--ink);box-shadow:0 5px 18px rgba(7,36,47,.24);
  display:flex;align-items:center;justify-content:center;transition:bottom .32s cubic-bezier(.2,.8,.2,1)}
#locate{bottom:calc(var(--safe-b) + 178px)}
#addBtn{bottom:calc(var(--safe-b) + 234px);background:var(--acqua);color:#fff}
body.card-mini #locate{bottom:calc(var(--safe-b) + 88px)}
body.card-mini #addBtn{bottom:calc(var(--safe-b) + 144px)}
/* Con la card aperta i pulsanti finivano dietro di lei: irraggiungibili
   e apparentemente scomparsi. Meglio toglierli di scena per davvero. */
body:not(.card-mini):not(.card-hidden) #locate,
body:not(.card-mini):not(.card-hidden) #addBtn{
  opacity:0;pointer-events:none;transform:translateY(10px)}
.fab{transition:bottom .32s cubic-bezier(.2,.8,.2,1),opacity .22s,transform .22s}
body.card-hidden #locate{bottom:calc(var(--safe-b) + 24px)}
body.card-hidden #addBtn{bottom:calc(var(--safe-b) + 80px)}

/* ---------- MODALITÀ AGGIUNTA ---------- */
#addbar{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:900;
  max-width:430px;margin:0 auto;background:var(--ink);color:var(--surface);
  border-radius:20px;padding:18px;display:none;
  box-shadow:0 20px 60px rgba(7,36,47,.45);
  max-height:calc(100dvh - 120px);overflow-y:auto}
#addbar.on{display:block}
.add-t{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;margin:0 0 4px}
.add-p{margin:0;font-size:13px;line-height:1.45;color:rgba(242,247,246,.62)}
.add-l{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(242,247,246,.45);font-weight:600;margin:16px 0 7px}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:13px;padding:3px}
.seg button{flex:1;border:none;background:none;color:rgba(242,247,246,.6);
  padding:10px 8px;border-radius:10px;font-size:13px;font-weight:600;transition:.18s}
.seg button.on{background:var(--acqua);color:#04222c}
.seg button.on.casa{background:var(--getto);color:#3d2800}
#addbar input[type=text],#addbar textarea{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;padding:11px 13px;color:var(--surface);font-size:14px;
  font-family:var(--body);resize:none}
#addbar input[type=text]::placeholder,#addbar textarea::placeholder{color:rgba(242,247,246,.35)}
#addbar input[type=text]:focus,#addbar textarea:focus{border-color:var(--acqua);outline:none}
.photo-zone{display:flex;gap:10px;align-items:center}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;
  background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.22);
  border-radius:12px;padding:14px 10px;font-size:13px;font-weight:600;
  color:rgba(242,247,246,.78);cursor:pointer;transition:.18s}
.photo-add:hover{border-color:var(--acqua);color:var(--surface)}
.photo-prev{position:relative;flex:0 0 auto}
.photo-prev img{width:62px;height:62px;object-fit:cover;border-radius:12px;display:block}
.photo-prev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border:none;
  border-radius:50%;background:var(--rotta);color:#fff;font-size:13px;line-height:1;padding:0}
.add-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.b{border:none;border-radius:12px;padding:11px 20px;font-size:13.5px;font-weight:600;
  font-family:var(--body);transition:.18s;cursor:pointer}
.b.ghost{background:rgba(255,255,255,.1);color:var(--surface)}
.b.ghost:hover{background:rgba(255,255,255,.16)}
.b.go{background:var(--acqua);color:#04222c}
.b.fatto{background:#2FBF71;color:#06301c;font-weight:700;pointer-events:none;
  animation:conferma .28s cubic-bezier(.2,1.5,.4,1)}
.b.go:hover{filter:brightness(1.08)}
.b[disabled]{opacity:.45;pointer-events:none}
.add-hint{font-size:11.5px;line-height:1.45;color:rgba(242,247,246,.45);margin-top:12px}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-100%);z-index:880;display:none;pointer-events:none}
#crosshair.on{display:block}

/* Mentre tieni premuto, la cornice dello schermo si chiude in due secondi.
   Sta ai bordi apposta: il dito è al centro e coprirebbe qualsiasi cosa. */
#lpfull{position:fixed;inset:0;z-index:940;pointer-events:none;opacity:0;transition:opacity .14s}
#lpfull.on{opacity:1}
#lpfull i{position:absolute;display:block;background:var(--acqua);
  box-shadow:0 0 14px rgba(0,166,166,.55)}

    localStorage.setItem('idratati-contato', oggi);
    SB.rpc('ping', {p_device: dispositivo()})['catch'](function(){});
  }catch(e){}
}

/* Le segnalazioni portano solo "osm/node/123": senza coordinate il
   pannello non può dire in che città è successo niente. Queste sono le
   coordinate della fontanella, che stanno già su una mappa pubblica:
   non aggiungono una virgola su chi contribuisce. */
function ricordaPunto(p){
  if(!p || !p.target || p.lat == null || p.lon == null) return;
  try{
    SB.rpc('punto', {p_target: p.target, p_lat: +p.lat, p_lon: +p.lon,
                     p_nome: (p.tags && p.tags.name) || null,
                     p_kind: p.kind || null})['catch'](function(){});
  }catch(e){}
}

/* firma() viene chiamata in tutti e sei i punti in cui nasce un
   contributo: stato, dettagli, recensione, foto, problema, proposta.
   Agganciare qui vuol dire non dimenticarne nessuno domani. La proposta
   di una fontanella nuova non ha ancora un target e viene saltata. */
function firma(p){
  ricordaPunto(p);
  return {device: dispositivo(), distanza: quantoLontano(p)};
}

/* ============================================================
   SUONI E VIBRAZIONE
   Toni sintetizzati sul momento: nessun file da scaricare.
   Il contesto audio nasce al primo tocco, come vogliono i browser.
   ============================================================ */
var suoniAccesi = store.get('idr_suoni') !== '0';
var ctx = null, master = null;

function audioPronto(){
  if(!suoniAccesi) return false;
  try{
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return true;
  }catch(e){ return false; }
}

/* tick acuto, uno per ogni lato della cornice che si chiude */
function tick(freq, forza){
  if(!audioPronto()) return;
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(forza || 0.12, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.13);
}

/* la goccia che cade: la frequenza scivola in basso in un lampo */
function suonoGoccia(){
  if(!audioPronto()) return;
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1350, t);
  o.frequency.exponentialRampToValueAtTime(300, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.36);
  // un secondo tonfo più basso, come l'eco nel catino
  var o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(520, t + 0.10);
  o2.frequency.exponentialRampToValueAtTime(190, t + 0.30);
  g2.gain.setValueAtTime(0.0001, t + 0.10);
  g2.gain.exponentialRampToValueAtTime(0.11, t + 0.12);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  o2.connect(g2); g2.connect(master);
  o2.start(t + 0.10); o2.stop(t + 0.44);
}

/* nota: su iPhone il browser non espone la vibrazione, quindi lì
   resta solo il suono. Su Android funziona. */
function vibra(schema){
  if(!navigator.vibrate) return;
  try{ navigator.vibrate(schema); }catch(e){}
}

/* Nessuna attesa può durare per sempre. Se la rete si impunta, dopo un po'
   bisogna dirlo e restituire i comandi a chi sta usando l'app: un pulsante
   che resta su "Invio…" all'infinito è il modo peggiore di fallire. */
function conScadenza(promessa, secondi, messaggio){
  return new Promise(function(risolvi, rifiuta){
    var scaduto = false;
    var t = setTimeout(function(){
      scaduto = true;
      rifiuta(new Error(messaggio || 'La rete non risponde. Riprova.'));
    }, (secondi || 25) * 1000);
    promessa.then(function(v){
      if(scaduto) return;
      clearTimeout(t); risolvi(v);
    }, function(e){
      if(scaduto) return;
      clearTimeout(t); rifiuta(e);
    });
  });
}

/* ---------- mini client Supabase (REST, zero dipendenze) ---------- */
var SB = {
  on: function(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY); },
  head: function(){
    return {'apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY,
            'Content-Type':'application/json'};
  },
  select: function(path){
    if(!SB.on()) return Promise.resolve([]);
    return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path, {headers:SB.head()})
      .then(function(r){ return r.ok ? r.json() : []; })
      // qualunque cosa risponda il server, di qui esce sempre una lista:
      // un errore nei dati non deve mai spegnere la mappa
      .then(function(d){ return Array.isArray(d) ? d : []; })
      .catch(function(){ return []; });
  },
  // Chiama una funzione del database. Le segnalazioni passano di qui:
  // così il server scrive una riga sola, quella di questo dispositivo,
  // e nessuno può toccare le segnalazioni degli altri.
  rpc: function(nome, argomenti){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    return fetch(CFG.SUPABASE_URL+'/rest/v1/rpc/'+nome, {
      method:'POST', headers:SB.head(), body:JSON.stringify(argomenti)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        var msg=t; try{ msg=(JSON.parse(t).message)||t; }catch(e){}
        throw new Error(msg);
      });
      return true;
    });
  },
  // upsert: se c'è già una riga con la stessa chiave, la corregge
  upsert: function(table, row, chiave){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    return fetch(CFG.SUPABASE_URL+'/rest/v1/'+table+'?on_conflict='+chiave, {
      method:'POST',
      headers:Object.assign(SB.head(),
        {'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(row)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        var msg=t; try{ msg=(JSON.parse(t).message)||t; }catch(e){}
        throw new Error(msg);
      });
      return true;
    });
  },
  insert: function(table, row){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    // return=minimal: non chiediamo indietro la riga. Le proposte e le foto
    // in attesa sono leggibili solo dall'amministratore, quindi chiederle
    // indietro farebbe fallire un inserimento in realtà andato a buon fine.
    return fetch(CFG.SUPABASE_URL+'/rest/v1/'+table, {
      method:'POST',
      headers:Object.assign(SB.head(), {'Prefer':'return=minimal'}),
      body:JSON.stringify(row)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        var msg=t; try{ msg=(JSON.parse(t).message)||t; }catch(e){}
        throw new Error(msg);
      });
      return true;
    });
  },
  upload: function(file, name){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    var stop = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var invio = fetch(CFG.SUPABASE_URL+'/storage/v1/object/photos/'+name, {
      method:'POST',
      headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY,
               'Content-Type':file.type||'image/jpeg','x-upsert':'false'},
      body:file,
      signal: stop ? stop.signal : undefined
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        var msg=t; try{ msg=(JSON.parse(t).message)||t; }catch(e){}
        throw new Error('la foto è stata rifiutata: '+String(msg).slice(0,60));
      });
      return CFG.SUPABASE_URL+'/storage/v1/object/public/photos/'+name;
    });
    return conScadenza(invio, 45, 'La foto ci sta mettendo troppo. Controlla la rete e riprova.')
      .catch(function(e){ if(stop) try{ stop.abort(); }catch(x){} throw e; });
  }
};

/* ---------- stato ---------- */
var map, layer, meMarker, myPos=null, points=[], byId={},
    overrides={}, statusAgg={}, reviewAgg={}, fotoConferma={},
    DIARIO={snapshot:0, snapshotMancanti:0, overpass:0, overpassErrori:[],
            supabase:0, ultimoServer:'', disegnati:0, memoria:0},
    selected=null, tilesLoaded={}, fetching=false, lastQ=null,
    adding=false, addPhoto=null, myVotes={},
    lastOverpassAt=0, lastOverpassAt_center=null, lastOverpassRaggio=0,
    firstLoadDone=false;
var show = {fontanella:true, casa:true, okonly:false, freeonly:false, access:false, dog:false, daverificare:false};

/* ---------- utility ---------- */
function dist(a,b){
  var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(s));
}
function walkMin(m, quale){
  var M = MODI[quale || modo];
  return Math.max(1, Math.round(m*M.det/M.v) + M.extra);
}
function fmtDist(m){ return m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1).replace('.',',')+' km'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg,ms){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, ms||3200);
}
function daysAgo(iso){
  if(!iso) return null;
  return Math.floor((Date.now()-new Date(iso).getTime())/86400000);
}
function agoText(d){
  if(d==null) return null;
  if(d<1) return 'oggi'; if(d===1) return 'ieri';
  if(d<30) return d+' giorni fa';
  if(d<365) return Math.round(d/30)+' mesi fa';
  return 'oltre un anno fa';
}
/* Quanto è vecchia un'informazione. Una nota di ieri vale molto più
   di una di due anni fa, e chi legge deve vederlo a colpo d'occhio. */
function fresco(iso){
  var d = daysAgo(iso);
  if(d==null) return {c:'', t:''};
  if(d <= 30)  return {c:'fresh',  t:agoText(d)};
  if(d <= 180) return {c:'medium', t:agoText(d)};
  return {c:'stale', t:agoText(d)};
}
function bollo(iso, prefisso){
  var f = fresco(iso);
  if(!f.t) return '';
  return '<span class="age '+f.c+'">'+(prefisso?esc(prefisso)+' ':'')+esc(f.t)+'</span>';
}

/* ---------- classificazione OSM ---------- */
function classify(tags){
  var n=(tags.name||'').toLowerCase();
  if(tags.amenity==='vending_machine' || tags.amenity==='water_point') return 'casa';
  if(n.indexOf('casa dell')>-1 || n.indexOf('casa acqua')>-1 || n.indexOf('casetta')>-1) return 'casa';
  if(tags['drinking_water:refill']==='yes' && tags.amenity!=='drinking_water') return 'casa';
  return 'fontanella';
}
function labelFor(p){
  if(p.ov && p.ov.name) return p.ov.name;
  if(p.tags.name) return p.tags.name;
  return p.kind==='casa' ? "Casa dell'acqua" : 'Fontanella pubblica';
}

/* ---------- si paga o no ----------
   Restituisce 'paid', 'free' oppure null quando nessuno l'ha ancora detto. */
function feeOf(p){
  var ov=p.ov||{}, t=p.tags||{};
  if(ov.fee) return ov.fee;
  if(t.fee==='yes' || t.charge) return 'paid';
  if(t.fee==='no') return 'free';
  return null;
}

/* Una fontanella è "verificata" quando qualcuno ha detto se funziona
   oppure l'ha votata. La foto non basta: una foto non dice se esce acqua. */
function verificata(p){
  if(myVotes[p.target]) return true;      // l'hai controllata tu
  var st = statusAgg[p.target];
  if(st && ((st.ok_votes||0) + (st.broken_votes||0) + (st.works_votes||0) + (st.missing_votes||0)) > 0)
    return true;
  var r = reviewAgg[p.target];
  if(r && r.n > 0) return true;
  if(p.ov && p.ov.status && p.ov.status !== 'unknown') return true;   // deciso da te
  return false;
}

/* ---------- stato calcolato ---------- */
/* Lo stato di una fontanella è quello che dice l'ULTIMA persona che ci
   è passata. Non un conteggio, non una maggioranza: l'ultima notizia.
   Se un'ora fa qualcuno l'ha trovata rotta, chi arriva adesso deve
   saperlo — non dopo che un secondo passante avrà confermato facendo
   la strada a vuoto.
   Quante persone concordano resta scritto, ma serve a dire quanto è
   solida l'informazione, non a deciderla. */
function stateOf(p){
  var ov = p.ov, ag = statusAgg[p.target];

  // quello che hai deciso tu dal pannello vince su tutto
  if(ov && ov.status_locked && ov.status !== 'unknown'){
    return {s:ov.status, why:'verificata', locked:true};
  }

  var mio = myVotes[p.target];

  if(ag && ag.ultimo_stato){
    var stato  = ag.ultimo_stato;
    var quando = ag.ultimo_quando || ag.last_report;

    // la tua segnalazione, per te, è l'ultima parola
    if(mio && mio !== stato){ stato = mio; quando = new Date().toISOString(); }

    var quanti = ({ok:ag.ok_votes, broken:ag.broken_votes,
                   works:ag.works_votes, missing:ag.missing_votes}[stato]) || 1;
    return {s:stato, last:quando, quanti:quanti,
            why: quanti > 1 ? quanti + ' persone lo dicono' : 'lo dice una persona'};
  }

  if(mio) return {s:mio, why:'lo dici tu', last:new Date().toISOString(), quanti:1};
  if(ov && ov.status && ov.status !== 'unknown') return {s:ov.status, why:'verificata'};

  /* Nessuno ha premuto un tasto di stato, ma qualcuno l'ha giudicata: e per
     dare un voto al sapore e alla temperatura l'acqua deve essere uscita.
     Chi ha lasciato le stelle era lì davanti e ha bevuto, quindi funzionava.
     Lo dice già verificata() venti righe sopra, che conta una recensione come
     verifica: era questo riquadro a dire il contrario, e i due si
     contraddicevano. Resta così finché non arriva una segnalazione di
     qualcun altro, che ha la precedenza e sta nel ramo in cima.
     La foto da sola non basta: non dice se esce acqua. */
  var rec = reviewAgg[p.target];
  if(rec && rec.n > 0)
    return {s:'ok', dedotto:true, last:rec.last_review, quanti:rec.n,
            why: rec.n > 1 ? rec.n + ' persone l\'hanno giudicata'
                           : 'lo dice chi l\'ha giudicata'};

  if(p.tags.check_date) return {s:'unknown', why:'verificata su OSM il '+p.tags.check_date};
  return {s:'unknown', why:null};
}
/* La domanda per cui si apre l'app è una sola: funziona, e chi lo dice da
   quando? Stato e data vanno insieme, in una frase, prima di tutto il resto. */
function fraseStato(p){
  var st = stateOf(p);
  var quando = st.last ? agoText(daysAgo(st.last)) : null;
  var voci = (st.quanti && st.quanti > 1) ? ' · ' + st.quanti + ' persone' : '';
  if(st.s === 'ok')      return {c:'ok',   ico:'✓', t:'Confermata funzionante',
                                q: st.dedotto ? st.why + (quando ? ' · ' + quando : '')
                                              : (quando||'')+voci};
  if(st.s === 'broken')  return {c:'bad',  ico:'✕', t:'Segnalata rotta',        q:(quando||'')+voci};
  if(st.s === 'works')   return {c:'warn', ico:'!', t:'Lavori in corso',        q:(quando||'')+voci};
  if(st.s === 'missing') return {c:'bad',  ico:'?', t:'Nessuno riesce a trovarla', q:(quando||'')+voci};
  if(st.s === 'doubt')   return {c:'bad',  ico:'✕', t:'Segnalata rotta', q:quando};
  if(st.s === 'removed') return {c:'bad',  ico:'✕', t:'Rimossa', q:quando};
  // nessuna segnalazione: si dice quel che si sa, senza inventare
  if(p.tags && p.tags.check_date)
    return {c:'', ico:'·', t:'Controllata sul posto', q:'il '+p.tags.check_date};
  return {c:'', ico:'·', t:'Non l\'ha ancora controllata nessuno', q:null};
}

/* Il giudizio di chi c'è stato, in testa alla scheda e grande.
   Chi apre un punto vuole sapere due cose prima di tutto: se funziona,
   e se ne vale la pena. Lo stato risponde alla prima, questo alla seconda. */
function stellaSvg(riempimento, id, tono){
  // riempimento da 0 a 1: la stella si riempie in proporzione
  var pieno = Math.max(0, Math.min(1, riempimento));
  /* Tutti i riquadri sono celesti: un buon giudizio non è un avviso e
     non deve avere un colore suo. Restano l'ambra per i giudizi tiepidi
     e il rosso per le fontanelle guaste. */
  var colore = tono === 'buona' ? '#00A6A6'
             : tono === 'rossa' ? '#E5484D'
             : '#FFB020';
  return '<svg viewBox="0 0 24 24" class="stella-g">'+
    '<defs><linearGradient id="'+id+'">'+
      '<stop offset="'+(pieno*100)+'%" stop-color="'+colore+'"/>'+
      '<stop offset="'+(pieno*100)+'%" stop-color="rgba(7,36,47,.14)"/>'+
    '</linearGradient></defs>'+
    '<path fill="url(#'+id+')" d="M12 2.4l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.4l1.2-6.5L2.5 9.3l6.6-.9z"/></svg>';
}

/* La testa della scheda risponde a due domande in due quadrati affiancati:
   a sinistra come sta, a destra quanto vale. Sotto, stretta e centrata,
   la prova per eccellenza. Tre fasce orizzontali sprecavano larghezza e
   non dicevano quale contasse di più. */
function testaScheda(p){
  var f = fraseStato(p);
  var r = reviewAgg[p.target];
  var haVoti = r && r.n;

  var sinistra =
    '<div class="q q-stato '+(f.c||'')+'">'+
      '<span class="q-segno">'+f.ico+'</span>'+
      '<div class="q-t">'+esc(f.t)+'</div>'+
      (f.q ? '<div class="q-q">'+esc(f.q)+'</div>' : '')+
    '</div>';

  var destra;
  if(haVoti){
    var m = mediaVera(r); if(m == null) m = 0;

    /* Il colore non deve allarmare senza motivo: una fontanella giudicata
       bene è una buona notizia e si vede verde. L'ambra resta ai giudizi
       tiepidi, il rosso solo se la fontanella è guasta. */
    var tono = (f.c === 'bad') ? 'rossa' : (m >= 3.9 ? 'buona' : 'media');

    var stelle = '';
    for(var i = 1; i <= 5; i++)
      stelle += stellaSvg(m - (i - 1), 'ts'+i+'-'+Math.random().toString(36).slice(2,7), tono);
    destra =
      '<div class="q q-voto '+tono+'">'+
        '<div class="q-num">'+String(m).replace('.',',')+'</div>'+
        '<div class="q-stelle">'+stelle+'</div>'+
        '<div class="q-q">su '+r.n+(r.n===1?' voto':' voti')+'</div>'+
      '</div>';
  } else {
    destra =
      '<div class="q q-voto vuoto">'+
        '<div class="q-num">—</div>'+
        '<div class="q-q">nessun voto<br>ancora</div>'+
      '</div>';
  }

  return '<div class="coppia">'+sinistra+destra+'</div>'+
         (verificataConFoto(p) ? fasciaFoto() : '');
}

/* Gratis, temperatura, potabilità: informazioni che si leggono a colpo
   d'occhio e meritano lo stesso peso dei riquadri sopra, non pastiglie
   minuscole in fondo. */
function riquadriInfo(p){
  var voci = senzaStato(tagsFor(p)).slice(0, 3);
  if(!voci.length) return '';
  return '<div class="info-griglia">' + voci.map(function(t){
    return '<div class="info-q'+(t.c === 'warn' ? ' attenzione' : '')+'">'+esc(t.s)+'</div>';
  }).join('') + '</div>';
}

function fasciaFoto(){
  return '<div class="verifica-foto">'+IC_FOTO_G+'<span>Verificata con foto</span></div>';
}

function bloccoGiudizio(p){
  var r = reviewAgg[p.target];
  if(!r || !r.n){
    return '<div class="giudizio vuoto">'+
           '<span class="nessuno">Nessuno l\'ha ancora votata</span>'+
           '<span class="invito">Il primo giudizio puoi darlo tu</span></div>';
  }
  var m = mediaVera(r);
  if(m == null) m = 0;

  var stelle = '';
  for(var i = 1; i <= 5; i++){
    stelle += stellaSvg(m - (i - 1), 'st'+i+'-'+Math.random().toString(36).slice(2,7));
  }

  var nt = nomeTemperatura(r.temperature);
  return '<div class="giudizio">'+
    '<div class="voto-grande">'+
      '<span class="numero">'+String(m).replace('.',',')+'</span>'+
      '<div class="stelle-g">'+stelle+'</div>'+
    '</div>'+
    '<div class="voto-lato">'+
      '<span class="quanti">su '+r.n+(r.n===1?' voto':' voti')+'</span>'+
      (nt ? '<span class="tempb '+nt.c+'">'+esc(nt.t)+'</span>' : '')+
    '</div></div>';
}

function rigaStato(p){
  var f = fraseStato(p);
  return '<div class="stato-riga '+f.c+'">'+
         '<span class="segno">'+f.ico+'</span>'+
         '<span class="testo">'+esc(f.t)+
         (f.q ? '<b>'+esc(f.q)+'</b>' : '')+'</span></div>';
}

var STATI_SCRITTI = ['Funzionante','Segnalata rotta','Lavori in corso','Nessuno la trova',
                     'Rimossa','Da verificare','Stato sconosciuto'];
function senzaStato(elenco){
  return elenco.filter(function(t){ return STATI_SCRITTI.indexOf(t.s) === -1; });
}

function stateLabel(st){
  if(st.s==='ok')      return {c:'ok',   t:'Funzionante'};
  if(st.s==='broken')  return {c:'bad',  t:'Segnalata rotta'};
  if(st.s==='works')   return {c:'warn', t:'Lavori in corso'};
  if(st.s==='missing') return {c:'bad',  t:'Nessuno la trova'};
  if(st.s==='removed') return {c:'bad',  t:'Rimossa'};
  if(st.s==='doubt')   return {c:'warn', t:'Da verificare'};
  return {c:'', t:'Stato sconosciuto'};
}

function tagsFor(p){
  var t=p.tags, ov=p.ov||{}, out=[], st=stateOf(p), sl=stateLabel(st);
  out.push({c:sl.c, s:sl.t});
  if(t.drinking_water==='no' || ov.potable===false) out.push({c:'bad', s:'Non potabile'});
  else if(t.drinking_water==='yes' || t.amenity==='drinking_water' || ov.potable===true) out.push({c:'ok', s:'Potabile'});
  var fee = feeOf(p);
  // "Gratis, salvo sorprese" non diceva niente: o è gratis o si paga
  if(fee==='paid') out.push({c:'warn', s:'A pagamento'});
  else out.push({c:'acqua', s:'Gratis'});
  if(ov.requires_card || p.kind==='casa') out.push({c:'warn', s:'Serve la tessera sanitaria'});
  if(t.bottle==='yes') out.push({c:'', s:'Riempi la borraccia'});
  var acc = dettaglioDi(p, 'accessibile');
  if(acc === true)                            out.push({c:'ok',   s:'Accessibile in carrozzina'});
  else if(acc === false)                      out.push({c:'bad',  s:'Non accessibile in carrozzina'});
  else if(t.wheelchair==='limited')           out.push({c:'warn', s:'Accesso difficoltoso'});
  if(dettaglioDi(p, 'cani') === true || t.dog==='yes' || t.bowl==='yes' || t['drinking_water:dog']==='yes')
    out.push({c:'ok', s:'Ha la vaschetta per i cani'});
  if(t.seasonal==='yes') out.push({c:'warn', s:'Stagionale'});
  if(t.opening_hours) out.push({c:'', s:t.opening_hours});
  // il voto sta già grande in cima alla scheda: ripeterlo qui era rumore.
  // La temperatura resta, perché è un'informazione a sé.
  var r=reviewAgg[p.target];
  if(r && r.n){
    var nt = nomeTemperatura(r.temperature);
    if(nt) out.push({c:'acqua', s:nt.t});
  }
  return out;
}

/* ============================================================
   MAPPA
   ============================================================ */
function initMap(c){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([c.lat,c.lon],16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  layer=L.layerGroup().addTo(map);
  // Ogni volta che la mappa si ferma bisogna ridisegnare: da quando si
  // disegna solo l'inquadratura, senza questo restano i pin di prima.
  // toccando la mappa si chiude l'elenco della ricerca, che altrimenti
  // resta lì a coprire i filtri
  map.on('movestart click', function(){
    var w = document.getElementById('results');
    if(w && w.classList.contains('on')){
      w.classList.remove('on');
      document.getElementById('search').blur();
    }
  });
  /* Rete di sicurezza: qualunque cosa sia successa sopra, se dopo tre
     secondi da uno spostamento la mappa è ancora vuota e nessun avviso
     è visibile, si offre comunque una via d'uscita. Serve a garantire
     che non esista una combinazione di eventi in cui l'app resta muta. */
  map.on('moveend', function(){
    clearTimeout(window._reteSicurezza);
    window._reteSicurezza = setTimeout(function(){
      if(fetching) return;
      var b = map.getBounds();
      var quanti = points.filter(function(p){
        return p.lat >= b.getSouth() && p.lat <= b.getNorth() &&
               p.lon >= b.getWest()  && p.lon <= b.getEast();
      }).length;
      if(quanti) return;
      var visibile = document.getElementById('cercaQui') &&
                     !document.getElementById('cercaQui').hidden;
      var invito = document.getElementById('nessunaQui');
      if(!visibile && !invito) mostraCercaQui();
    }, 3000);
  });

  map.on('moveend zoomend', function(){
    var c2=map.getCenter();
    loadArea({lat:c2.lat, lon:c2.lng});
    render();
    aggiornaNomeCitta();
  });
}
var SOGLIA_INCERTA = 1500;   // oltre 1,5 km la distanza non vuol dire granché
var cerchioIncerto = null;

function setMe(pos){
  myPos=pos;
  if(pos.acc && pos.acc > 300){
    if(!cerchioIncerto){
