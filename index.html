/* ---------- posizione ---------- */
function askPosition(recenter){
  if(!navigator.geolocation){ toast('Posizione non disponibile su questo dispositivo.'); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var p={lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
    setMe(p);
    if(recenter) map.setView([p.lat,p.lon], p.acc>4000 ? 12 : 16);
    if(p.acc > SOGLIA_INCERTA)
      toast('La posizione è approssimativa (raggio di '+
            (p.acc>=1000 ? Math.round(p.acc/1000)+' km' : Math.round(p.acc)+' m')+
            '). Con una VPN attiva succede spesso.', 6000);
    // La posizione vera è arrivata. Se nel frattempo era partita una
    // ricerca sul centro di ripiego (Milano, mostrato mentre si aspettava
    // il GPS), non deve restare a bloccare tutto, e la città vera non va
    // trattata come "lontano da dove ho già guardato" solo perché prima
    // si era partiti da un'altra parte d'Italia. Questo è il vero punto
    // di partenza: si cerca qui, subito.
    fetching = false;
    clearTimeout(window._sbloccaOverpass);
    lastOverpassAt = 0;
    lastOverpassAt_center = p;
    loadArea(p); render();
  },function(){
    toast('Posizione non attiva. Cerca la città qui sopra.',4500);
    var c=map.getCenter(); loadArea({lat:c.lat,lon:c.lng});
  },{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
}
function watchPosition(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(function(pos){
    setMe({lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy});
    if(!selected) showNearest();
  },function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* ---------- l'accento che cambia il significato del nome ----------
   IDRÀTATI è un ordine. IDRATÀTI è come dovresti stare.            */
function accentoInMovimento(){
  var wm=document.getElementById('wm'), acc=document.getElementById('acc');
  if(!wm||!acc) return;
  var a1=wm.querySelector('.a1'), a2=wm.querySelector('.a2');
  function centro(el){ return el.offsetLeft + (el.offsetWidth - acc.offsetWidth)/2; }
  var fermo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function posiziona(){
    if(!a1.offsetWidth) return;                       // il font non è ancora pronto
    acc.style.left = centro(fermo ? a2 : a1)+'px';
    acc.style.opacity = 1;
    if(!fermo) setTimeout(function(){ acc.style.left = centro(a2)+'px'; }, 900);
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(posiziona, posiziona);
  setTimeout(posiziona, 260);
}
accentoInMovimento();

/* ============================================================
   INSTALLAZIONE
   Android sa proporsi da solo, e allora gli diamo un bottone vero.
   iPhone non lo permette, quindi lì si spiega il gesto a parole:
   nessuno lo indovina da sé.
   ============================================================ */
(function(){
  var invito = null;
  var box = document.getElementById('installa');
  if(!box) return;

  var giaApp = window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var safari = iOS && !/crios|fxios|edgios/i.test(navigator.userAgent);

  function nascondi(perSempre){
    box.classList.remove('on');
    document.body.classList.remove('invito-aperto');
    if(perSempre) store.set('idr_no_installa','1');
  }
  document.getElementById('instNo').onclick = function(){ nascondi(true); };

  function mostra(){
    if(giaApp || store.get('idr_no_installa') === '1') return;
    if(typeof adding !== 'undefined' && adding) return;   // sta segnalando: non disturbare
    box.classList.add('on');
    document.body.classList.add('invito-aperto');
  }

  // Android e desktop: il browser ci avvisa che si può installare
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    invito = e;
    document.getElementById('instSub').textContent =
      'Diventa un\'icona sulla schermata, si apre a tutto schermo e funziona anche con poca rete.';
    document.getElementById('instPassi').textContent = '';
    var si = document.getElementById('instSi');
    si.hidden = false;
    si.onclick = function(){
      nascondi(true);
      invito.prompt();
      invito.userChoice.then(function(){ invito = null; });
    };
    setTimeout(mostra, 9000);
  });

  window.addEventListener('appinstalled', function(){ nascondi(true); });

  // iPhone: niente invito automatico, si spiega il gesto
  if(safari && !giaApp){
    document.getElementById('instSub').textContent =
      'Su iPhone si aggiunge a mano, sono due tocchi.';
    document.getElementById('instPassi').innerHTML =
      'Tocca <b>Condividi</b> in fondo allo schermo<br>' +
      'poi <b>Aggiungi alla schermata Home</b>';
    setTimeout(mostra, 12000);
  }
})();

/* ---------- avvio ----------
   Ogni passo è protetto: se un pezzo dell'interfaccia non risponde,
   la mappa si deve aprire lo stesso. Uno splash fermo per sempre è
   il peggior modo di rompersi, perché non dice niente a nessuno. */
/* ============================================================
   MEMORIA LOCALE DEI PUNTI
   Overpass è gratuito e risponde quando può: una volta va, una volta no,
   e la mappa che si svuota a ogni ricarica è inaccettabile. Quello che
   è arrivato una volta resta sul telefono, e riappare subito alla
   prossima apertura mentre in sottofondo si va a cercare il resto.
   ============================================================ */
var MEMORIA_MAX = 4000;

function salvaPuntiInLocale(){
  try {
    var da_salvare = points.slice(-MEMORIA_MAX).map(function(p){
      var t = p.tags || {};
      return [p.target, +p.lat.toFixed(6), +p.lon.toFixed(6), p.kind || 'fontanella',
              t.name || '', t.drinking_water || '', t.fee || '', t.access || '',
              t.wheelchair || '', t.bottle || '', t.seasonal || '', t.check_date || ''];
    });
    store.set('idr_punti', JSON.stringify({q: Date.now(), p: da_salvare}));
  } catch(e){ /* memoria piena o negata: pazienza, non è essenziale */ }
}

function ripristinaPuntiDaLocale(){
  try {
    var grezzo = store.get('idr_punti');
    if(!grezzo) return 0;
    var d = JSON.parse(grezzo);
    if(!d || !d.p || !d.p.length) return 0;
    // oltre un mese i dati sono vecchi: meglio riscaricarli
    if(Date.now() - (d.q || 0) > 31 * 864e5){ store.set('idr_punti', null); return 0; }

    var rifatti = d.p.map(function(r){
      var tags = {};
      if(r[4])  tags.name = r[4];
      if(r[5])  tags.drinking_water = r[5];
      if(r[6])  tags.fee = r[6];
      if(r[7])  tags.access = r[7];
      if(r[8])  tags.wheelchair = r[8];
      if(r[9])  tags.bottle = r[9];
      if(r[10]) tags.seasonal = r[10];
      if(r[11]) tags.check_date = r[11];
      var id = String(r[0]).indexOf('osm/') === 0 ? String(r[0]).slice(4) : r[0];
      return {id:id, target:r[0], lat:r[1], lon:r[2], kind:r[3], tags:tags, daMemoria:true};
    });
    addPoints(rifatti);
    DIARIO.memoria = rifatti.length;
    return rifatti.length;
  } catch(e){ return 0; }
}

/* Quando la mappa resta vuota, l'app deve saper dire perché invece di
   lasciare indovinare. Cinque tocchi sul numero di versione e compare
   il resoconto di dove sono arrivati — o non arrivati — i punti. */
function mostraDiagnostica(){
  var d = DIARIO;
  var righe = [
    ['Punti sulla mappa', d.disegnati],
    ['Ripresi dal telefono', d.memoria],
    ['Da archivio locale', d.snapshot + (d.snapshotMancanti ? '  (' + d.snapshotMancanti + ' aree senza archivio)' : '')],
    ['Da OpenStreetMap', d.overpass],
    ['Da Supabase', d.supabase],
    ['Ultimo server usato', d.ultimoServer ? d.ultimoServer.replace('https://','').split('/')[0] : 'nessuno'],
    ['Errori recenti', d.overpassErrori.length ? d.overpassErrori.join(' · ') : 'nessuno']
  ];
  if(document.querySelector('.diag')) return;
  var w = document.createElement('div');
  w.className = 'diag';
  w.innerHTML = '<div class="diag-box">'+
    '<div class="diag-t">Da dove arrivano i punti</div>'+
    righe.map(function(r){
      return '<div class="diag-r"><span>'+r[0]+'</span><b>'+esc(String(r[1]))+'</b></div>';
    }).join('')+
    '<div class="diag-n">Se «Da archivio locale» e «Da OpenStreetMap» sono entrambi a zero, '+
    'la mappa non ha ricevuto dati: o manca l\'archivio sul sito, o i server di '+
    'OpenStreetMap non rispondono.</div>'+
    '<button class="btn" id="diagChiudi">Chiudi</button></div>';
  document.body.appendChild(w);
  document.getElementById('diagChiudi').onclick = function(){ w.remove(); };
}

/* La fotografia dello splash si mostra solo quando è davvero caricata:
   se il file non c'è, o la rete è lenta, resta la sfumatura e nessuno
   vede un buco. */
/* Due fotografie, una per ogni modo di tenere il telefono: quella
   verticale riempie lo schermo in piedi, quella orizzontale di traverso.
   Usare una sola immagine per entrambi vuol dire tagliarla male in uno
   dei due casi. Se il file non c'è, resta la sfumatura chiara e nessuno
   se ne accorge. */
(function fotoSplash(){
  var sf = document.getElementById('splashSfondo');
  if(!sf || typeof Image === 'undefined') return;

  var caricate = {};

  function orizzontale(){
    return window.innerWidth > window.innerHeight;
  }

  function mostra(){
    // per ogni orientamento, i nomi possibili in ordine di preferenza
    var nomi = orizzontale()
      ? ['splash-orizzontale.jpg', 'splash-orizzontale.jpeg', 'splash.jpg', 'splash.jpeg']
      : ['splash-verticale.jpg',   'splash-verticale.jpeg',   'splash.jpg', 'splash.jpeg'];
    var i = 0;

    function prova(){
      if(i >= nomi.length) return;        // nessuna foto adatta: pazienza
      var nome = nomi[i++];

      if(caricate[nome]){                 // già scaricata prima: si mostra subito
        sf.style.backgroundImage = "url('" + nome + "')";
        sf.classList.add('pronta');
        return;
      }
      var img = new Image();
      img.onload = function(){
        caricate[nome] = true;
        sf.style.backgroundImage = "url('" + nome + "')";
        sf.classList.add('pronta');
      };
      img.onerror = prova;                // questa non c'è: provo la prossima
      img.src = nome;
    }
    prova();
  }

  mostra();
  // se giri il telefono mentre lo splash è ancora visibile, cambia foto
  window.addEventListener('resize', function(){
    var sp = document.getElementById('splash');
    if(sp && !sp.classList.contains('gone')) mostra();
  });
})();

/* ============================================================
   PULIZIA DELLE VERSIONI VECCHIE
   Il guardiano di una versione precedente può continuare a servire il
   codice di prima anche quando il file nuovo è già online: da fuori
   sembra che l'aggiornamento non arrivi mai. Qui la versione attuale
   si presenta, butta via tutto quello che non le appartiene, e se
   trova roba vecchia ricarica una volta sola per ripartire pulita.
   ============================================================ */
var VERSIONE_CACHE = 'idratati-v7-2';

(function pulisciVecchieVersioni(){
  // non basta che la proprietà esista: alcuni browser la dichiarano
  // senza implementarla, e chiamarla lì butterebbe giù tutta l'app
  // prima ancora che compaia la mappa
  if(!window.caches || typeof window.caches.keys !== 'function') return;
  window.caches.keys().then(function(chiavi){
    var vecchie = chiavi.filter(function(k){
      return k.indexOf('idratati-') === 0 && k !== VERSIONE_CACHE;
    });
    if(!vecchie.length) return;
    Promise.all(vecchie.map(function(k){ return window.caches.delete(k); }))
      .then(function(){
        // una volta sola: il segno resta finché la scheda è aperta
        if(!sessionStorage.getItem('idr_ripulito')){
          try{ sessionStorage.setItem('idr_ripulito','1'); }catch(e){}
          location.reload();
        }
      });
  }).catch(function(){});
})();

/* ============================================================
   QUANDO LA RETE NON C'È
   Senza il guscio offline, l'app ha bisogno della rete per funzionare.
   Se manca deve dirlo chiaramente, invece di mostrare una mappa vuota
   che sembra un guasto. L'avviso appare quando il telefono si accorge
   di essere scollegato, o quando le richieste falliscono di seguito.
   ============================================================ */
var fallimentiDiFila = 0;

function mostraAvvisoRete(testo){
  var a = document.getElementById('avvisoRete');
  if(!a){
    a = document.createElement('div');
    a.id = 'avvisoRete';
    document.body.appendChild(a);
  }
  a.innerHTML =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="2.2" stroke-linecap="round"><path d="M1 1l22 22"/>'+
    '<path d="M16.7 13.7A5 5 0 0 0 12 12"/><path d="M5 12.6a10 10 0 0 1 4-2.4"/>'+
    '<path d="M2 8.8A15 15 0 0 1 7.4 6"/><path d="M22 8.8a15 15 0 0 0-6.3-3.4"/>'+
    '<path d="M12 20h.01"/></svg><span>'+esc(testo)+'</span>';
  a.classList.add('on');
}

function nascondiAvvisoRete(){
  var a = document.getElementById('avvisoRete');
  if(a) a.classList.remove('on');
  fallimentiDiFila = 0;
}

function segnalaFallimentoRete(){
  fallimentiDiFila++;
  /* Dire "non riesco a raggiungere i server" sopra una mappa piena di
     fontanelle è un falso allarme che fa sembrare rotta un'app che
     funziona. L'avviso ha senso solo se davvero non si vede niente. */
  if(typeof vistaVuota === 'function' && !vistaVuota()) return;
  // un inciampo capita: si avvisa dal terzo in poi
  if(fallimentiDiFila >= 3)
    mostraAvvisoRete('Non riesco a raggiungere i server. Controlla la connessione.');
}

(function ascoltaLaRete(){
  if(typeof navigator.onLine === 'boolean' && !navigator.onLine)
    mostraAvvisoRete('Sei senza connessione. La mappa non può aggiornarsi.');

  window.addEventListener('offline', function(){
    mostraAvvisoRete('Sei senza connessione. La mappa non può aggiornarsi.');
  });
  window.addEventListener('online', function(){
    nascondiAvvisoRete();
    // tornata la rete, si riprova subito
    if(map){ lastOverpassAt = 0; tilesLoaded = {}; loadArea(map.getCenter ?
      {lat:map.getCenter().lat, lon:map.getCenter().lng} : FALLBACK); }
  });
})();

/* ============================================================
   NIENTE SERVICE WORKER, PER ORA
   Serviva a far aprire la mappa anche senza rete, ma ha causato più
   danni di quanti benefici desse: serviva versioni vecchie del codice
   senza che si potesse capire perché, e su alcune richieste rispondeva
   il vuoto facendo fallire mappa e dati in modo intermittente.
   Qui viene disinstallato e le sue cache cancellate. Quando l'app sarà
   stabile lo si potrà rimettere, scritto meglio.
   ============================================================ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(elenco){
    if(!elenco.length) return;
    Promise.all(elenco.map(function(reg){ return reg.unregister(); }))
      .then(function(){
        if(window.caches && typeof window.caches.keys === 'function'){
          return window.caches.keys().then(function(chiavi){
            return Promise.all(chiavi.map(function(k){ return window.caches.delete(k); }));
          });
        }
      })
      .then(function(){
        // una volta sola, per ripartire con il codice vero
        if(!sessionStorage.getItem('idr_sw_via')){
          try{ sessionStorage.setItem('idr_sw_via','1'); }catch(e){}
          location.reload();
        }
      })
      .catch(function(){});
  }).catch(function(){});
}
})();
</script>
