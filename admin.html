function disegnaNote(rows){
  var box = el('noteLista');
  if(!box) return;
  if(!rows.length){ box.innerHTML = '<div class="empty">Nessuna nota trovata.</div>'; return; }

  box.innerHTML = rows.map(function(n,i){
    var max = FONTI_NOTA[n.fonte].max;
    return '<div class="card nota-card">'+
      '<div class="nota-testa"><span class="pill '+(COLORE_NOTA[n.fonte]||'')+'">'+ETICH_NOTA[n.fonte]+'</span>'+
        '<span class="meta">'+esc(n.target)+'</span></div>'+
      '<textarea class="nota-testo" data-max="'+max+'" id="txt-n'+i+'">'+esc(n.testo||'')+'</textarea>'+
      '<div class="nota-conta" id="cnt-n'+i+'"></div>'+
      '<div class="meta" id="chi-n'+i+'">'+esc(ago(n.created_at))+' \u00b7 '+esc(n.device||'dispositivo sconosciuto')+'</div>'+
      '<div class="row">'+
        '<button class="btn ok sm" data-salva="'+i+'">Salva</button>'+
        '<button class="btn bad sm" data-elimina="'+i+'">Elimina il testo</button>'+
        '<button class="btn ghost sm" data-goto="'+esc(n.target)+'">Vai al punto</button>'+
      '</div></div>';
  }).join('');

  collegaVaiA();

  rows.forEach(function(n,i){
    var ta = el('txt-n'+i), c = el('cnt-n'+i);
    function agg(){
      var l = ta.value.length, max = +ta.getAttribute('data-max');
      c.textContent = l+' / '+max;
      c.classList.toggle('oltre', l>max);
    }
    ta.addEventListener('input', agg); agg();
  });

  pesaDispositivi(rows.map(function(n){ return n.client_id; })).then(function(){
    rows.forEach(function(n,i){
      var e2 = el('chi-n'+i);
      if(e2) e2.innerHTML = chiHaMandato(n.client_id, ago(n.created_at), n);
    });
  });

  box.querySelectorAll('[data-salva]').forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute('data-salva'), n = rows[i], ta = el('txt-n'+i);
      var testo = ta.value.trim(), max = FONTI_NOTA[n.fonte].max;
      if(testo.length > max){ toast('Troppo lungo: al massimo '+max+' caratteri.'); return; }
      b.disabled = true;
      var body = {}; body[FONTI_NOTA[n.fonte].campo] = testo || null;
      patch(FONTI_NOTA[n.fonte].tabella, 'id=eq.'+n.id, body)
        .then(function(){ toast('Nota salvata.'); vNote(); })
        .catch(function(e){ b.disabled=false; toast(e.message); });
    };
  });
  box.querySelectorAll('[data-elimina]').forEach(function(b){
    b.onclick = function(){
      if(!confirm('Cancellare il testo di questa nota? Il voto o la segnalazione restano, sparisce solo la frase.')) return;
      var i = +b.getAttribute('data-elimina'), n = rows[i];
      b.disabled = true;
      var body = {}; body[FONTI_NOTA[n.fonte].campo] = null;
      patch(FONTI_NOTA[n.fonte].tabella, 'id=eq.'+n.id, body)
        .then(function(){ toast('Testo eliminato.'); vNote(); })
        .catch(function(e){ b.disabled=false; toast(e.message); });
    };
  });
}

/* ============================================================
   CITTA' -- quante fontanelle sono valutate, citt\u00e0 per citt\u00e0.
   ============================================================ */
/* ============================================================
   NOMI — rinominare i punti d'acqua senza cercarli sulla mappa

   La rinomina in sé esisteva già dentro l'editor di "Mappa e
   modifiche", ma per usarla bisognava prima trovare il punto
   trascinando una mappa: impraticabile se quello che sai è che
   "da qualche parte c'è una fontanella con un nome brutto".
   Qui si cerca per testo.

   Come funziona sotto: le 103.000 fontanelle di OpenStreetMap
   stanno in file statici dentro data/, e ogni mese vengono
   riscritte da capo — scrivere lì sarebbe inutile, la modifica
   sparirebbe. Il nome nuovo va invece in una riga della tabella
   fountains con osm_id valorizzato, che l'app legge DOPO OSM e
   che quindi vince sempre. È lo stesso meccanismo delle note e
   dello stato, quindi non serve niente di nuovo nel database.
   ============================================================ */
var NOMI_CACHE = null;      // i riquadri già scaricati, per non rifarlo a ogni ricerca

function vNomi(){
  el('view').innerHTML =
    '<div class="card">'+
      '<h3>Rinomina i punti d\'acqua</h3>'+
      '<div class="meta">Cerca per nome, o per città. Il nome che scrivi qui vince '+
      'su quello di OpenStreetMap e <b>resta anche dopo l\'aggiornamento mensile</b>. '+
      'Lascia il campo vuoto e salva per tornare al nome originale.</div>'+
      '<label>Cerca</label>'+
      '<input id="nqText" placeholder="Es. fontanella, piazza, drinking…" autocomplete="off">'+
      '<div class="grid2">'+
        '<div><label>Dove</label><input id="nqCitta" placeholder="Milano" autocomplete="off"></div>'+
        '<div><label>&nbsp;</label><button class="btn ok" id="nqGo" style="width:100%">Cerca</button></div>'+
      '</div>'+
      '<div class="meta" id="nqStato" style="margin-top:8px"></div>'+
    '</div>'+
    '<div id="nqRis"></div>';

  el('nqGo').onclick = cercaNomi;
  el('nqText').onkeydown = function(e){ if(e.key==='Enter') cercaNomi(); };
  el('nqCitta').onkeydown = function(e){ if(e.key==='Enter') cercaNomi(); };

  // parto mostrando quelli che HAI già rinominato: è la cosa più utile
  // all'apertura, e non costa nessun download di riquadri
  sel('fountains?select=*&osm_id=not.is.null&name=not.is.null&order=updated_at.desc&limit=50')
    .then(function(rows){
      if(!rows.length) return;
      el('nqRis').innerHTML = '<div class="card"><h3>Già rinominati da te</h3>'+
        '<div class="meta">Gli ultimi ' + rows.length + '. Cerca sopra per trovarne altri.</div></div>' +
        rows.map(function(r){ return rigaNome({
          target:'osm/'+r.osm_id, osm_id:r.osm_id, lat:r.lat, lon:r.lon,
          kind:r.kind, nomeOsm:'', nomeTuo:r.name, riga:r }); }).join('');
      aggancia();
    }).catch(function(e){ toast(e.message); });
}

/* Le coordinate di una città: prima la tabella citta (che ce le ha
   già per le 101 in elenco), altrimenti Nominatim. */
function dovePosta(nome){
  if(!nome) return Promise.resolve(null);
  return sel('citta?select=nome,lat,lon&nome=ilike.'+encodeURIComponent('%'+nome+'%')+'&limit=1')
    .then(function(r){
      if(r && r.length && r[0].lat) return {lat:+r[0].lat, lon:+r[0].lon, nome:r[0].nome};
      return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q='+
                   encodeURIComponent(nome))
        .then(function(x){ return x.json(); })
        .then(function(d){
          if(!d || !d.length) return null;
          return {lat:+d[0].lat, lon:+d[0].lon, nome:nome};
        });
    })
    .catch(function(){ return null; });
}

/* Scarica i riquadri statici intorno a un punto e ne estrae i punti
   che HANNO un nome: quelli senza nome non si possono "rinominare
   male", e mostrarli tutti significherebbe un elenco di migliaia. */
function riquadriIntorno(c, raggioGradi){
  var d = raggioGradi || 0.05, chiavi = [], viste = {};
  for(var la = c.lat-d; la <= c.lat+d+0.001; la += 0.25)
    for(var lo = c.lon-d; lo <= c.lon+d+0.001; lo += 0.25){
      var k = (Math.floor(la*2)/2).toFixed(1) + '_' + (Math.floor(lo*2)/2).toFixed(1);
      if(!viste[k]){ viste[k] = 1; chiavi.push(k); }
    }
  return Promise.all(chiavi.map(function(k){
    if(NOMI_CACHE && NOMI_CACHE[k]) return NOMI_CACHE[k];
    return fetch('data/'+k+'.json')
      .then(function(r){ return r.ok ? r.json() : {p:[]}; })
      .then(function(d){
        var pts = (d.p||[]).map(function(a){
          return {id:a[0], target:'osm/'+a[0], lat:a[1], lon:a[2],
                  kind:(a[3]===1?'casa':'fontanella'), nome:a[4]||''};
        });
        NOMI_CACHE = NOMI_CACHE || {};
        NOMI_CACHE[k] = pts;
        return pts;
      })
      .catch(function(){ return []; });
  })).then(function(liste){
    return liste.reduce(function(a,b){ return a.concat(b); }, []);
  });
}

function cercaNomi(){
  var testo = (el('nqText').value||'').trim().toLowerCase();
  var citta = (el('nqCitta').value||'').trim();
  var stato = el('nqStato');

  if(!testo && !citta){ toast('Scrivi almeno una parola o una città.'); return; }

  stato.textContent = 'Cerco…';
  el('nqRis').innerHTML = '';

  dovePosta(citta).then(function(c){
    if(citta && !c){ stato.textContent = 'Non trovo la città "'+citta+'".'; return; }
    if(!c){ stato.textContent = 'Serve una città: i dati sono divisi per zona e senza '+
            'un punto di partenza dovrei scaricare tutta l\'Italia.'; return; }

    return Promise.all([
      riquadriIntorno(c, 0.05),
      sel('fountains?select=*&lat=gte.'+(c.lat-0.06)+'&lat=lte.'+(c.lat+0.06)+
          '&lon=gte.'+(c.lon-0.06)+'&lon=lte.'+(c.lon+0.06)+'&limit=1000')
    ]).then(function(res){
      var osm = res[0], db = res[1]||[];
      var ov = {}; db.forEach(function(r){ if(r.osm_id) ov[r.osm_id] = r; });

      var lista = osm.filter(function(p){
        var attuale = (ov[p.id] && ov[p.id].name) || p.nome || '';
        if(!attuale) return false;                       // senza nome: niente da rinominare
        return !testo || attuale.toLowerCase().indexOf(testo) >= 0;
      }).slice(0, 80);

      // anche i punti tuoi (non OSM) possono avere nomi da sistemare
      var miei = db.filter(function(r){
        return !r.osm_id && r.name &&
               (!testo || r.name.toLowerCase().indexOf(testo) >= 0);
      });

      if(!lista.length && !miei.length){
        stato.textContent = 'Nessun punto con un nome corrisponde.';
        el('nqRis').innerHTML = '<div class="empty">Niente da rinominare qui.</div>';
        return;
      }

      stato.textContent = lista.length + miei.length + ' trovati intorno a ' + esc(c.nome||citta) +
        (lista.length >= 80 ? ' (mostro i primi 80)' : '');

      el('nqRis').innerHTML =
        lista.map(function(p){ return rigaNome({
          target:p.target, osm_id:p.id, lat:p.lat, lon:p.lon, kind:p.kind,
          nomeOsm:p.nome, nomeTuo:(ov[p.id]&&ov[p.id].name)||'', riga:ov[p.id]||null });
        }).join('') +
        miei.map(function(r){ return rigaNome({
          target:'db/'+r.id, osm_id:null, lat:r.lat, lon:r.lon, kind:r.kind,
          nomeOsm:'', nomeTuo:r.name, riga:r }); }).join('');
      aggancia();
    });
  }).catch(function(e){ stato.textContent = 'Errore: ' + e.message; });
}

function rigaNome(o){
  var chiave = o.target.replace(/[^a-zA-Z0-9]/g,'_');
  var tipo = o.kind === 'casa' ? "Casa dell'acqua" : 'Fontanella';
  return '<div class="card" data-nome="'+esc(chiave)+'" '+
    'data-osm="'+esc(o.osm_id||'')+'" data-id="'+esc((o.riga&&o.riga.id)||'')+'" '+
    'data-lat="'+o.lat+'" data-lon="'+o.lon+'" data-kind="'+esc(o.kind)+'">'+
    '<div class="pills"><span class="pill">'+esc(tipo)+'</span>'+
      (o.osm_id ? '<span class="pill">OpenStreetMap</span>'
                : '<span class="pill">Punto tuo</span>')+
      (o.nomeTuo ? '<span class="pill">rinominato</span>' : '')+'</div>'+
    (o.nomeOsm ? '<div class="meta" style="margin-top:6px">OSM dice: <b>'+esc(o.nomeOsm)+'</b></div>' : '')+
    '<input class="nqNome" id="nn_'+esc(chiave)+'" value="'+esc(o.nomeTuo||'')+'" '+
      'placeholder="'+esc(o.nomeOsm||'Fontanella pubblica')+'" maxlength="60">'+
    '<div class="row">'+
      '<button class="btn ok sm nqSalva" data-k="'+esc(chiave)+'">Salva</button>'+
      '<a class="btn ghost sm" target="_blank" rel="noopener" '+
        'href="https://www.openstreetmap.org/?mlat='+o.lat+'&mlon='+o.lon+'#map=19/'+o.lat+'/'+o.lon+'">Dove</a>'+
    '</div></div>';
}

function aggancia(){
  document.querySelectorAll('.nqSalva').forEach(function(b){
    b.onclick = function(){ salvaNome(b); };
  });
}

function salvaNome(b){
  var card = b.closest('[data-nome]');
  var nome = (el('nn_' + b.getAttribute('data-k')).value || '').trim();
  var osm  = card.getAttribute('data-osm');
  var idr  = card.getAttribute('data-id');

  b.disabled = true; b.textContent = 'Salvo…';

  var fine = function(msg){
    b.disabled = false; b.textContent = 'Salva';
    toast(msg);
  };

  if(idr){
    // la riga esiste già: basta cambiarle il nome
    patch('fountains', 'id=eq.'+idr, {name: nome || null})
      .then(function(){ fine(nome ? 'Rinominata.' : 'Tornata al nome originale.'); })
      .catch(function(e){ fine('Non salvato: '+e.message); });
    return;
  }

  if(!nome){ fine('Era già il nome originale: niente da salvare.'); return; }

  // prima volta che questo punto OSM viene toccato: nasce la riga di
  // sovrascrittura. status 'unknown' e status_locked falso, così il
  // nome non porta con sé nessuna opinione sullo stato dell'acqua.
  ins('fountains', {
    osm_id: osm || null,
    lat: +card.getAttribute('data-lat'),
    lon: +card.getAttribute('data-lon'),
    kind: card.getAttribute('data-kind') || 'fontanella',
    name: nome, status: 'unknown', source: 'admin'
  }).then(function(righe){
    if(righe && righe[0] && righe[0].id) card.setAttribute('data-id', righe[0].id);
    fine('Rinominata.');
  }).catch(function(e){ fine('Non salvato: '+e.message); });
}

function vCitta(){
  Promise.all([
    sel('v_citta?select=*&order=attive.desc,fontanelle_mappate.desc'),
    sel('v_numeri?select=fontanelle_attive,recensioni_totali,foto_totali')
  ]).then(function(res){
    var righe = res[0]||[], num = (res[1]||[])[0]||{};
    var sommaAttive     = righe.reduce(function(a,r){ return a+(r.attive||0); },0);
    var sommaRecensioni = righe.reduce(function(a,r){ return a+(r.recensioni||0); },0);
    var sommaFoto       = righe.reduce(function(a,r){ return a+(r.foto||0); },0);
    var fuoriAttive     = Math.max(0, (num.fontanelle_attive||0) - sommaAttive);
    var fuoriRecensioni = Math.max(0, (num.recensioni_totali||0) - sommaRecensioni);
    var fuoriFoto       = Math.max(0, (num.foto_totali||0) - sommaFoto);

    var top = righe.filter(function(r){ return r.attive>0; });
    var maxAttive = Math.max.apply(null, top.map(function(r){ return r.attive; }).concat([1]));

    var h = '<div class="card"><div class="meta">L\'89% delle fontanelle italiane censite su '+
      'OpenStreetMap sta fuori dalle '+righe.length+' citt\u00e0 in elenco: paesi, frazioni, campagna. '+
      'Qui sotto solo le citt\u00e0 dove qualcuno ha gi\u00e0 votato, fotografato o segnalato qualcosa.</div></div>';

    if(!top.length){
      h += '<div class="empty">Nessuna citt\u00e0 ha ancora attivit\u00e0.</div>';
    } else {
      h += '<div class="card">' + top.map(function(r){
        var pct = Math.round(100*r.attive/maxAttive);
        return '<div class="citta-riga">'+
          '<div><div class="citta-nome">'+esc(r.nome)+' <span class="meta">('+esc(r.provincia)+')</span></div>'+
            '<div class="meta">'+r.fontanelle_mappate+' mappate su OpenStreetMap'+
            (r.copertura_pct!=null?' \u00b7 '+r.copertura_pct+'% coperte':'')+'</div></div>'+
          '<div style="text-align:right"><div style="font-family:var(--display);font-weight:700;font-size:19px">'+
            r.attive+'</div><div class="meta">attive</div></div>'+
          '<div class="citta-barra"><i style="width:'+pct+'%"></i></div>'+
          '<div class="pills" style="grid-column:1/-1;margin-top:2px">'+
            '<span class="pill">'+(r.recensioni||0)+' recensioni</span>'+
            '<span class="pill">'+(r.foto||0)+' foto</span>'+
            (r.voto_medio!=null?'<span class="pill ok">voto medio '+r.voto_medio+'</span>':'')+
            (r.ultima_attivita?'<span class="pill">ultima attivit\u00e0 '+esc(ago(r.ultima_attivita))+'</span>':'')+
          '</div></div>';
      }).join('') + '</div>';
    }

    h += '<div class="card"><h3>Fuori dalle citt\u00e0</h3>'+
      '<div class="meta">Paesi, frazioni, campagna: tutto quello che non rientra nel raggio di nessuna '+
      'delle '+righe.length+' citt\u00e0 qui sopra.</div>'+
      '<div class="stat"><span>Fontanelle attive</span><b>'+fuoriAttive+'</b></div>'+
      '<div class="stat"><span>Recensioni</span><b>'+fuoriRecensioni+'</b></div>'+
      '<div class="stat"><span>Foto</span><b>'+fuoriFoto+'</b></div></div>';

    el('view').innerHTML = h;
  }).catch(function(e){ el('view').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ============================================================
   RICOMPRIMI LE FOTO VECCHIE -- una tantum.
   Il 4 agosto 2026 l'obiettivo di compressione e' sceso da 110 a 45 KB.
   Le foto caricate PRIMA che quella logica esistesse (fine luglio) non
   sono mai passate da nessuna compressione: pesano fino a 738 KB. Qui
   si scaricano, si passano dalla stessa identica funzione che usa il
   sito pubblico, e si ricaricano al posto dell'originale con lo stesso
   nome -- l'indirizzo non cambia, quindi non serve toccare nessuna riga
   nelle tabelle che lo referenziano.
   Questa pagina si puo' cancellare una volta usata: e' un lavoro da
   fare una volta sola, non un pezzo del pannello che serve ogni giorno.
   ============================================================ */
var RIC_OBIETTIVO = 45*1024;
var RIC_GRADINI = [
  {lato:560, q:.42}, {lato:460, q:.34}, {lato:460, q:.26}, {lato:360, q:.26}, {lato:280, q:.24}
];
function ricDisegna(blob, maxPx){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(blob);
    img.onload = function(){
      var s = Math.min(1, maxPx/Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c);                  // la TELA, non ancora compressa: ogni
    };                         // gradino la comprime alla sua qualità
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('immagine illeggibile')); };
    img.src = url;
  });
}
function ricComprimi(blobOriginale){
  var tele = {};
  function tela(lato){
    if(tele[lato]) return Promise.resolve(tele[lato]);
    return ricDisegna(blobOriginale, lato).then(function(c){ tele[lato]=c; return c; });
  }
  function gradino(i, migliore){
    if(i >= RIC_GRADINI.length) return Promise.resolve(migliore);
    var g = RIC_GRADINI[i];
    return tela(g.lato).then(function(c){
      return new Promise(function(r){ c.toBlob(r, 'image/jpeg', g.q); });
    }).then(function(b){
      var nuovoMigliore = (!migliore || b.size < migliore.size) ? b : migliore;
      if(b.size <= RIC_OBIETTIVO) return b;
      return gradino(i+1, nuovoMigliore);
    });
  }
  return gradino(0, null);
}

function vRicomprimi(){
  el('view').innerHTML = '<div class="card"><h3>Foto vecchie da alleggerire</h3>'+
    '<div class="meta">Cerco quali foto sono ancora pesanti…</div></div>';
  sel('photos?select=id,path&order=created_at.asc')
    .then(function(righe){ return Promise.all(righe.map(function(r){
      return fetch(photoUrl(r.path), {method:'HEAD'}).then(function(resp){
        var peso = +resp.headers.get('content-length') || 0;
        return {path:r.path, peso:peso};
      })['catch'](function(){ return {path:r.path, peso:0}; });
    })); })
    .then(function(tutte){
      var pesanti = tutte.filter(function(r){ return r.peso > 120*1024; });
      if(!pesanti.length){
        el('view').innerHTML = '<div class="card"><h3>Foto vecchie da alleggerire</h3>'+
          '<div class="empty">Nessuna foto sopra i 120 KB. Non c\'è niente da fare.</div></div>';
        return;
      }
      var totalePrima = pesanti.reduce(function(a,r){ return a+r.peso; }, 0);
      el('view').innerHTML =
        '<div class="card"><h3>Foto vecchie da alleggerire</h3>'+
        '<div class="meta">'+pesanti.length+' foto sopra i 120 KB, '+
        (totalePrima/1048576).toFixed(1)+' MB in tutto. Verranno ricompresse con la '+
        'stessa scala che usa già il sito e ricaricate allo stesso indirizzo: '+
        'nessuna tabella da toccare.</div>'+
        '<div class="row" style="margin-top:12px"><button class="btn ok" id="ricVia">Ricomprimi tutte</button></div>'+
        '<div class="bk-barra" style="margin-top:14px"><i id="ricBarra"></i></div>'+
        '<div id="ricEsito" class="meta" style="margin-top:8px"></div></div>';

      el('ricVia').onclick = function(){
        var b = this; b.disabled = true; b.textContent = 'Lavoro…';
        var fatte = 0, primaTot = 0, dopoTot = 0, errori = [];
        function prossima(i){
          if(i >= pesanti.length){
            b.textContent = 'Fatto';
            el('ricEsito').innerHTML = fatte+' foto ricompresse. '+
              (primaTot/1048576).toFixed(1)+' MB → '+(dopoTot/1048576).toFixed(1)+' MB.'+
              (errori.length ? '<br>Non riuscite: '+errori.join(', ') : '');
            toast('Fatto: '+fatte+' foto alleggerite.');
            return;
          }
          var r = pesanti[i];
          el('ricEsito').textContent = 'Foto '+(i+1)+' di '+pesanti.length+'…';
          el('ricBarra').style.width = Math.round((i/pesanti.length)*100)+'%';
          fetch(photoUrl(r.path)).then(function(resp){
            if(!resp.ok) throw new Error('scarico: HTTP '+resp.status);
            return resp.blob();
          }).then(function(blobOriginale){
            return ricComprimi(blobOriginale);
          }).then(function(blobNuovo){
            return fetch(CFG.SUPABASE_URL+'/storage/v1/object/photos/'+r.path, {
              method:'PUT', headers:H({'Content-Type':'image/jpeg','x-upsert':'true'}), body:blobNuovo
            }).then(function(resp){
              if(!resp.ok) throw new Error('carico: HTTP '+resp.status);
              fatte++; primaTot += r.peso; dopoTot += blobNuovo.size;
            });
          })['catch'](function(e){
            errori.push(r.path.split('/').pop());
          }).then(function(){ prossima(i+1); });
        }
        prossima(0);
      };
    })['catch'](function(e){
      el('view').innerHTML = '<div class="empty">'+esc(e.message)+'</div>';
    });
}

/* ============================================================
   BACKUP — portare via tutto, foto comprese.
   Il punto delicato: salvare l'indirizzo di una foto non serve a
   niente. Se Supabase un giorno sparisse, quegli indirizzi
   punterebbero al nulla. Qui le foto vengono scaricate davvero e
   messe dentro lo zip come file veri.
   ============================================================ */

/* Un creatore di zip in una cinquantina di righe. Niente librerie da
   fuori: sarebbe una dipendenza in piu' proprio nello strumento che
   deve funzionare il giorno in cui non funziona piu' niente altro.
   I file vengono messi dentro senza compressione ("store"): le foto
   sono gia' JPEG, comprimerle una seconda volta non guadagna nulla. */
var CRC_TAB = (function(){
  var t = new Uint32Array(256), c, n, k;
  for(n = 0; n < 256; n++){
    c = n;
    for(k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF;
  for(var i = 0; i < buf.length; i++) c = CRC_TAB[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipCrea(voci){
  var pezzi = [], centrale = [], offset = 0;
  var d = new Date();
  var oraDos = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() / 2)) & 0xFFFF;
  var dataDos = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;

  function scrivi(arr, val, byte){
    for(var i = 0; i < byte; i++) arr.push((val >>> (i * 8)) & 0xFF);
  }

  voci.forEach(function(v){
    var nome = new TextEncoder().encode(v.nome);
    var dati = v.dati;
    var crc  = crc32(dati);
    var testa = [];
    scrivi(testa, 0x04034B50, 4);           // firma
    scrivi(testa, 20, 2);                   // versione minima
    scrivi(testa, 0x0800, 2);               // nomi in UTF-8
    scrivi(testa, 0, 2);                    // nessuna compressione
    scrivi(testa, oraDos, 2); scrivi(testa, dataDos, 2);
    scrivi(testa, crc, 4);
    scrivi(testa, dati.length, 4); scrivi(testa, dati.length, 4);
    scrivi(testa, nome.length, 2); scrivi(testa, 0, 2);
    pezzi.push(new Uint8Array(testa), nome, dati);

    var c = [];
    scrivi(c, 0x02014B50, 4);
    scrivi(c, 20, 2); scrivi(c, 20, 2);
    scrivi(c, 0x0800, 2); scrivi(c, 0, 2);
    scrivi(c, oraDos, 2); scrivi(c, dataDos, 2);
    scrivi(c, crc, 4);
    scrivi(c, dati.length, 4); scrivi(c, dati.length, 4);
    scrivi(c, nome.length, 2); scrivi(c, 0, 2); scrivi(c, 0, 2);
    scrivi(c, 0, 2); scrivi(c, 0, 2); scrivi(c, 0, 4);
    scrivi(c, offset, 4);
    centrale.push(new Uint8Array(c), nome);
    offset += testa.length + nome.length + dati.length;
  });

  var pesoCentrale = centrale.reduce(function(a, x){ return a + x.length; }, 0);
  var fine = [];
  scrivi(fine, 0x06054B50, 4);
  scrivi(fine, 0, 2); scrivi(fine, 0, 2);
  scrivi(fine, voci.length, 2); scrivi(fine, voci.length, 2);
  scrivi(fine, pesoCentrale, 4); scrivi(fine, offset, 4);
  scrivi(fine, 0, 2);
  return new Blob(pezzi.concat(centrale, [new Uint8Array(fine)]), {type:'application/zip'});
}

var TABELLE_BACKUP = ['fountains','reports','reviews','photos','submissions',
                      'problemi','dettagli','punti','citta','visite','admins'];

function bkPasso(id, stato, testo){
  var e = el(id); if(!e) return;
  e.className = 'bk-passo' + (stato ? ' ' + stato : '');
  if(testo) e.querySelector('.tx').textContent = testo;
}

function vBackup(){
  el('view').innerHTML =
    '<div class="card">'+
      '<h3>Portare via tutto</h3>'+
      '<div class="meta">Scarica un solo file zip con dentro tutte le tabelle e '+
      '<b>le foto vere</b>, non i loro indirizzi. Serve a questo: se un giorno Supabase '+
      'chiudesse o bloccasse il progetto, da questo file si riparte. '+
      'Le 103.541 fontanelle di OpenStreetMap non c\'entrano e non sono a rischio: '+
      'stanno gi\u00e0 su GitHub e si rigenerano da sole. Qui c\'\u00e8 quello che hanno '+
      'aggiunto le persone, che invece \u00e8 irripetibile.</div>'+
      '<div class="row" style="margin-top:14px">'+
        '<button class="btn ok" id="bkVia">Scarica il backup</button>'+
      '</div>'+
      '<div id="bkLavoro" hidden>'+
        '<div class="bk-barra"><i id="bkBarra"></i></div>'+
        '<div id="bk1" class="bk-passo"><span class="n">1</span><span class="tx">Leggo le tabelle</span></div>'+
        '<div id="bk2" class="bk-passo"><span class="n">2</span><span class="tx">Scarico le foto</span></div>'+
        '<div id="bk3" class="bk-passo"><span class="n">3</span><span class="tx">Preparo il file</span></div>'+
      '</div>'+
    '</div>';

  el('bkVia').onclick = function(){
    var b = this;
    b.disabled = true; b.textContent = 'Lavoro\u2026';
    el('bkLavoro').hidden = false;
    faiBackup(function(pct){ el('bkBarra').style.width = pct + '%'; })
      .then(function(esito){
        b.disabled = false; b.textContent = 'Scarica di nuovo';
        if(esito.mancate && esito.mancate.length){
          toast('Backup pronto, ma ' + esito.mancate.length + ' foto non si sono scaricate. '+
                'Le trovi elencate nel manifesto.', 7000);
        } else {
          toast('Backup pronto: ' + esito.foto + ' foto, ' + esito.righe + ' righe.');
        }
      })
      .catch(function(e){
        b.disabled = false; b.textContent = 'Riprova';
        bkPasso('bk3','', 'Non ha funzionato: ' + e.message);
        toast(e.message);
      });
  };
}

function faiBackup(avanzamento){
  var dati = {}, righeTot = 0;
  bkPasso('bk1','corso');

  return TABELLE_BACKUP.reduce(function(catena, t, i){
    return catena.then(function(){
      return sel(t + '?select=*')
        .then(function(rows){ dati[t] = rows; righeTot += rows.length; })
        /* Una tabella che non si riesce a leggere non deve far fallire tutto
           il backup: si annota e si va avanti, meglio un backup con un buco
           dichiarato che nessun backup. */
        .catch(function(e){ dati[t] = {errore: e.message}; })
        .then(function(){ avanzamento(Math.round((i + 1) / TABELLE_BACKUP.length * 25)); });
    });
  }, Promise.resolve())

  .then(function(){
    bkPasso('bk1','fatto', 'Tabelle lette: ' + righeTot + ' righe');
    bkPasso('bk2','corso');

    /* Raccolgo ogni percorso di foto citato da qualsiasi tabella, non solo
       da photos: una foto puo' essere agganciata anche a una proposta o a
       una fontanella modificata a mano. */
    var percorsi = {};
    function aggiungi(p){ if(p && typeof p === 'string') percorsi[p] = 1; }
    (dati.photos || []).forEach(function(r){ aggiungi(r.path); });
    (dati.submissions || []).forEach(function(r){ aggiungi(r.photo_path); });
    [].concat(dati.fountains || [], dati.reports || []).forEach(function(r){
      var u = r && r.photo_url;
      if(u && u.indexOf('/photos/') !== -1) aggiungi(u.split('/photos/')[1]);
    });
    var elenco = Object.keys(percorsi);
    return scaricaFoto(elenco, avanzamento).then(function(foto){
      /* mancate viaggia insieme alle foto riuscite: senza questo passaggio
         il manifesto dichiarava "nessuna foto persa" anche quando qualcuna
         non si era scaricata, ed e' bugia proprio dove serve la verita'. */
      return {dati: dati, foto: foto, righe: righeTot, mancate: foto.mancate || []};
    });
  })

  .then(function(pacco){
    bkPasso('bk2','fatto', 'Foto scaricate: ' + pacco.foto.length);
    bkPasso('bk3','corso');
    avanzamento(90);

    var oggi = new Date().toISOString().slice(0,10);
    var radice = 'idratati-backup-' + oggi + '/';
    var testo = new TextEncoder();
    var voci = [];

    Object.keys(pacco.dati).forEach(function(t){
      voci.push({nome: radice + 'tabelle/' + t + '.json',
                 dati: testo.encode(JSON.stringify(pacco.dati[t], null, 2))});
    });
    pacco.foto.forEach(function(f){
      voci.push({nome: radice + 'foto/' + f.nome, dati: f.dati});
    });

    var manifesto = {
      creato: new Date().toISOString(),
      progetto: 'IDRATATI',
      database: CFG.SUPABASE_URL,
      righe_per_tabella: {},
      foto_salvate: pacco.foto.length,
      foto_non_riuscite: pacco.mancate || []
    };
    Object.keys(pacco.dati).forEach(function(t){
      manifesto.righe_per_tabella[t] = Array.isArray(pacco.dati[t])
        ? pacco.dati[t].length : 'ERRORE: ' + pacco.dati[t].errore;
    });
    voci.push({nome: radice + 'manifesto.json',
               dati: testo.encode(JSON.stringify(manifesto, null, 2))});
    voci.push({nome: radice + 'LEGGIMI.txt', dati: testo.encode(LEGGIMI_BACKUP(manifesto))});

    var blob = zipCrea(voci);
    avanzamento(100);
    bkPasso('bk3','fatto', 'Pronto: ' + (blob.size/1048576).toFixed(1) + ' MB');

    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'idratati-backup-' + oggi + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);

    return {foto: pacco.foto.length, righe: pacco.righe, mancate: pacco.mancate};
  });
}

function scaricaFoto(elenco, avanzamento){
  var fatte = [], mancate = [];
  if(!elenco.length) return Promise.resolve(fatte);
  /* Tre alla volta: in fila indiana sarebbe lento, tutte insieme il
     browser le strozza comunque e qualcuna cade. */
  var indice = 0;
  function prossima(){
    if(indice >= elenco.length) return Promise.resolve();
    var p = elenco[indice++];
    return fetch(photoUrl(p))
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buf){ fatte.push({nome: p, dati: new Uint8Array(buf)}); })
      .catch(function(){ mancate.push(p); })
      .then(function(){
        avanzamento(25 + Math.round((fatte.length + mancate.length) / elenco.length * 60));
        bkPasso('bk2','corso', 'Scarico le foto: ' + (fatte.length + mancate.length) + ' di ' + elenco.length);
        return prossima();
      });
  }
  return Promise.all([prossima(), prossima(), prossima()])
    .then(function(){ fatte.mancate = mancate; return fatte; });
}

function LEGGIMI_BACKUP(m){
  return [
    'IDRATATI \u2014 backup del ' + m.creato.slice(0,10),
    '',
    'COSA C\'E\' QUI DENTRO',
    '  tabelle/   ogni tabella del database, in formato JSON leggibile',
    '  foto/      le fotografie vere, ' + m.foto_salvate + ' file',
    '  manifesto.json  quante righe per tabella, e cosa non e\' riuscito',
    '',
    'COSA NON C\'E\', E PERCHE\' NON SERVE',
    '  Le oltre centomila fontanelle di OpenStreetMap non stanno qui: sono',
    '  gia\' su GitHub dentro data/, si rigenerano da sole ogni mese, e',
    '  comunque restano su OpenStreetMap. Qui c\'e\' il lavoro delle persone,',
    '  che invece non si puo\' rifare.',
    '',
    'COME SI RIMETTE DENTRO',
    '  1. Crea un progetto Supabase nuovo.',
    '  2. Lancia in ordine i file della cartella supabase/ del sito',
    '     (schema.sql, poi 02, 03, ... fino all\'ultimo).',
    '  3. Carica le foto della cartella foto/ nel bucket "photos",',
    '     mantenendo gli stessi nomi.',
    '  4. Reinserisci i JSON tabella per tabella, in quest\'ordine:',
    '     citta, fountains, punti, reports, reviews, photos,',
    '     submissions, dettagli, problemi, visite.',
    '     (l\'ordine conta: alcune tabelle rimandano alle altre)',
    '  5. In index.html e admin.html cambia SUPABASE_URL e la chiave',
    '     pubblica con quelli del progetto nuovo.',
    '',
    'La tabella admins non si puo\' rimettere cosi\': fa riferimento agli',
    'utenti di Supabase. Ricrea l\'accesso a mano e reinserisci la riga.',
    '',
    'Un backup che non hai mai provato a ripristinare non e\' un backup.',
    'Vale la pena farlo una volta, su un progetto di prova, prima che serva.'
  ].join('\n');
}

function vStats(){
  Promise.all([
    sel('fountains?select=id,osm_id,kind,status,source&limit=5000'),
    sel('reports?select=id,status,created_at&limit=5000'),
    sel('reviews?select=id&limit=5000'),
    sel('photos?select=id,approved&limit=5000'),
    sel('submissions?select=id,state&limit=5000')
  ]).then(function(r){
    var f=r[0],rep=r[1],rev=r[2],ph=r[3],sub=r[4];
    var week=rep.filter(function(x){ return Date.now()-new Date(x.created_at)<7*864e5; }).length;
    function row(l,v){ return '<div class="stat"><span>'+l+'</span><b>'+v+'</b></div>'; }
    el('view').innerHTML='<div class="card"><h3>Il tuo database</h3>'+
      row('Punti tuoi o modificati', f.length)+
      row('— di cui non su OSM', f.filter(function(x){ return !x.osm_id; }).length)+
      row('— segnati rotti', f.filter(function(x){ return x.status==='broken'; }).length)+
      row('Case dell\'acqua', f.filter(function(x){ return x.kind==='casa'; }).length)+
      '</div><div class="card"><h3>Partecipazione</h3>'+
      row('Segnalazioni di stato', rep.length)+
      row('— ultimi 7 giorni', week)+
      row('Voti con stelle', rev.length)+
      row('Foto pubblicate', ph.filter(function(x){ return x.approved; }).length)+
      row('Foto in attesa', ph.filter(function(x){ return !x.approved; }).length)+
      row('Proposte approvate', sub.filter(function(x){ return x.state==='approved'; }).length)+
      row('Proposte in attesa', sub.filter(function(x){ return x.state==='pending'; }).length)+
      '</div>';
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}
