<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- IDRATATI pannello v7.1 (2026-07-31) -->
<title>IDRATATI — pannello v7.1</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="admin-favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="admin-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="admin-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="admin-192.png">
<meta name="apple-mobile-web-app-title" content="IDRATATI admin">
<meta name="theme-color" content="#F2EFF7">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
:root{
  --ink:#07242F; --surface:#F2F7F6; --card:#fff;
  --acqua:#00A6A6; --acqua-deep:#00807F; --getto:#FFB020; --rotta:#E5484D;
  --muted:rgba(7,36,47,.58); --line:rgba(7,36,47,.12);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);background:#F7F5FA;color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acqua);outline-offset:2px}

/* Il pannello si distingue dall'app anche di colpo d'occhio: viola scuro
   invece del navy, così non si confonde mai una schermata con l'altra. */
/* Chiaro come l'app, ma con l'accento viola: stessa famiglia, altro ruolo. */
header{position:sticky;top:0;z-index:50;color:#241C34;
  background:linear-gradient(120deg,#FAF8FC,#E6E1EF);
  border-bottom:1px solid rgba(36,28,52,.12);
  padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;display:flex;align-items:center;gap:10px}
.marchio{width:34px;height:34px;flex:0 0 auto}
header .badge.ver{background:rgba(36,28,52,.09);color:#4A4266;font-weight:500}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.13em;font-size:13px;color:#241C34}
.badge{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:#241C34;
  color:#FFCB5E;padding:4px 9px;border-radius:6px;font-weight:600}
header .sp{margin-left:auto;display:flex;gap:12px;align-items:center}
/* I due contatori al posto dell'email: aperture oggi e del mese.
   Sono APERTURE, non persone: la tabella visite conta le aperture del
   sito, non chi le fa. Chiamarle "persone" sarebbe un numero falso. */
header .cnt{display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;color:rgba(36,28,52,.62)}
header .cnt b{font-weight:700;color:#241C34;font-variant-numeric:tabular-nums}
header .cnt svg{opacity:.6}
#logout{background:rgba(36,28,52,.08);color:#241C34;border:none;padding:9px 12px;
  border-radius:9px;font-size:12.5px;font-weight:600;min-height:38px}

nav{position:sticky;top:52px;z-index:40;background:var(--surface);display:flex;gap:8px;
  padding:11px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:rgba(7,36,47,.06);color:var(--ink);
  padding:11px 15px;min-height:44px;display:inline-flex;align-items:center;
  border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--surface)}
nav button .n{background:var(--rotta);color:#fff;border-radius:999px;padding:1px 6px;
  font-size:10.5px;margin-left:5px}

main{padding:14px 12px 60px;max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:11px;
  box-shadow:0 2px 10px rgba(7,36,47,.06)}
.card h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 3px}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:none;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:600;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--surface);transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97);filter:brightness(.94)}
.btn.ok{background:var(--acqua);color:#fff}
.btn.bad{background:rgba(229,72,77,.12);color:var(--rotta)}
.btn.ghost{background:rgba(7,36,47,.07);color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:12.5px;border-radius:9px;min-height:38px}
.btn[disabled]{opacity:.5;pointer-events:none}
/* Il limite dichiarato accanto all'etichetta, e quanto ne resta sotto. */
.lim{font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none}
.conta{font-size:11.5px;color:var(--muted);text-align:right;margin:-6px 0 10px}
.conta.finiti{color:#B45309;font-weight:600}
.foto-card{padding:10px 10px 12px}
.foto-grande{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;
  background:#0d1f28;display:block}
/* anteprima dentro l'editor: più contenuta della foto-grande, così il
   modulo resta scorrevole anche su telefono */
.foto-editor{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;
  background:#0d1f28;display:block;margin-top:6px}
#fPhotoStato{margin-top:6px;min-height:18px}
.foto-dove{font-size:14px;line-height:1.35;color:var(--muted);padding:11px 5px 3px}
.foto-dove b{color:var(--ink);font-family:var(--display);font-weight:600;font-size:16.5px}
.btn.grosso{flex:1;padding:16px;font-size:15px;border-radius:13px;min-height:52px}
.foto-card .row{gap:9px;margin-top:9px}
.minimappa{width:100%;height:190px;border:none;border-radius:12px;margin-top:11px;
  background:rgba(7,36,47,.05);display:block}
.dett{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dett summary{padding:11px 13px;font-size:13px;font-weight:600;cursor:pointer;
  background:rgba(7,36,47,.035);list-style:none}
.dett summary::-webkit-details-marker{display:none}
.dett summary::after{content:'▾';float:right;opacity:.5}
.dett[open] summary::after{content:'▴'}
.dett .corpo{padding:4px 13px 12px}
.riga{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.riga:last-child{border-bottom:none}
.riga .q{color:var(--muted);flex:0 0 auto}
.riga .v{text-align:right;font-weight:500}
.vuoto{font-size:13px;color:var(--muted);padding:10px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;
  background:rgba(7,36,47,.07);color:var(--muted);margin-right:5px}
.pills .pill{margin-right:0}
.pill b{font-weight:700;color:var(--ink)}
.pill.ok{background:rgba(0,166,166,.14);color:var(--acqua-deep)}
.pill.bad{background:rgba(229,72,77,.13);color:var(--rotta)}
.pill.warn{background:rgba(255,176,32,.2);color:#8A5B00}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:11px 0 5px}
.novita .nv-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  opacity:.7;font-weight:600;margin-bottom:7px}
.novita .nv-righe{font-size:16px;line-height:1.5}
.novita .nv-righe b{font-size:23px;font-weight:700;letter-spacing:-.02em}
.novita .nv-righe .pt{opacity:.4;margin:0 9px}
.novita .nv-p{font-size:13.5px;opacity:.75}
.novita .nv-prima{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);
  font-size:13.5px;line-height:1.45}
.novita.calma .nv-prima{border-top-color:var(--line)}

.due-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.due-mini .mini{background:rgba(7,36,47,.05);border-radius:12px;padding:10px 11px}
.due-mini .mini b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.due-mini .mini span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.due-mini .mini.bella{background:rgba(0,166,166,.12)}
.due-mini .mini.bella b{color:var(--acqua-deep)}
.primato{margin-top:12px;background:#FFF4E5;color:#B26A00;border-radius:10px;
  padding:9px 11px;font-size:13px;font-weight:600}
.meta-obiettivo{margin-top:9px;background:rgba(0,166,166,.10);border-radius:10px;
  padding:9px 11px;font-size:12.5px;color:var(--acqua-deep)}

.disp-riga{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  margin-bottom:6px;cursor:pointer;font-family:inherit}
.disp-riga .dr-id{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);flex:0 0 auto}
.disp-riga .dr-n{font-size:13px;font-weight:600;flex:1}
.disp-riga .dr-tag{font-size:11px;color:var(--muted);flex:0 0 auto}
.disp-riga.mio{background:rgba(7,36,47,.05);border-color:transparent}
.disp-riga.mio .dr-tag{color:var(--ink);font-weight:600}

/* ===== HOME: controlli, visite, contributi, citta' ===== */
.salute-card{padding:14px}
.salute-t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;margin-bottom:12px}
.salute-t .pallone{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.salute-t.ok .pallone{background:#12A594}
.salute-t.warn .pallone{background:#F5A524}
.salute-t.bad .pallone{background:var(--rotta);animation:pulsa 1.4s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.35}}
.salute-griglia{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){ .salute-griglia{gap:5px} }
.salute-box{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  background:#fff;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px;
  border-left-width:4px;transition:transform .12s ease}
.salute-box:active{transform:scale(.98)}
.salute-box.ok{border-left-color:#12A594}
.salute-box.warn{border-left-color:#F5A524;background:#FFFBF2}
.salute-box.bad{border-left-color:var(--rotta);background:#FFF5F5}
.salute-box .sb-t{font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.2}
.salute-box .sb-d{font-size:10.5px;color:var(--muted);line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:520px){
  .salute-box{padding:8px 7px;border-left-width:3px}
  .salute-box .sb-t{font-size:11.5px}
  .salute-box .sb-d{font-size:9.5px}
}
.salute-box.bad .sb-d{color:var(--rotta);font-weight:600}
.salute-dett{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.salute-dett b{font-size:13.5px}
.salute-dett pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;
  font-size:12px;line-height:1.5;color:var(--muted);font-family:inherit}

.tre{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qn{background:rgba(7,36,47,.05);border-radius:12px;padding:11px 10px;min-width:0}
.qn b{display:block;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.qn span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.qn.forte{background:var(--ink)}
.qn.forte b{color:var(--surface)}
.qn.forte span{color:rgba(255,255,255,.72)}
.qn.spicca{background:#FFF4E5}
.qn.spicca b{color:#B26A00}

.barre{display:flex;align-items:flex-end;gap:2px;height:76px;margin-top:14px}
.barre i{flex:1;height:2px;background:rgba(0,166,166,.35);border-radius:2px 2px 0 0;
  transition:height .5s cubic-bezier(.2,.9,.3,1);transition-delay:var(--r)}
.barre i.su{height:var(--h)}
.barre i.sett{background:rgba(0,166,166,.62)}
.barre i.oggi{background:var(--ink)}
.sep{height:1px;background:var(--line);margin:16px 0}

.rec-riga{padding:10px 0;border-bottom:1px solid var(--line)}
.rec-riga:last-child{border-bottom:none}
.rec-dove{font-weight:600;font-size:14px;margin-bottom:3px}
.rec-txt{font-size:13.5px;color:var(--ink);opacity:.85;margin-bottom:4px;line-height:1.45}

.citta-riga{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.citta-riga:last-child{border-bottom:none}
.citta-riga .cr-nome{font-weight:600;font-size:14px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citta-riga .cr-num{font-size:12px;color:var(--muted);flex:0 0 auto}
.citta-riga .cr-quando{font-size:11.5px;color:var(--muted);flex:0 0 auto;
  min-width:64px;text-align:right}
@media (max-width:400px){
  .tre{grid-template-columns:1fr 1fr}
  .tre .qn:last-child{grid-column:1/-1}
  .citta-riga .cr-num{display:none}
}
.griglia{display:grid;gap:3px;margin-top:4px}
.griglia img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgba(7,36,47,.06);cursor:pointer}
.griglia .cella{position:relative}
.griglia .cella.attesa::after{content:'';position:absolute;inset:0;border:3px solid var(--rotta);pointer-events:none}
.griglia .cella .fi{position:absolute;left:0;right:0;bottom:0;background:rgba(7,36,47,.72);
  color:#fff;font-size:9px;padding:2px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visore{position:fixed;inset:0;z-index:200;background:rgba(7,36,47,.97);display:flex;flex-direction:column}
.visore .scatto{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.visore .scatto img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.visore .sotto{background:var(--surface);padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);
  border-radius:16px 16px 0 0;max-height:52vh;overflow:auto}
.visore .sotto .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.visore .frecce{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0}
.visore .frecce button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:999px;
  width:40px;height:40px;font-size:19px;cursor:pointer}
.visore .conta{color:rgba(255,255,255,.8);font-size:12px;align-self:center}
.firma-riga{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.firma-riga:last-child{border-bottom:none}
.firma-riga img{width:62px;height:62px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:rgba(7,36,47,.06)}
.firma-corpo{flex:1;min-width:0}
.part{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.part .q{flex:1 1 30%;min-width:96px;background:rgba(7,36,47,.05);border-radius:12px;padding:11px 12px}
.part .q .n{font-size:23px;font-weight:700;line-height:1.1}
.part .q .e{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.part .q.spicca{background:var(--ink)}
.part .q.spicca .n{color:var(--surface)}
.part .q.spicca .e{color:rgba(255,255,255,.75)}
.barra-riga{margin:9px 0}
.barra-testa{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.barra-testa b{font-weight:600}
.barra-testa span{color:var(--muted);font-size:12px}
.barra{height:9px;border-radius:999px;background:rgba(7,36,47,.08);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ink);border-radius:999px}
.gruppo-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:16px 0 2px;font-weight:600}
.firma-testo{font-size:18px;font-weight:600;word-break:break-word;margin-bottom:3px}
.firma-corpo .meta{font-size:11.5px;color:var(--muted);margin-bottom:6px;word-break:break-word}
.firma-corpo input{padding:7px 9px;font-size:14px}
.firma-azioni{display:flex;gap:6px;margin-top:6px}
.firma-azioni .btn{padding:6px 10px;font-size:12.5px}
.chip{display:inline-block;background:rgba(7,36,47,.07);border:none;border-radius:999px;
  padding:2px 8px;font-size:11px;color:var(--ink);cursor:pointer;margin-left:4px}
.firma-testa{position:sticky;top:96px;z-index:30;background:var(--surface);
  padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.firma-testa .row{gap:6px;flex-wrap:wrap}
.firma-testa .btn.sel{background:var(--ink);color:var(--surface)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  font-family:var(--body);font-size:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:13.5px}
.check input{width:auto}
img.thumb{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:10px;display:block}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:32px 12px}
#map{height:56vh;min-height:330px;border-radius:16px;margin-bottom:11px}
.dettaglio{opacity:.62;font-size:11.5px}
.meta b{color:var(--acqua-deep);font-weight:700}
.oggi-griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-top:14px}
.oggi-n{background:rgba(7,36,47,.04);border-radius:14px;padding:14px 15px;cursor:pointer;
  transition:background .16s,transform .16s}
.oggi-n:hover{background:rgba(0,166,166,.1)}
.oggi-n:active{transform:scale(.98)}
.oggi-n.zero{opacity:.5;cursor:default}
.oggi-n.zero:hover{background:rgba(7,36,47,.04)}
.oggi-n b{display:block;font-family:var(--display);font-size:30px;font-weight:800;
  line-height:1;color:var(--acqua-deep)}
.oggi-n.zero b{color:var(--muted)}
.oggi-n span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.3}
.oggi-n .su{color:var(--acqua-deep);font-weight:600;margin-top:3px}
.oggi-n .giu{color:var(--rotta);font-weight:600;margin-top:3px}
.oggi-n .pari{color:var(--muted);margin-top:3px}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:none}
.stat b{font-family:var(--display);font-size:17px}

/* login */
#login{max-width:340px;margin:14vh auto;padding:0 18px}
#login .card{padding:20px}
.marchio-login{width:78px;height:78px;display:block;margin:0 auto 14px}
#login .card{text-align:center}
#login label{text-align:left}
#login h1{font-family:var(--display);font-weight:800;letter-spacing:.13em;font-size:19px;margin:0 0 4px}
#err{color:var(--rotta);font-size:13px;margin-top:10px;display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);z-index:900;
  background:var(--ink);color:var(--surface);font-size:13px;padding:11px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--acqua);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.casa{background:var(--getto);border-radius:8px;transform:rotate(0)}
.pin.broken{background:var(--rotta)}
.pin.custom{border-color:#07242F}

/* ============================================================
   HOME -- vedi il blocco .home-* piu' sotto per lo stile vero
   (griglia chiara in celeste e ambra, non piu' scuro).
   ============================================================ */
/* La Home riusa la stessa palette del resto del pannello -- celeste e
   ambra, mai lo scuro del primo giro. Una griglia vera, non una colonna
   che scende all'infinito: su desktop riempie lo schermo in orizzontale
   e in verticale, come su un cruscotto. */
.home-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;
  grid-template-areas:"hero coda" "feed citta" "part part" "salute salute"}
.home-hero{grid-area:hero}.home-coda{grid-area:coda}.home-feed{grid-area:feed}
.home-citta{grid-area:citta}.home-part{grid-area:part}.home-salute{grid-area:salute}

   l'ultima scritta. Messa prima, lo sfondo bianco della card cancellava
   il gradiente e restava testo bianco su bianco, cioe' un riquadro vuoto. */

  text-transform:uppercase;color:var(--acqua-deep);margin:0 0 12px}

.hero-num{display:flex;align-items:baseline;gap:9px}

<script>
(function(){

/* ===== CONFIG: identici a quelli di index.html ===== */
var CFG = {

};

var TOKEN=null, USER=null, tab='home', map=null, layer=null, editing=null;

function el(id){ return document.getElementById(id); }
function toast(m,ms){ var t=el('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');}, ms||3000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ago(iso){
  if(!iso) return '';
  var d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d<1) return 'oggi'; if(d===1) return 'ieri';
  if(d<30) return d+' giorni fa'; if(d<365) return Math.round(d/30)+' mesi fa';
  return 'oltre un anno fa';
}
function photoUrl(path){

/* ============================================================
   CONTESTO
   Un target è una stringa come 'osm/node/4953163133'. Da sola non
   dice niente. Qui la si trasforma in: nome, tipo, coordinate,
   indirizzo vero, stato attuale e foto già pubblicate.
   ============================================================ */
var CTX = {};          // target -> dati
var INDIRIZZI = {};    // "lat,lon" -> via
var codaVie = [], viaInCorso = false;

function ctxVuoto(t){
  return {target:t, nome:null, tipo:null, lat:null, lon:null,
          via:null, stato:null, voti:null, foto:[]};
}

/* Nominatim vuole al massimo una richiesta al secondo: le metto in coda. */
function chiediVia(lat, lon, quando, comune){
  var k = lat.toFixed(5)+','+lon.toFixed(5);
  if(INDIRIZZI[k] && !comune){ quando(INDIRIZZI[k]); return; }
  codaVie.push({k:k, lat:lat, lon:lon, cb:quando, comune:comune});
  smaltisciCoda();
}
function smaltisciCoda(){
  if(viaInCorso || !codaVie.length) return;
  viaInCorso = true;
  var job = codaVie.shift();
  fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+
        job.lat+'&lon='+job.lon)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var a = d.address || {};
      var via = [a.road || a.pedestrian || a.footway || a.square || a.park,
                 a.house_number].filter(Boolean).join(' ');
      var zona = a.suburb || a.city_district || a.neighbourhood;
      var citta = a.city || a.town || a.village || a.municipality;
      var testo = [via, zona, citta].filter(Boolean).join(', ') || d.display_name || null;
      INDIRIZZI[job.k] = testo;
      if(job.comune) job.comune(citta || null);
      job.cb(testo);
    })
    .catch(function(){ job.cb(null); })
    .then(function(){
      viaInCorso = false;
      setTimeout(smaltisciCoda, 1100);
    });
}

/* Raccoglie tutto il sapibile su una lista di target. */
function caricaContesti(targets){
  var unici = targets.filter(function(t,i){ return t && targets.indexOf(t)===i; });
  var daFare = unici.filter(function(t){ return !CTX[t]; });
  if(!daFare.length) return Promise.resolve(CTX);

  daFare.forEach(function(t){ CTX[t] = ctxVuoto(t); });

  var idsOsm = daFare.filter(function(t){ return t.indexOf('osm/')===0; })
                     .map(function(t){ return t.slice(4); });
  var idsDb  = daFare.filter(function(t){ return t.indexOf('db/')===0; })
                     .map(function(t){ return t.slice(3); });

  var lavori = [];

  // 1. i punti nostri, o le modifiche fatte da noi su punti OSM
  var filtro = [];
  if(idsDb.length)  filtro.push('id.in.('+idsDb.join(',')+')');
  if(idsOsm.length) filtro.push('osm_id.in.('+idsOsm.map(encodeURIComponent).join(',')+')');
  if(filtro.length){
    lavori.push(sel('fountains?select=*&or=('+filtro.join(',')+')')
      .catch(function(){ return []; })
      .then(function(rows){
      rows.forEach(function(r){
        var t = r.osm_id ? 'osm/'+r.osm_id : 'db/'+r.id;
        if(!CTX[t]) return;
        CTX[t].nome  = r.name || CTX[t].nome;
        CTX[t].tipo  = r.kind;
        CTX[t].lat   = r.lat; CTX[t].lon = r.lon;
        CTX[t].stato = r.status;
        CTX[t].note  = r.notes;
      });
    }));
  }

  // 2a. l'API ufficiale di OpenStreetMap: è fatta apposta per cercare per id,
  //     risponde sempre e non ha code, al contrario di Overpass.
  var soloNodi = idsOsm.filter(function(x){ return x.indexOf('node/')===0; })
                       .map(function(x){ return x.split('/')[1]; });
  if(soloNodi.length){
    lavori.push(
      fetch('https://api.openstreetmap.org/api/0.6/nodes.json?nodes='+soloNodi.join(','))
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){
          (d.elements||[]).forEach(function(e){
            var t = 'osm/node/'+e.id, c = CTX[t];
            if(!c) return;
            var tg = e.tags || {};
            c.lat = e.lat; c.lon = e.lon;
            c.tags = tg;
            c.nome = c.nome || tg.name || null;
            c.tipo = c.tipo ||
              ((tg.amenity==='vending_machine'||tg.amenity==='water_point') ? 'casa' : 'fontanella');
          });
        })
        .catch(function(){ /* riproverà Overpass qui sotto */ })
    );
  }

  // 2b. Overpass serve solo per way e relation: per i nodi ha già risposto
  //     l'API ufficiale, molto più svelta. Prima lo chiamavamo sempre, ed
  //     era lui a far aspettare mezzo minuto per due foto.
  var soloAltro = idsOsm.filter(function(x){ return x.indexOf('node/') !== 0; });
  if(soloAltro.length){
    var perTipo = {node:[], way:[], relation:[]};
    soloAltro.forEach(function(x){
      var pezzi = x.split('/');
      if(perTipo[pezzi[0]]) perTipo[pezzi[0]].push(pezzi[1]);
    });
    var q = '[out:json][timeout:25];(' +
      (perTipo.node.length     ? 'node(id:'+perTipo.node.join(',')+');'         : '') +
      (perTipo.way.length      ? 'way(id:'+perTipo.way.join(',')+');'           : '') +
      (perTipo.relation.length ? 'relation(id:'+perTipo.relation.join(',')+');' : '') +
      ');out center tags;';
    lavori.push(
      fetch('https://overpass-api.de/api/interpreter',{method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'data='+encodeURIComponent(q)})
        .then(function(r){ return r.json(); })
        .then(function(d){
          (d.elements||[]).forEach(function(e){
            var t = 'osm/'+e.type+'/'+e.id;
            if(!CTX[t]) return;
            var tg = e.tags||{};
            CTX[t].nome = CTX[t].nome || tg.name || null;
            CTX[t].tags = tg;
            CTX[t].tipo = CTX[t].tipo ||
              ((tg.amenity==='vending_machine'||tg.amenity==='water_point') ? 'casa' : 'fontanella');
            if(CTX[t].lat==null){
              CTX[t].lat = e.lat!=null ? e.lat : (e.center&&e.center.lat);
              CTX[t].lon = e.lon!=null ? e.lon : (e.center&&e.center.lon);
            }
          });
        }).catch(function(){})
    );
  }

  // 3. come sta messa adesso, secondo chi è passato di lì
  lavori.push(sel('v_status?select=*&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].voti = r; });
    }).catch(function(){}));

  // 3b. i voti con le stelle
  lavori.push(sel('v_reviews?select=*&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].stelle = r; });
    }).catch(function(){}));

  // 3c. le singole segnalazioni e i singoli voti, per poterli leggere qui
  var listaTarget = unici.map(function(t){ return '"'+t+'"'; }).join(',');
  lavori.push(sel('reports?select=*&order=created_at.desc&limit=200&target=in.('+listaTarget+')')
    .then(function(rows){
      rows.forEach(function(r){
        if(!CTX[r.target]) return;
        (CTX[r.target].segnalazioni = CTX[r.target].segnalazioni || []).push(r);
      });
    }).catch(function(){}));
  lavori.push(sel('reviews?select=*&order=created_at.desc&limit=200&target=in.('+listaTarget+')')
    .then(function(rows){
      rows.forEach(function(r){
        if(!CTX[r.target]) return;
        (CTX[r.target].voti_singoli = CTX[r.target].voti_singoli || []).push(r);
      });
    }).catch(function(){}));

  // 4. le foto già pubblicate, per confronto
  lavori.push(sel('photos?select=target,url&approved=eq.true&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')&limit=60')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].foto.push(r.url); });
    }).catch(function(){}));

  return Promise.all(lavori).then(function(){ return CTX; });
}

/* Quanto ha già mandato ogni dispositivo: serve a fiutare gli spammer.
   Prima erano tre richieste per ogni foto in coda — con dieci foto,
   trenta viaggi al server. Adesso sono tre in tutto. */
var PESI = {};

/* Il codice del dispositivo che sto usando adesso: se coincide con quello
   di una segnalazione, vuol dire che l'ho mandata io facendo le prove. */
var MIO_DISPOSITIVO = (function(){
  try{ return localStorage.getItem('idr_client'); }catch(e){ return null; }
})();

/* Da "cms3a4qvlp · 13 foto, 12 voti, 3 proposte" a una frase leggibile. */
function oraEsatta(iso){
  try{
    var d = new Date(iso), oggi = new Date();
    var ora = d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
    if(d.toDateString() === oggi.toDateString()) return 'oggi alle ' + ora;
    var ieri = new Date(Date.now() - 864e5);
    if(d.toDateString() === ieri.toDateString()) return 'ieri alle ' + ora;
    return d.toLocaleDateString('it-IT', {day:'numeric', month:'long'}) + ' alle ' + ora;
  }catch(e){ return ago(iso); }
}

/* Dove si trovava chi ha mandato il contributo. È l'informazione che dice
   se fidarsi: chi era davanti alla fontanella sa quello che dice, chi
   l'ha segnalata da trenta chilometri probabilmente no. */
function doveEra(metri){
  if(metri == null) return '<span class="pill">posizione non disponibile</span>';
  if(metri <= 60)   return '<span class="pill ok">era sul posto ('+metri+' m)</span>';
  if(metri <= 500)  return '<span class="pill">a '+metri+' m dalla fontanella</span>';
  if(metri < 5000)  return '<span class="pill warn">a '+
                           (metri/1000).toFixed(1).replace('.',',')+' km di distanza</span>';
  return '<span class="pill bad">mandata da '+Math.round(metri/1000)+' km di distanza</span>';
}

/* Le informazioni concrete: quando esattamente, con che apparecchio, e da
   che distanza. */
function contorno(r){
  if(!r) return '';
  var pezzi = ['<span class="pill">' + esc(oraEsatta(r.created_at)) + '</span>'];
  if(r.device) pezzi.push('<span class="pill">da ' + esc(r.device) + '</span>');
  pezzi.push(doveEra(r.distanza));
  return '<div class="pills" style="margin-top:7px">' + pezzi.join('') + '</div>';
}

function chiHaMandato(clientId, quando, riga){
  if(!clientId) return 'Arrivata ' + quando + ' · non si sa da quale dispositivo' + contorno(riga);
  if(clientId === MIO_DISPOSITIVO)
    return 'Arrivata ' + quando + ' · <b>l\'hai mandata tu</b> da questo stesso telefono' +
           contorno(riga);

  var p = PESI[clientId];
  var sigla = 'dispositivo ' + clientId.slice(0, 8);
  if(!p) return 'Arrivata ' + quando + ' · ' + sigla + contorno(riga);

  var tot = p.foto + p.voti + p.proposte;
  var giudizio;
  if(tot <= 1)      giudizio = 'è la sua prima volta';
  else if(tot < 6)  giudizio = 'ha contribuito ' + tot + ' volte in tutto';
  else              giudizio = 'contribuisce spesso: ' + tot + ' volte in tutto';

  return 'Arrivata ' + quando + ' · ' + sigla + ', ' + giudizio +
         ' <span class="dettaglio">(' + p.foto + ' foto, ' + p.voti +
         ' voti, ' + p.proposte + ' fontanelle proposte)</span>' + contorno(riga);
}

function pesaDispositivi(lista){
  var unici = lista.filter(function(c,i){ return c && lista.indexOf(c)===i && !PESI[c]; });
  if(!unici.length) return Promise.resolve(PESI);
  var elenco = unici.map(function(c){ return '"'+c+'"'; }).join(',');

  function conta(tabella, campo){
    return sel(tabella+'?select=client_id&client_id=in.('+elenco+')&limit=2000')
      .then(function(rows){
        rows.forEach(function(r){
          var p = PESI[r.client_id] || (PESI[r.client_id] = {foto:0, voti:0, proposte:0});
          p[campo]++;
        });
      }).catch(function(){});
  }
  unici.forEach(function(c){ PESI[c] = {foto:0, voti:0, proposte:0}; });
  return Promise.all([
    conta('photos','foto'), conta('reviews','voti'), conta('submissions','proposte')
  ]).then(function(){ return PESI; });
}

/* L'intestazione comune a foto, voti e proposte. */
function intestazione(c, idBlocco){
  if(!c) return '';
  var t = c.tags || {};
  var titolo = c.nome || (c.tipo==='casa' ? "Casa dell'acqua" : 'Fontanella pubblica');
  var h = '<h3>'+esc(titolo)+'</h3>';

  // indirizzo, e sotto sempre le coordinate: se il geocoder tace, le coordinate restano
  h += '<div class="meta" id="via-'+idBlocco+'">'+
       (c.via ? esc(c.via) : 'cerco l\'indirizzo…')+'</div>';
  if(c.lat != null)
    h += '<div class="meta" style="opacity:.7">'+c.lat.toFixed(6)+', '+c.lon.toFixed(6)+'</div>';

  var pills = [];
  pills.push('<span class="pill">'+(c.tipo==='casa' ? "casa dell'acqua" : 'fontanella')+'</span>');

  if(c.stato && c.stato!=='unknown'){
    var cl={ok:'ok',works:'warn',broken:'bad',removed:'bad'}[c.stato]||'';
    var tx={ok:'funzionante',works:'lavori in corso',broken:'rotta',removed:'rimossa'}[c.stato];
    pills.push('<span class="pill '+cl+'">'+tx+' (deciso da te)</span>');
  }
  if(c.voti){
    if(c.voti.ok_votes)
      pills.push('<span class="pill ok"><b>'+c.voti.ok_votes+'</b> dicono che funziona</span>');
    if(c.voti.works_votes)
      pills.push('<span class="pill warn"><b>'+c.voti.works_votes+'</b> segnalano lavori</span>');
    if(c.voti.broken_votes)
      pills.push('<span class="pill bad"><b>'+c.voti.broken_votes+'</b> dicono che è rotta</span>');
    if(c.voti.missing_votes)
      pills.push('<span class="pill bad"><b>'+c.voti.missing_votes+'</b> non l\'hanno trovata</span>');
    if(c.voti.last_report)
      pills.push('<span class="pill">ultima segnalazione '+esc(ago(c.voti.last_report))+'</span>');
  }
  if(!c.voti && !c.stato) pills.push('<span class="pill">nessuno l\'ha ancora segnalata</span>');

  // quello che dice OpenStreetMap
  if(t.drinking_water==='no')                            pills.push('<span class="pill bad">non potabile</span>');
  else if(t.drinking_water==='yes'||t.amenity==='drinking_water') pills.push('<span class="pill ok">potabile</span>');
  if(t.fee==='yes')  pills.push('<span class="pill warn">a pagamento</span>');
  if(t.fee==='no')   pills.push('<span class="pill ok">gratis</span>');
  if(t.seasonal==='yes') pills.push('<span class="pill warn">stagionale</span>');
  if(t.opening_hours) pills.push('<span class="pill">'+esc(t.opening_hours)+'</span>');
  if(t.operator)      pills.push('<span class="pill">gestita da '+esc(t.operator)+'</span>');
  h += '<div class="pills">'+pills.join('')+'</div>';

  // le stelle già raccolte
  if(c.stelle && c.stelle.n){
    var st = c.stelle, voci = [];
    if(st.findability!=null) voci.push('raggiungibile '+st.findability+'★');
    if(st.cleanliness!=null) voci.push('stato '+st.cleanliness+'★');
    if(st.taste!=null)       voci.push('comodità '+st.taste+'★');
    if(st.temperature!=null){
      var nomi = st.temperature<2.34 ? 'calda' : (st.temperature<3.67 ? 'ambiente' : 'fresca');
      voci.push('acqua '+nomi);
    }
    h += '<div class="meta" style="color:var(--ink)">Giudizi già raccolti ('+st.n+'): '+
         esc(voci.join(' · '))+'</div>';
  }

  if(c.note) h += '<div class="meta" style="color:var(--ink);margin-top:6px">Nota tua: '+esc(c.note)+'</div>';

  // la mappa qui dentro, così non devi aprire niente altrove
  if(c.lat != null){
    var d = 0.0016;
    var bbox = (c.lon-d)+','+(c.lat-d)+','+(c.lon+d)+','+(c.lat+d);
    h += '<iframe class="minimappa" loading="lazy" title="Dov\'è" '+
         'src="https://www.openstreetmap.org/export/embed.html?bbox='+bbox+
         '&layer=mapnik&marker='+c.lat+','+c.lon+'"></iframe>';
  }

  h += '<div class="row" style="margin-top:10px">';
  if(c.lat != null){
    h += '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+c.lat+','+c.lon+'">Guarda in Street View</a>';
  }
  if(c.target.indexOf('osm/')===0)
    h += '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/'+esc(c.target.slice(4))+'">Scheda OSM</a>';
  h += '<button class="btn ghost sm" data-goto="'+esc(c.target)+'"'+
       (c.lat != null ? ' data-lat="'+c.lat+'" data-lon="'+c.lon+'"' : '')+
       ' data-nome="'+esc((t && t.name) || c.nome || '')+'"'+
       ' data-kind="'+esc(c.tipo || 'fontanella')+'">Modifica il punto</button></div>';

  // ---- tutto quello che il database sa, in chiaro ----
  var seg = c.segnalazioni || [], vot = c.voti_singoli || [];

  h += '<details class="dett"><summary>Le '+seg.length+' segnalazioni di stato ricevute</summary><div class="corpo">';
  if(!seg.length) h += '<div class="vuoto">Nessuno ha ancora detto se funziona o no.</div>';
  seg.forEach(function(r){
    var tx={ok:'Funziona',works:'Lavori in corso',broken:'È rotta',
            missing:'Non l\'ha trovata'}[r.status]||r.status;
    var cl={ok:'ok',works:'warn',broken:'bad',missing:'bad'}[r.status]||'';
    h += '<div class="riga"><span class="q">'+esc(ago(r.created_at))+'</span>'+
         '<span class="v"><span class="pill '+cl+'">'+tx+'</span></span></div>';
  });
  h += '</div></details>';

  h += '<details class="dett"><summary>I '+vot.length+' voti con le stelle</summary><div class="corpo">';
  if(!vot.length) h += '<div class="vuoto">Nessuno ha ancora votato questa fontanella.</div>';
  vot.forEach(function(r){
    var v=[];
    if(r.findability!=null) v.push('raggiungibile '+r.findability+'/5');
    if(r.cleanliness!=null) v.push('stato '+r.cleanliness+'/5');
    if(r.taste!=null)       v.push('comodità '+r.taste+'/5');
    if(r.temperature!=null) v.push('acqua '+({1:'calda',3:'ambiente',5:'fresca'}[r.temperature]||r.temperature));
    h += '<div class="riga"><span class="q">'+esc(ago(r.created_at))+
         (r.approved?'':' <span class="pill bad">nascosto</span>')+'</span>'+
         '<span class="v">'+esc(v.join(' · ') || 'senza stelle')+
         (r.comment?'<br><span style="font-weight:400;color:var(--muted)">« '+esc(r.comment)+' »</span>':'')+
         '</span></div>';
  });
  h += '</div></details>';

  // ---- la carta d'identità del punto ----
  var righe = [];
  righe.push(['Tipo', c.tipo==='casa' ? "Casa dell'acqua (distributore)" : 'Fontanella pubblica']);
  righe.push(['Dove', c.via || (c.lat!=null ? c.lat.toFixed(6)+', '+c.lon.toFixed(6) : 'sconosciuto')]);
  if(c.lat!=null) righe.push(['Coordinate', c.lat.toFixed(6)+', '+c.lon.toFixed(6)]);
  righe.push(['Da dove viene', c.target.indexOf('osm/')===0
    ? 'OpenStreetMap (mappa collaborativa mondiale)'
    : 'Aggiunta da te o da una proposta approvata']);
  if(t.operator)  righe.push(['Chi la gestisce', t.operator]);
  if(t.drinking_water) righe.push(['Potabile secondo OSM', t.drinking_water==='yes' ? 'sì' : 'no']);
  if(t.fee)       righe.push(['Si paga', t.fee==='yes' ? 'sì' : 'no']);
  if(t.check_date) righe.push(['check_date da OSM (non mostrato agli utenti)', t.check_date]);
  if(t.description) righe.push(['Descrizione su OSM', t.description]);
  righe.push(['Codice interno', c.target]);

  h += '<details class="dett"><summary>Carta d\'identità della fontanella</summary><div class="corpo">'+
       righe.map(function(r){
         return '<div class="riga"><span class="q">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';
       }).join('')+'</div></details>';

  if(c.foto && c.foto.length){
    h += '<div class="meta" style="margin-top:11px">Foto già pubblicate qui ('+c.foto.length+'):</div>'+
         '<div style="display:flex;gap:6px;overflow-x:auto;margin-top:6px">'+
         c.foto.slice(0,6).map(function(u){
           return '<img src="'+esc(u)+'" style="height:64px;border-radius:8px;flex:0 0 auto" loading="lazy" alt="">';
         }).join('')+'</div>';
  }
  return h;
}

/* Riempie gli indirizzi man mano che Nominatim risponde. */
function completaIndirizzi(coppie){
  coppie.forEach(function(x){

    if(c.via){ var e1 = el('via-'+x.id); if(e1) e1.textContent = c.via; return; }

      if(e2) e2.textContent = via || (c.lat.toFixed(5)+', '+c.lon.toFixed(5));
    });
  });
}

/* localStorage invece di sessionStorage: la sessione resta anche dopo
   aver chiuso il browser. Nessuna scorciatoia sulla sicurezza, solo
   il fastidio di ridigitare la password tolto di mezzo. */
function store(k,v){
  try{ if(v===undefined) return localStorage.getItem(k);
       if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }
  catch(e){ return null; }
}

/* ---------- API ---------- */
function H(extra){
  var h={'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',
         'Authorization':'Bearer '+(TOKEN||CFG.SUPABASE_ANON_KEY)};
  return Object.assign(h, extra||{});
}
/* Il token di Supabase dura un'ora. Invece di rispedirti al login,
   se ne prende uno nuovo con il token di rinnovo e riprova da solo. */
var rinnovoInCorso = null;

function rinnova(){
  var rt = store('idr_rt');
  if(!rt) return Promise.reject(new Error('nessun rinnovo disponibile'));
  if(rinnovoInCorso) return rinnovoInCorso;
  rinnovoInCorso = fetch(CFG.SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:rt})
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.access_token) throw new Error('rinnovo rifiutato');
      TOKEN = d.access_token;
      store('idr_tk', TOKEN);
      if(d.refresh_token) store('idr_rt', d.refresh_token);
      return TOKEN;
    })
    .then(function(t){ rinnovoInCorso = null; return t; },
          function(e){ rinnovoInCorso = null; throw e; });
  return rinnovoInCorso;
}

function api(path, opt, giaRiprovato){
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path, opt||{headers:H()})
    .then(function(r){
      if(r.status===401 && !giaRiprovato){
        return rinnova().then(function(){
          // rifaccio la richiesta con il token nuovo
          var o = opt ? JSON.parse(JSON.stringify({m:opt.method, b:opt.body, p:opt.headers&&opt.headers.Prefer})) : {};
          var rifatto = opt ? {method:o.m, headers:H(o.p?{'Prefer':o.p}:null), body:o.b} : {headers:H()};
          return api(path, rifatto, true);
        }).catch(function(){ logout(); throw new Error('Sessione scaduta, rifai l\'accesso.'); });
      }
      if(r.status===401){ logout(); throw new Error('Sessione scaduta, rifai l\'accesso.'); }
      if(!r.ok) return r.text().then(function(t){ throw new Error(t||r.status); });
      return r.status===204 ? null : r.json();
    });
}
function sel(p){ return api(p,{headers:H()}); }
function patch(table,filter,body){
  return api(table+'?'+filter,{method:'PATCH',headers:H({'Prefer':'return=representation'}),
    body:JSON.stringify(body)});
}
function del(table,filter){
  return api(table+'?'+filter,{method:'DELETE',headers:H()});
}
function ins(table,body,extra){
  return api(table,{method:'POST',headers:H({'Prefer':extra||'return=representation'}),
    body:JSON.stringify(body)});
}
function rpc(fn,args){
  return api('rpc/'+fn,{method:'POST',headers:H(),body:JSON.stringify(args||{})});
}

/* ---------- LOGIN ---------- */
function login(){
  var e=el('em').value.trim(), p=el('pw').value;
  if(!CFG.SUPABASE_URL){ showErr('Manca la configurazione Supabase in admin.html.'); return; }
  if(!e||!p){ showErr('Inserisci email e password.'); return; }
  el('go').disabled=true; el('go').textContent='Verifico…';
  fetch(CFG.SUPABASE_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:e,password:p})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.access_token) throw new Error(d.error_description||d.msg||'Credenziali non valide');
      TOKEN=d.access_token; USER=d.user;
      if(d.refresh_token) store('idr_rt', d.refresh_token);
      return rpc('is_admin');
    })
    .then(function(ok){
      if(ok!==true) throw new Error('Questo account non è amministratore.');
      store('idr_tk',TOKEN); store('idr_em',USER?USER.email:'');
      start();
    })
    .catch(function(err){ TOKEN=null; showErr(err.message||'Accesso non riuscito'); })
    .then(function(){ el('go').disabled=false; el('go').textContent='Entra'; });
}
function showErr(m){ var e=el('err'); e.textContent=m; e.style.display='block'; }
function logout(){
  TOKEN=null;
  store('idr_tk',null); store('idr_rt',null);
  el('app').hidden=true; el('login').style.display='block';
}
/* Le aperture del sito, oggi e nel mese in corso.
   Le somma qui invece di chiedere un totale al database: la tabella
   visite ha una riga per giorno e tipo di dispositivo, sono poche
   decine di righe e si sommano in un attimo.
   Se la lettura fallisce restano i trattini: è una decorazione
   dell'intestazione, non deve rompere l'ingresso nel pannello. */
function aperture(){
  var oggi = new Date();
  var primoDelMese = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
  function iso(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+
           '-'+String(d.getDate()).padStart(2,'0');
  }
  var oggiIso = iso(oggi);

  sel('visite?select=giorno,quante&giorno=gte.'+iso(primoDelMese))
    .then(function(righe){
      var nOggi = 0, nMese = 0;
      righe.forEach(function(r){
        var q = +r.quante || 0;
        nMese += q;
        if(r.giorno === oggiIso) nOggi += q;
      });
      var a = el('cntOggi'), b = el('cntMese');
      if(a) a.querySelector('b').textContent = nOggi.toLocaleString('it-IT');
      if(b) b.querySelector('b').textContent = nMese.toLocaleString('it-IT');
    })
    .catch(function(){ /* restano i trattini */ });
}

function start(){
  el('login').style.display='none';
  el('app').hidden=false;
  // il token dura un'ora: lo si rinfresca prima che scada, in silenzio
  if(!window._rinnovoPeriodico){
    window._rinnovoPeriodico = setInterval(function(){
      if(TOKEN) rinnova().catch(function(){});
    }, 45*60*1000);
  }
  aperture();
  // La Home si apre per prima anche da telefono: e' rifatta per lo schermo
  // stretto, e la prima cosa che serve entrando e' sapere se il sito e' sano.
  document.querySelectorAll('nav button').forEach(function(x){
    x.classList.toggle('on', x.getAttribute('data-t')===tab);
  });
  counters();
  go(tab);
}

el('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
el('logout').onclick=logout;

/* ---------- NAV ---------- */
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); go(b.getAttribute('data-t'));
  };
});
function go(t){
  tab=t;
  el('view').innerHTML='<div class="empty">Carico…<br>'+
    '<span style="font-size:12px;opacity:.7">indirizzi e mappe arrivano dopo, con calma</span></div>';
  ({home:vHome, oggi:vOggi, queue:vQueue, photos:vPhotos, firme:vFirme, dispositivi:vDispositivi, guasti:vGuasti, problemi:vProblemi,
    reports:vReports, reviews:vReviews, map:vMap, stats:vStats,
    note:vNote, citta:vCitta, nomi:vNomi, backup:vBackup, ricomprimi:vRicomprimi}[t]||vHome)();
}
function vaiA(t){
  document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
  var b = document.querySelector('nav button[data-t="'+t+'"]');
  if(b) b.classList.add('on');
  go(t);
}
function counters(){
  sel('submissions?select=id&state=eq.pending').then(function(r){
    var n=el('nQueue'); if(r.length){ n.textContent=r.length; n.hidden=false; } else n.hidden=true;
  }).catch(function(){});
  sel('photos?select=id&approved=eq.false').then(function(r){
    var n=el('nPhotos'); if(r.length){ n.textContent=r.length; n.hidden=false; } else n.hidden=true;
  }).catch(function(){});
  sel('problemi?select=id&stato=eq.aperto').then(function(r){
    var n=el('nProblemi'); if(r.length){ n.textContent=r.length; n.hidden=false; } else n.hidden=true;
  }).catch(function(){});
  sel('reports?select=id&approved=eq.false').then(function(r){
    var n=el('nGuasti'); if(r.length){ n.textContent=r.length; n.hidden=false; } else n.hidden=true;
  }).catch(function(){});

/* ============================================================
   GUASTI — le segnalazioni che aspettano il tuo controllo
   Da quando un guasto richiede una fotografia, "rotta" non compare
   più sulla mappa sulla parola di uno solo: arriva qui, tu guardi la
   foto e decidi. Finché non decidi, sulla scheda della fontanella
   resta un avviso ambra "in verifica" — chi passa è avvisato, ma la
   fontanella non risulta guasta.
   ============================================================ */
var NOMI_STATO = {broken:'Rotta', works:'Lavori in corso', missing:'Nessuno la trova'};

function vGuasti(){
  sel('reports?select=*&approved=eq.false&order=created_at.desc&limit=60').then(function(rows){
    if(!rows.length){
      el('view').innerHTML='<div class="empty">Nessuna segnalazione in attesa.<br>'+
        '<span style="font-size:12px;opacity:.7">Qui arrivano i guasti con la foto, '+
        'prima di comparire sulla mappa.</span></div>';
      return;
    }
    el('view').innerHTML = rows.map(function(r,i){
      var nome = NOMI_STATO[r.status] || r.status;
      var cls  = r.status==='works' ? 'pill' : 'pill bad';
      return '<div class="card foto-card">'+
        (r.photo_url ? '<img class="foto-grande" src="'+esc(r.photo_url)+'" alt="" loading="lazy">'
                     : '<div class="meta">Segnalazione senza foto (arrivata prima della nuova regola).</div>')+
        '<div class="pills"><span class="'+cls+'">'+esc(nome)+'</span>'+
          '<span class="pill">'+esc(ago(r.created_at))+'</span></div>'+
        '<div class="foto-dove" id="tit-g'+i+'">…</div>'+
        '<div class="row">'+
          (r.status === 'removed'
            ? '<button class="btn bad grosso" data-gvia="'+r.id+'" data-gt="'+esc(r.target)+'">'+
                'Togli dalla mappa</button>'+
              '<button class="btn ok sm" data-gap="'+r.id+'">Solo pubblica</button>'
            : '<button class="btn ok grosso" data-gap="'+r.id+'">Pubblica</button>')+
          '<button class="btn bad grosso" data-grm="'+r.id+'">Rifiuta</button>'+
        '</div>'+
        '<details class="dett"><summary>Chi l\'ha mandata, e dove</summary>'+
          '<div class="corpo">'+
            '<div id="dev-g'+i+'" class="meta">carico…</div>'+
            '<div id="ctx-g'+i+'"></div>'+
          '</div></details>'+
      '</div>';
    }).join('');
    agganciaGuasti();

    return caricaContesti(rows.map(function(r){ return r.target; }))
      .catch(function(){ return CTX; })
      .then(function(){
        rows.forEach(function(r,i){
          var c = CTX[r.target], t = el('tit-g'+i);
          if(t){
            var nome = (c && c.nome) ||
                       (c && c.tipo==='casa' ? "Casa dell'acqua" : 'Fontanella pubblica');
            t.innerHTML = '<b>'+esc(nome)+'</b>' + (c && c.via ? ' · ' + esc(c.via) : '');
          }
          var w = el('ctx-g'+i);
          if(w) w.innerHTML = intestazione(c, 'gx'+i);
        });
        completaIndirizzi(rows.map(function(r,i){ return {target:r.target, id:'gx'+i}; }));
        collegaVaiA();
        pesaDispositivi(rows.map(function(r){ return r.client_id; })).then(function(){
          rows.forEach(function(r,i){
            var e2 = el('dev-g'+i);
            if(e2) e2.innerHTML = chiHaMandato(r.client_id, ago(r.created_at), r);
          });
        });
      });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

function agganciaGuasti(){
  el('view').querySelectorAll('[data-gap]').forEach(function(b){
    b.onclick=function(){ b.disabled=true;
      patch('reports','id=eq.'+b.getAttribute('data-gap'),{approved:true})
        .then(function(){ toast('Pubblicato: ora la fontanella risulta così a tutti.');
                          vGuasti(); counters(); })
        .catch(function(e){ b.disabled=false; toast(e.message); }); };
  });
  /* "Togli dalla mappa" — compare solo sulle segnalazioni di rimozione.
     Prima "Pubblica" approvava la segnalazione ma lasciava la
     fontanella dov'era: per farla sparire davvero bisognava andarla a
     cercare a mano in Mappa e modifiche. Qui si fa tutto insieme:
     si approva la segnalazione E si scrive lo stato 'removed' sulla
     riga della fontanella, bloccandolo (status_locked) così il prossimo
     aggiornamento mensile di OpenStreetMap non lo riporta indietro. */
  el('view').querySelectorAll('[data-gvia]').forEach(function(b){
    b.onclick=function(){
      var target = b.getAttribute('data-gt');
      if(!confirm('Togliere questa fontanella dalla mappa?\n\n'+
                  'Verrà segnata come rimossa e non comparirà più nelle ricerche. '+
                  'Puoi rimetterla da "Mappa e modifiche" se ti accorgi che era un errore.')) return;
      b.disabled=true; b.textContent='Tolgo…';

      var isDb = target.indexOf('db/')===0;
      var q = isDb ? 'fountains?select=id&id=eq.'+target.slice(3)
                   : 'fountains?select=id&osm_id=eq.'+encodeURIComponent(target.slice(4));

      sel(q)
        .then(function(righe){
          var corpo = {status:'removed', status_locked:true};
          if(righe.length) return patch('fountains','id=eq.'+righe[0].id, corpo);
          // punto di OpenStreetMap mai toccato: serve crearne la riga.
          // le coordinate arrivano dal contesto già caricato per la scheda
          var c = CTX[target] || {};
          if(c.lat == null){
            throw new Error('non ho le coordinate: aprila da "Mappa e modifiche"');
          }
          return ins('fountains', Object.assign({
            osm_id: isDb ? null : target.slice(4),
            lat: c.lat, lon: c.lon, kind: c.tipo || 'fontanella', source: 'admin'
          }, corpo));
        })
        .then(function(){
          return patch('reports','id=eq.'+b.getAttribute('data-gvia'),{approved:true});
        })
        .then(function(){ toast('Tolta dalla mappa.'); vGuasti(); counters(); })
        .catch(function(e){ b.disabled=false; b.textContent='Togli dalla mappa';
                            toast('Non riuscito: '+e.message, 7000); });
    };
  });

  el('view').querySelectorAll('[data-grm]').forEach(function(b){
    b.onclick=function(){
      if(!confirm('Rifiutare questa segnalazione? La fontanella resta com\'è.')) return;
      b.disabled=true;
      del('reports','id=eq.'+b.getAttribute('data-grm'))
        .then(function(){ toast('Rifiutata.'); vGuasti(); counters(); })
        .catch(function(e){ b.disabled=false; toast(e.message); }); };
  });
}

/* ============================================================
   0. OGGI — cosa è successo, senza girare fra le schede
   ============================================================ */
function vOggi(){
  var ieri = new Date(Date.now() - 864e5).toISOString();
  var altroieri = new Date(Date.now() - 2*864e5).toISOString();

  Promise.all([
    sel('reports?select=id,status,created_at&created_at=gte.'+ieri).catch(function(){return[]}),
    sel('reviews?select=id,created_at&created_at=gte.'+ieri).catch(function(){return[]}),
    sel('photos?select=id,approved,created_at').catch(function(){return[]}),
    sel('submissions?select=id,state,created_at').catch(function(){return[]}),
    sel('reports?select=id&created_at=gte.'+altroieri+'&created_at=lt.'+ieri).catch(function(){return[]}),
    sel('v_status?select=target,missing_votes,broken_votes&or=(missing_votes.gte.2,broken_votes.gte.2)').catch(function(){return[]}),
    sel('problemi?select=id,created_at&stato=eq.aperto').catch(function(){return[]})
  ]).then(function(r){
    var segn=r[0], voti=r[1], foto=r[2], prop=r[3], segnIeri=r[4], guasti=r[5], probl=r[6];

    var fotoAttesa  = foto.filter(function(x){ return !x.approved; }).length;
    var propAttesa  = prop.filter(function(x){ return x.state==='pending'; }).length;
    var fotoOggi    = foto.filter(function(x){ return x.created_at >= ieri; }).length;
    var propOggi    = prop.filter(function(x){ return x.created_at >= ieri; }).length;
    var daFare      = fotoAttesa + propAttesa + guasti.length + probl.length;

    function confronto(oggi, prima){
      if(!prima && !oggi) return '';
      if(!prima) return '<span class="su">nuovo</span>';
      var d = oggi - prima;
      if(d === 0) return '<span class="pari">come ieri</span>';
      return '<span class="'+(d>0?'su':'giu')+'">'+(d>0?'+':'')+d+' su ieri</span>';
    }
    function riquadro(n, testo, extra, azione){
      return '<div class="oggi-n'+(n?'':' zero')+'"'+(azione?' data-va="'+azione+'"':'')+'>'+
             '<b>'+n+'</b><span>'+testo+'</span>'+(extra||'')+'</div>';
    }

    var h = '';
    h += '<div class="card"><h3>'+(daFare
          ? 'Ci sono '+daFare+' cose che aspettano te'
          : 'Non c\'è niente in sospeso')+'</h3>';
    h += '<div class="meta">'+(daFare
          ? 'Tocca un riquadro per andarci.'
          : 'La coda è vuota: puoi anche chiudere la pagina.')+'</div>';
    h += '<div class="oggi-griglia">'+
         riquadro(propAttesa, 'proposte da valutare', '', 'queue')+
         riquadro(fotoAttesa, 'foto da controllare', '', 'photos')+
         riquadro(probl.length, 'problemi segnalati', '', 'problemi')+
         riquadro(guasti.length, 'fontanelle segnalate guaste', '', 'reports')+
         '</div></div>';

    h += '<div class="card"><h3>Nelle ultime 24 ore</h3>'+
         '<div class="oggi-griglia">'+
         riquadro(segn.length, 'segnalazioni di stato', confronto(segn.length, segnIeri.length), 'reports')+
         riquadro(voti.length, 'voti con le stelle', '', 'reviews')+
         riquadro(fotoOggi, 'foto arrivate', '', 'photos')+
         riquadro(propOggi, 'fontanelle proposte', '', 'queue')+
         '</div>';

    if(segn.length){
      var ok = segn.filter(function(x){return x.status==='ok'}).length;
      var ko = segn.filter(function(x){return x.status==='broken'}).length;
      var lv = segn.filter(function(x){return x.status==='works'}).length;
      var sp = segn.filter(function(x){return x.status==='missing'}).length;
      h += '<div class="pills" style="margin-top:4px">'+
           (ok?'<span class="pill ok">'+ok+' funziona</span>':'')+
           (lv?'<span class="pill warn">'+lv+' lavori</span>':'')+
           (ko?'<span class="pill bad">'+ko+' rotta</span>':'')+
           (sp?'<span class="pill bad">'+sp+' non trovata</span>':'')+'</div>';
    } else {
      h += '<div class="meta">Nessuna segnalazione oggi.</div>';
    }
    h += '</div>';

    el('view').innerHTML = h;
    el('view').querySelectorAll('[data-va]').forEach(function(d){
      d.onclick = function(){
        var t = d.getAttribute('data-va');
        document.querySelectorAll('nav button').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-t')===t); });
        go(t);
      };
    });
  }).catch(function(e){
    el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>';
  });
}

/* ============================================================
   1. PROPOSTE
   ============================================================ */
function vQueue(){
  sel('submissions?select=*&state=eq.pending&order=created_at.asc').then(function(rows){
    if(!rows.length){ el('view').innerHTML='<div class="empty">Nessuna proposta in attesa.</div>'; return; }
    rows.forEach(function(s,i){
      chiediVia(s.lat, s.lon, function(via){
        var e2 = el('via-s'+i);
        if(e2) e2.textContent = via || (s.lat.toFixed(5)+', '+s.lon.toFixed(5));
      });
      pesaDispositivi([s.client_id]).then(function(){
        var e3 = el('dev-s'+i);
        if(e3) e3.innerHTML = chiHaMandato(s.client_id, ago(s.created_at), s);
      });
    });
    el('view').innerHTML=rows.map(function(s,i){
      return '<div class="card" id="s-'+s.id+'">'+
        '<h3>'+esc(s.name||(s.kind==='casa'?"Casa dell'acqua":'Fontanella'))+'</h3>'+
        '<div class="meta" id="via-s'+i+'">cerco l\'indirizzo…</div>'+
        '<div class="pills"><span class="pill">'+
          (s.kind==='casa'?"casa dell'acqua":'fontanella')+'</span>'+
          '<span class="pill">'+s.lat.toFixed(5)+', '+s.lon.toFixed(5)+'</span></div>'+
        '<div class="meta" id="dev-s'+i+'">Proposta '+esc(ago(s.created_at))+'…</div>'+
        (s.note?'<div class="meta" style="margin-top:7px;color:var(--ink)">'+esc(s.note)+'</div>':'')+
        (s.photo_path?'<img class="thumb" src="'+esc(photoUrl(s.photo_path))+'" alt="" loading="lazy">':'')+
        '<div class="row">'+
          '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lon+'">Vedi il posto</a>'+
          '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+s.lat+'&mlon='+s.lon+'#map=19/'+s.lat+'/'+s.lon+'">Su OSM</a>'+
        '</div>'+
        '<div class="row">'+
          '<button class="btn ok" data-ap="'+s.id+'">Approva</button>'+
          '<button class="btn bad" data-rj="'+s.id+'">Rifiuta</button>'+
        '</div></div>';
    }).join('');
    el('view').querySelectorAll('[data-ap]').forEach(function(b){
      b.onclick=function(){
        b.disabled=true;
        var id=b.getAttribute('data-ap');
        var sub=rows.filter(function(x){ return x.id===id; })[0];
        rpc('approve_submission',{sub_id:id})
          .then(function(nuovoId){
            if(!sub || !sub.photo_path) return;
            var fid=(typeof nuovoId==='string')?nuovoId.replace(/"/g,''):nuovoId;
            return patch('fountains','id=eq.'+fid,{photo_url:photoUrl(sub.photo_path)})
                     .catch(function(){});
          })
          .then(function(){ toast('Approvata: ora è sulla mappa.'); vQueue(); counters(); })
          .catch(function(e){ b.disabled=false; toast('Errore: '+e.message); });
      };
    });
    el('view').querySelectorAll('[data-rj]').forEach(function(b){
      b.onclick=function(){
        /* Rifiutare toglie di mezzo il lavoro di qualcuno e non si torna
           indietro dall'elenco. Su un telefono i due pulsanti stanno a un
           centimetro l'uno dall'altro: una conferma vale la mezza
           seconda che costa. */
        var id = b.getAttribute('data-rj');
        var sub = rows.filter(function(x){ return x.id===id; })[0];
        var come = sub && sub.name ? '"'+sub.name+'"' : 'questa proposta';
        if(!confirm('Rifiutare '+come+'?\n\nNon comparirà sulla mappa e sparirà da questo elenco.')) return;
        b.disabled=true;
        patch('submissions','id=eq.'+id,
              {state:'rejected',reviewed_at:new Date().toISOString()})
          .then(function(){ toast('Rifiutata.'); vQueue(); counters(); })
          .catch(function(e){ b.disabled=false; toast('Errore: '+e.message); });
      };
    });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ============================================================
   2. FOTO
   ============================================================ */
var FOTO = {filtro:'attesa', per:16, righe:[], aperta:-1, cliente:''};
var TETTO_FOTO = 500;

/* Un solo posto costruisce il filtro, cosi' la griglia che vedi e la
   firma in blocco lavorano per forza sulle stesse foto. */
function filtroFoto(){
  var f = '';
  if(FOTO.filtro === 'attesa')  f += '&approved=eq.false';
  if(FOTO.filtro === 'senza')   f += '&firma=is.null';
  if(FOTO.cliente)              f += '&client_id=eq.' + encodeURIComponent(FOTO.cliente);
  return f;
}

function vPhotos(){
  var q = 'photos?select=id,target,url,firma,client_id,created_at,approved' +
          filtroFoto() + '&order=created_at.desc&limit=' + TETTO_FOTO;

  sel(q).then(function(rows){
    FOTO.righe = rows;
    var col = FOTO.per === 4 ? 2 : (FOTO.per === 16 ? 4 : 6);

    var pieno = rows.length >= TETTO_FOTO;
    var testa =
      '<div class="firma-testa">' +
        '<div class="row">' +
          botFoto('attesa','In attesa') + botFoto('tutte','Tutte') + botFoto('senza','Senza firma') +
          (FOTO.cliente ? '<button class="btn sel" id="fClienteVia">1 dispositivo \u2715</button>' : '') +
        '</div>' +
        '<div class="row" style="margin-top:8px">' +
          botFitta(4) + botFitta(16) + botFitta(32) +
          '<span class="meta" style="align-self:center;margin-left:auto">' +
            (pieno ? 'prime ' + rows.length : rows.length + ' foto') + '</span>' +
        '</div>' +
        (FOTO.filtro === 'senza'
          ? '<div class="row" style="margin-top:8px">' +
              '<input type="text" id="fMassa" maxlength="15" placeholder="firma da applicare">' +
              '<button class="btn ok" id="fMassaGo" style="flex:0 0 auto">Firma tutte</button>' +
            '</div>' +
            '<div class="meta" style="margin-top:6px">' +
              'Scrive la firma su <b>tutte le foto in elenco</b>, comprese quelle ' +
              'mandate da altri. Apri una tua foto e usa "Solo questo dispositivo" ' +
              'per restringere prima.' +
            '</div>'
          : '') +
        (pieno
          ? '<div class="meta" style="margin-top:6px">Ci sono altre foto oltre queste ' +
            TETTO_FOTO + ': restringi con un filtro per vederle.</div>'
          : '') +
      '</div>';

    if(!rows.length){
      el('view').innerHTML = testa + '<div class="empty">Nessuna foto con questo filtro.</div>';
      agganciaFoto();
      return;
    }

    el('view').innerHTML = testa +
      '<div class="griglia" style="grid-template-columns:repeat(' + col + ',1fr)">' +
      rows.map(function(r,i){
        return '<div class="cella' + (r.approved ? '' : ' attesa') + '" data-apri="' + i + '">' +
          '<img src="' + esc(r.url) + '" alt="" loading="lazy">' +
          (r.firma ? '<div class="fi">' + esc(r.firma) + '</div>' : '') +
        '</div>';
      }).join('') + '</div>';

    agganciaFoto();
    caricaContesti(rows.map(function(r){ return r.target; })).catch(function(){});
  }).catch(function(e){
    el('view').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  });
}

function botFoto(v, testo){
  return '<button class="btn' + (FOTO.filtro === v ? ' sel' : '') +
         '" data-ff="' + v + '" style="flex:0 0 auto">' + testo + '</button>';
}
function botFitta(n){
  return '<button class="btn' + (FOTO.per === n ? ' sel' : '') +
         '" data-fit="' + n + '" style="flex:0 0 auto">' + n + '</button>';

function agganciaFoto(){
  el('view').querySelectorAll('[data-ff]').forEach(function(b){
    b.onclick = function(){ FOTO.filtro = b.getAttribute('data-ff'); vPhotos(); };
  });
  el('view').querySelectorAll('[data-fit]').forEach(function(b){
    b.onclick = function(){ FOTO.per = parseInt(b.getAttribute('data-fit'), 10); vPhotos(); };
  });
  el('view').querySelectorAll('[data-apri]').forEach(function(c){
    c.onclick = function(){ apriFoto(parseInt(c.getAttribute('data-apri'), 10)); };
  });

  var via = el('fClienteVia');
  if(via) via.onclick = function(){ FOTO.cliente = ''; vPhotos(); };

  var go = el('fMassaGo');
  if(go) go.onclick = function(){
    var v = ripulisciFirma(el('fMassa').value);
    if(!v){ toast('Scrivi prima la firma da applicare.'); return; }
    if(!FOTO.righe.length){ toast('Non c\'\u00e8 niente da firmare.'); return; }
    if(!confirm('Scrivere "' + v + '" su ' + FOTO.righe.length + ' foto?\n\n' +
                (FOTO.cliente ? 'Sono le foto di un solo dispositivo.'
                              : 'Sono TUTTE le foto senza firma, anche quelle di altri.')))
      return;
    go.disabled = true;
    /* Una sola chiamata con lo stesso filtro della griglia: niente giri
       di centinaia di richieste, e nessun rischio che l'elenco cambi
       a meta' strada. */
    patch('photos', filtroFoto().replace(/^&/, ''), {firma: v})
      .then(function(){ toast('Firmate ' + FOTO.righe.length + ' foto.', 4000); vPhotos(); })
      .catch(function(e){ go.disabled = false; toast(e.message); });
  };
}

/* Visore a pieno schermo: una foto per volta, con la firma sotto. */
function apriFoto(i){
  if(i < 0 || i >= FOTO.righe.length) return;
  FOTO.aperta = i;
  var r = FOTO.righe[i];
  var c = CTX[r.target];
  var dove = c && c.nome ? c.nome : (c && c.tipo === 'casa' ? "Casa dell'acqua" : 'Fontanella pubblica');
  if(c && c.via) dove += ' \u00b7 ' + c.via;

  var vecchio = el('visore');
  if(vecchio) vecchio.remove();

  var d = document.createElement('div');
  d.id = 'visore';
  d.className = 'visore';
  d.innerHTML =
    '<div class="frecce">' +
      '<button id="vChiudi">\u2715</button>' +
      '<span class="conta">' + (i + 1) + ' di ' + FOTO.righe.length + '</span>' +
      '<span><button id="vPrec">\u2039</button> <button id="vSucc">\u203a</button></span>' +
    '</div>' +
    '<div class="scatto"><img src="' + esc(r.url) + '" alt=""></div>' +
    '<div class="sotto">' +
      '<div class="meta">' + esc(dove) + '<br>' + ago(r.created_at) +
        (r.approved ? '' : ' \u00b7 <b>in attesa di pubblicazione</b>') + '</div>' +
      '<input type="text" id="vFirma" maxlength="15" value="' + esc(r.firma || '') + '" ' +
        'placeholder="firma (opzionale)">' +
      '<div class="row" style="margin-top:8px">' +
        '<button class="btn ok" id="vSalva">Salva firma</button>' +
        (r.firma ? '<button class="btn" id="vTogli">Togli firma</button>' : '') +
      '</div>' +
      '<div class="row" style="margin-top:8px">' +
        (r.approved ? '' : '<button class="btn ok grosso" id="vPubblica">Pubblica</button>') +
        '<button class="btn bad grosso" id="vElimina">Elimina</button>' +
      '</div>' +
      (r.client_id
        ? '<div class="row" style="margin-top:8px">' +
            '<button class="btn" id="vCliente">Solo questo dispositivo</button></div>'
        : '') +
    '</div>';
  document.body.appendChild(d);

  el('vChiudi').onclick = chiudiFoto;
  el('vPrec').onclick = function(){ apriFoto(i - 1); };
  el('vSucc').onclick = function(){ apriFoto(i + 1); };

  el('vSalva').onclick = function(){
    var v = ripulisciFirma(el('vFirma').value);
    this.disabled = true;
    patch('photos', 'id=eq.' + r.id, {firma: v || null})
      .then(function(){ r.firma = v || null; toast('Firma salvata.'); apriFoto(i); dipingiCella(i); })
      .catch(function(e){ toast(e.message); });
  };
  var t = el('vTogli');
  if(t) t.onclick = function(){
    patch('photos', 'id=eq.' + r.id, {firma: null})
      .then(function(){ r.firma = null; toast('Firma tolta.'); apriFoto(i); dipingiCella(i); })
      .catch(function(e){ toast(e.message); });
  };
  var pub = el('vPubblica');
  if(pub) pub.onclick = function(){
    var v = ripulisciFirma(el('vFirma').value);
    pub.disabled = true;
    patch('photos', 'id=eq.' + r.id, {approved:true, firma: v || null})
      .then(function(){ toast('Foto pubblicata.'); chiudiFoto(); vPhotos(); counters(); })
      .catch(function(e){ pub.disabled = false; toast(e.message); });
  };
  var vc = el('vCliente');
  if(vc) vc.onclick = function(){
    FOTO.cliente = r.client_id;
    chiudiFoto();
    vPhotos();
  };
  el('vElimina').onclick = function(){
    if(!confirm('Eliminare la foto?')) return;
    del('photos', 'id=eq.' + r.id)
      .then(function(){ toast('Eliminata.'); chiudiFoto(); vPhotos(); counters(); })
      .catch(function(e){ toast(e.message); });
  };
}

function dipingiCella(i){
  var c = el('view').querySelector('[data-apri="' + i + '"]');
  if(!c) return;
  var r = FOTO.righe[i];
  var eti = c.querySelector('.fi');
  if(r.firma){
    if(eti) eti.textContent = r.firma;
    else { var n = document.createElement('div'); n.className = 'fi'; n.textContent = r.firma; c.appendChild(n); }
  } else if(eti) eti.remove();
}

function chiudiFoto(){
  var v = el('visore');
  if(v) v.remove();
  FOTO.aperta = -1;
}

document.addEventListener('keydown', function(e){
  if(!el('visore')) return;
  if(e.key === 'Escape') chiudiFoto();
  if(e.key === 'ArrowLeft')  apriFoto(FOTO.aperta - 1);
  if(e.key === 'ArrowRight') apriFoto(FOTO.aperta + 1);
});

/* ============================================================
   FIRME — solo le firme, raggruppate per testo
   Serve a leggere in fretta ogni firma diversa una volta sola e
   togliere quelle che non vanno. Le foto stanno nella pagina Foto.
   ============================================================ */
function ripulisciFirma(s){
  var t = String(s==null?'':s)
    .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\u2028\u2029\ufeff]/g,'')
    .replace(/\s+/g,' ').trim();
  var out = [];
  Array.from(t).forEach(function(ch){
    if(ch.length === 1){
      var c = ch.charCodeAt(0);
      if(c >= 0xd800 && c <= 0xdfff) return;
    }
    if(out.length < 15) out.push(ch);
  });
  return out.join('');
}

var FIRME = {righe:[]};

function vFirme(){

            '</div>' +
          '</div>' +

      }).join('') + '</div>';

    el('view').querySelectorAll('[data-vedi]').forEach(function(b){
      b.onclick = function(){
        var f = FIRME.righe[b.getAttribute('data-vedi')];
        /* Niente vaiA(): farebbe partire vPhotos, che scarica tutte le
           foto e riscrive la vista quando arriva. Con una connessione

        document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
