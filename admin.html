      '<span style="font-size:12px;opacity:.7">Hai gi\u00e0 rilanciato 11-firme.sql? ' +
      'La vista v_firme e\u0300 stata aggiunta l\u00ec.</span></div>';
  });
}

/* Dalla pagina Firme alla griglia, mostrando solo quella firma. */
/* Provato contro PostgREST 12: encodeURIComponent basta anche con
   punti, parentesi e virgole. Le virgolette NON vanno messe: per "eq."
   PostgREST non le toglie e finirebbero dentro il valore cercato.
   L'unico valore ambiguo e' la parola "null", che verrebbe letta come
   NULL: per quella si usa il filtro apposta. */
function filtroFirma(testo){
  return String(testo).toLowerCase() === 'null'
    ? 'firma=eq.' + encodeURIComponent(testo) + '&firma=not.is.null'
    : 'firma=eq.' + encodeURIComponent(testo);
}

function filtraPerFirma(testo){
  sel('photos?select=id,target,url,firma,client_id,created_at,approved' +
      '&' + filtroFirma(testo) +
      '&order=created_at.desc&limit=500').then(function(rows){
    FOTO.righe = rows;
    var col = FOTO.per === 4 ? 2 : (FOTO.per === 16 ? 4 : 6);
    el('view').innerHTML =
      '<div class="firma-testa">' +
        '<div class="row"><button class="btn" id="fbIndietro">\u2039 Firme</button>' +
        '<span class="meta" style="align-self:center;margin-left:auto">' +
        rows.length + ' foto firmate <b>' + esc(testo) + '</b></span></div>' +
      '</div>' +
      '<div class="griglia" style="grid-template-columns:repeat(' + col + ',1fr)">' +
      rows.map(function(r,i){
        return '<div class="cella' + (r.approved ? '' : ' attesa') + '" data-apri="' + i + '">' +
          '<img src="' + esc(r.url) + '" alt="" loading="lazy">' +
          (r.firma ? '<div class="fi">' + esc(r.firma) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    el('fbIndietro').onclick = function(){ vaiA('firme'); };
    el('view').querySelectorAll('[data-apri]').forEach(function(c){
      c.onclick = function(){ apriFoto(parseInt(c.getAttribute('data-apri'), 10)); };
    });
    caricaContesti(rows.map(function(r){ return r.target; })).catch(function(){});
  }).catch(function(e){ toast(e.message); });
}

/* ============================================================
   DISPOSITIVI — da cosa arriva la gente
   Contatori aggregati per giorno, nessun identificatore. Le quattro
   dimensioni sono contate separate, mai incrociate: sapere "quanti
   iPhone" e "quanti Safari" non dice chi era, sapere "iPhone+Safari+
   app+oggi" comincia a dirlo.
   ============================================================ */
var DISP = {giorni:30};

var ETICHETTE = {
  dispositivo:{telefono:'Telefono', tablet:'Tablet', computer:'Computer'},
  sistema:{android:'Android', ios:'iPhone / iPad', windows:'Windows', mac:'Mac',
           linux:'Linux', altro:'Altro'},
  browser:{chrome:'Chrome', safari:'Safari', firefox:'Firefox', edge:'Edge',
           samsung:'Samsung Internet', opera:'Opera', altro:'Altro'},
  modo:{app:'App installata', browser:'Browser'},
  provenienza:{google:'Ricerca su Google', motore:'Altro motore di ricerca',
               social:'Social', sito:'Un altro sito',
               diretto:'Indirizzo digitato o preferito', app:'App installata'}
};
var TITOLI = {dispositivo:'Che cosa usano', sistema:'Sistema operativo',
              browser:'Browser', modo:'App o browser',
              provenienza:'Da dove arrivano'};

function vDispositivi(){
  Promise.all([
    sel('v_dispositivi?select=*'),
    sel('v_partecipazione?select=*').catch(function(){ return []; })
  ]).then(function(due){
    var rows = due[0], part = due[1] && due[1][0];
    var campo = DISP.giorni === 30 ? 'ultimi_30' : (DISP.giorni === 90 ? 'ultimi_90' : 'sempre');

    var testa = '<div class="firma-testa"><div class="row">' +
      [30, 90, 0].map(function(g){
        return '<button class="btn' + (DISP.giorni === g ? ' sel' : '') +
               '" data-gg="' + g + '" style="flex:0 0 auto">' +
               (g ? g + ' giorni' : 'Sempre') + '</button>';
      }).join('') + '</div></div>';

    var quadri = '';
    if(part){
      var senza = part.recensite_senza_foto || 0;
      var quota = part.recensite ? Math.round(100 * (part.recensite_con_foto || 0) / part.recensite) : 0;
      quadri =
        '<div class="gruppo-t">Partecipazione</div>' +
        '<div class="card"><div class="part">' +
          quadro(part.recensite, 'fontanelle recensite') +
          quadro(part.recensite_con_foto, 'recensite <b>con</b> foto') +
          quadro(senza, 'recensite <b>senza</b> foto', true) +
        '</div>' +
        '<div class="barra" style="margin-top:12px"><i style="width:' + quota + '%"></i></div>' +
        '<div class="meta" style="margin-top:6px">' + quota +
          '% delle fontanelle recensite ha almeno una foto pubblicata.</div>' +
        '<div class="part" style="margin-top:10px">' +
          quadro(part.con_foto, 'fontanelle con foto') +
          quadro(part.foto_senza_recensione, 'con foto ma senza voto') +
          quadro(part.toccate, 'toccate in tutto') +
        '</div>' +
        ((part.con_foto_anche_attesa || 0) > (part.con_foto || 0)
          ? '<div class="meta" style="margin-top:8px">Altre ' +
            ((part.con_foto_anche_attesa || 0) - (part.con_foto || 0)) +
            ' fontanelle hanno una foto ancora da approvare: non sono contate qui sopra.</div>'
          : '') +
        '</div>';
    }

    var attive = rows.filter(function(r){ return (r[campo] || 0) > 0; });
    if(!attive.length){
      el('view').innerHTML = quadri + testa +
        '<div class="empty">Ancora nessuna visita registrata in questo periodo.<br>' +
        '<span style="font-size:12px;opacity:.7">I numeri partono da quando pubblichi ' +
        'la versione 9.22: le aperture di prima non si possono ricostruire.</span></div>';
      agganciaDisp();
      return;
    }

    var h = quadri + testa;
    ['provenienza','dispositivo','sistema','browser','modo'].forEach(function(dim){
      var righe = attive.filter(function(r){ return r.dimensione === dim; })
                        .sort(function(a,b){ return (b[campo]||0) - (a[campo]||0); });
      if(!righe.length) return;
      var tot = righe.reduce(function(n,r){ return n + (r[campo] || 0); }, 0);
      h += '<div class="gruppo-t">' + TITOLI[dim] + '</div><div class="card">' +
        righe.map(function(r){
          var n = r[campo] || 0;
          var pct = tot ? Math.round(1000 * n / tot) / 10 : 0;
          var nome = (ETICHETTE[dim] && ETICHETTE[dim][r.valore]) || r.valore;
          return '<div class="barra-riga">' +
            '<div class="barra-testa"><b>' + esc(nome) + '</b>' +
              '<span>' + n + ' \u00b7 ' + pct + '%</span></div>' +
            '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
          '</div>';
        }).join('') +
        '<div class="meta" style="margin-top:8px">' + tot + ' aperture contate</div>' +
      '</div>';
    });

    h += '<div class="card" style="margin-top:14px"><div class="meta">' +
      'Sono contatori per giorno, senza codice utente e senza user agent: ' +
      'le quattro sezioni non si possono incrociare fra loro, ed \u00e8 voluto. ' +
      'Un\'apertura viene contata una volta al giorno per dispositivo.' +
      '</div></div>';

    el('view').innerHTML = h;
    agganciaDisp();
  }).catch(function(e){
    el('view').innerHTML = '<div class="empty">' + esc(e.message) + '<br>' +
      '<span style="font-size:12px;opacity:.7">Hai gi\u00e0 lanciato 13-statistiche-visite.sql?</span></div>';
  });
}

function quadro(n, etichetta, spicca){
  return '<div class="q' + (spicca ? ' spicca' : '') + '">' +
    '<div class="n">' + (n == null ? '–' : n) + '</div>' +
    '<div class="e">' + etichetta + '</div></div>';
}

function agganciaDisp(){
  el('view').querySelectorAll('[data-gg]').forEach(function(b){
    b.onclick = function(){ DISP.giorni = parseInt(b.getAttribute('data-gg'), 10); vDispositivi(); };
  });
}

   3. SEGNALAZIONI DI STATO

function vReports(){
  Promise.all([
    sel('reports?select=*&order=created_at.desc&limit=80'),
    sel('v_status?select=*&order=missing_votes.desc,broken_votes.desc&limit=40')
  ]).then(function(res){
    var recent=res[0], agg=res[1].filter(function(r){
      return r.broken_votes>0 || r.works_votes>0 || r.missing_votes>0; });
    var h='';
    if(agg.length){
      h+='<div class="card"><h3>Da controllare</h3>'+
         '<div class="meta">Punti che qualcuno ha segnalato come rotti, in lavori, o che non è riuscito a trovare. '+
         'Quelli che nessuno trova valgono un controllo su Street View: forse la fontanella non esiste più.</div>';
      agg.forEach(function(a){
        h+='<div class="stat"><span>'+esc(a.target)+'<br><span class="meta">'+
           '<span class="pill ok">'+a.ok_votes+' ok</span>'+
           (a.works_votes?'<span class="pill warn">'+a.works_votes+' lavori</span>':'')+
           '<span class="pill bad">'+a.broken_votes+' rotta</span>'+esc(ago(a.last_report))+'</span></span>'+
           '<button class="btn ghost sm" data-fix="'+esc(a.target)+'">Decidi</button></div>';
      });
      h+='</div>';
    }
    h+='<div class="card"><h3>Ultime segnalazioni</h3>';
    if(!recent.length) h+='<div class="meta">Ancora nessuna.</div>';
    recent.forEach(function(r){
      var cl={ok:'ok',works:'warn',broken:'bad',missing:'bad'}[r.status]||'';
      var tx={ok:'funziona',works:'lavori',broken:'rotta',missing:'non trovata'}[r.status]||r.status;
      h+='<div class="stat"><span class="meta">'+esc(r.target)+'</span>'+
         '<span><span class="pill '+cl+'">'+tx+'</span>'+esc(ago(r.created_at))+'</span></div>';
    });
    h+='</div>';
    el('view').innerHTML=h;
    el('view').querySelectorAll('[data-fix]').forEach(function(b){
      b.onclick=function(){ openEditorByTarget(b.getAttribute('data-fix')); };
    });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ============================================================
   4. RECENSIONI
   ============================================================ */
function vReviews(){
  sel('reviews?select=*&order=created_at.desc&limit=60').then(function(rows){
    if(!rows.length){ el('view').innerHTML='<div class="empty">Ancora nessun voto.</div>'; return; }

    return caricaContesti(rows.map(function(r){ return r.target; }))
      .catch(function(){ return CTX; })     // il contesto è un di più, non una condizione
      .then(function(){
    el('view').innerHTML=rows.map(function(r,i){
      var c = CTX[r.target];
      var stars=[['findability','raggiungibile'],['cleanliness','stato'],['taste','comodità']]
        .filter(function(s){ return r[s[0]]; })
        .map(function(s){ return '<span class="pill">'+s[1]+' '+r[s[0]]+'★</span>'; }).join('');
      if(r.temperature){
        var nomi={1:'calda',3:'ambiente',5:'fresca'};
        stars += '<span class="pill">acqua '+(nomi[r.temperature]||r.temperature)+'</span>';
      }
      // Le stelle singole si correggono qui: per quando qualcuno ha
      // votato per dispetto e la media ne risente. Ogni cambio si salva
      // da solo, senza un tasto "salva" a parte -- e' una correzione,
      // non un modulo da compilare.
      var CAMPI_STELLE = [['findability','raggiungibile'],['cleanliness','stato'],
                           ['taste','comodit\u00e0'],['temperature','acqua']];
      var editStelle = '<div class="stelle-riga">' + CAMPI_STELLE.map(function(cs){
        var v = r[cs[0]], opz = ['<option value="">\u2014</option>'];
        for(var n=1;n<=5;n++) opz.push('<option value="'+n+'"'+(v===n?' selected':'')+'>'+n+'</option>');
        return '<div class="stelle-un"><label>'+cs[1]+'</label>'+
          '<select data-stella="'+r.id+'" data-campo="'+cs[0]+'">'+opz.join('')+'</select></div>';
      }).join('') + '</div>';

      return '<div class="card">'+
        intestazione(c, 'r'+i)+
        '<div class="pills">'+stars+
          (r.approved?'':'<span class="pill bad">nascosto</span>')+'</div>'+
        editStelle+
        (r.comment?'<div style="font-size:14.5px;line-height:1.45;padding:10px 12px;'+
          'background:rgba(7,36,47,.04);border-radius:10px">'+esc(r.comment)+'</div>':
          '<div class="meta">Nessun commento scritto.</div>')+
        '<div class="meta" style="margin-top:8px" id="dev-r'+i+'">Lasciato '+esc(ago(r.created_at))+'\u2026</div>'+
        '<div class="row">'+
        (r.approved
          ? '<button class="btn bad sm" data-hide="'+r.id+'">Annulla voto</button>'
          : '<button class="btn ok sm" data-show="'+r.id+'">Ripubblica</button>')+
        '<button class="btn ghost sm" data-rm="'+r.id+'">Elimina</button></div></div>';
    }).join('');

    completaIndirizzi(rows.map(function(r,i){ return {target:r.target, id:'r'+i}; }));
    collegaVaiA();
    pesaDispositivi(rows.map(function(r){ return r.client_id; })).then(function(){
      rows.forEach(function(r,i){
        var e2 = el('dev-r'+i);
        if(e2) e2.innerHTML = chiHaMandato(r.client_id, ago(r.created_at), r);
      });
    });

    var refresh=function(){ toast('Fatto.'); vReviews(); };
    el('view').querySelectorAll('[data-stella]').forEach(function(sl){
      sl.onchange=function(){
        var id=sl.getAttribute('data-stella'), campo=sl.getAttribute('data-campo');
        var v = sl.value===''? null : +sl.value;
        sl.disabled=true;
        var body={}; body[campo]=v;
        patch('reviews','id=eq.'+id, body)
          .then(function(){ toast('Voto corretto.'); vReviews(); })
          .catch(function(e){ sl.disabled=false; toast(e.message); });
      };
    });
    el('view').querySelectorAll('[data-hide]').forEach(function(b){ b.onclick=function(){
      patch('reviews','id=eq.'+b.getAttribute('data-hide'),{approved:false}).then(refresh); }; });
    el('view').querySelectorAll('[data-show]').forEach(function(b){ b.onclick=function(){
      patch('reviews','id=eq.'+b.getAttribute('data-show'),{approved:true}).then(refresh); }; });
    el('view').querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){
      if(!confirm('Eliminare il voto?')) return;
      del('reviews','id=eq.'+b.getAttribute('data-rm')).then(refresh); }; });
    });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ============================================================
   5. MAPPA + EDITOR (modifica qualsiasi punto)
   ============================================================ */
function vMap(){
  el('view').innerHTML=
    '<div class="card" style="padding:10px"><div id="map"></div>'+
    '<div class="meta">Tocca un punto per modificarlo. Verde: fontanella. Ambra: casa dell\'acqua. '+
    'Rosso: segnalata rotta. Bordo scuro: punto tuo, non presente su OpenStreetMap.</div>'+
    '<div class="row"><button class="btn ok sm" id="addHere">Aggiungi un punto al centro</button>'+
    '<button class="btn ghost sm" id="reload">Ricarica l\'area</button></div></div>'+
    '<div id="editor"></div>';

  setTimeout(function(){
    if(map){ map.remove(); map=null; }
    map=L.map('map',{zoomControl:true}).setView([45.4642,9.19],15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:19,attribution:'&copy; OpenStreetMap, &copy; CARTO'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){
      map.setView([p.coords.latitude,p.coords.longitude],16); loadMap();
    },function(){ loadMap(); },{timeout:6000});
    else loadMap();
    map.on('moveend', loadMap);
    el('reload').onclick=loadMap;
    el('addHere').onclick=function(){
      var c=map.getCenter();
      openEditor({lat:+c.lat.toFixed(6), lon:+c.lng.toFixed(6), kind:'fontanella',
                  status:'ok', source:'admin', _new:true});
    };
  },40);
}
function loadMap(){
  if(!map) return;
  var c=map.getCenter(), d=0.03;
  Promise.all([
    sel('fountains?select=*&lat=gte.'+(c.lat-d)+'&lat=lte.'+(c.lat+d)+
        '&lon=gte.'+(c.lng-d)+'&lon=lte.'+(c.lng+d)+'&limit=600'),
    overpass(c),
    sel('v_status?select=*&limit=3000')
  ]).then(function(res){
    var db=res[0], osm=res[1], st={};
    res[2].forEach(function(r){ st[r.target]=r; });
    var ov={}; db.forEach(function(r){ if(r.osm_id) ov[r.osm_id]=r; });
    layer.clearLayers();

    osm.forEach(function(p){ pin(p, ov[p.id]||null, st['osm/'+p.id]); });
    db.forEach(function(r){ if(!r.osm_id) pin(
      {id:'db/'+r.id, lat:r.lat, lon:r.lon, kind:r.kind, tags:{name:r.name}}, r, st['db/'+r.id], true); });
  }).catch(function(e){ toast(e.message); });
}
function pin(p, ovr, stat, custom){
  var broken = (ovr && (ovr.status==='broken' || ovr.status==='works' || ovr.status==='removed')) ||
               (stat && ((stat.works_votes||0) >= 1 || (stat.missing_votes||0) >= 2 ||
                        (stat.broken_votes>=2 && stat.broken_votes>stat.ok_votes)));
  var cls='pin'+(p.kind==='casa'?' casa':'')+(broken?' broken':'')+(custom?' custom':'');
  L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div class="'+cls+'"></div>',
    iconSize:[26,26],iconAnchor:[13,24]})})
   .on('click',function(){
      openEditor(ovr || {osm_id:(custom?null:p.id), lat:p.lat, lon:p.lon, kind:p.kind,
                         name:(p.tags&&p.tags.name)||'', status:'unknown', _new:true},
                 p);
   }).addTo(layer);
}
function overpass(c){
  var a='(around:1600,'+c.lat.toFixed(5)+','+c.lng.toFixed(5)+')';
  var q='[out:json][timeout:25];(nwr["amenity"="drinking_water"]'+a+';'+
        'nwr["man_made"="water_tap"]'+a+';nwr["amenity"="water_point"]'+a+';'+
        'nwr["amenity"="vending_machine"]["vending"~"water"]'+a+';);out center 300;';
  return fetch('https://overpass-api.de/api/interpreter',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q)})
    .then(function(r){ return r.json(); })
    .then(function(d){
      return (d.elements||[]).map(function(e){
        var lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
        var lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
        if(lat==null) return null;
        var t=e.tags||{};
        var kind=(t.amenity==='vending_machine'||t.amenity==='water_point')?'casa':'fontanella';
        return {id:e.type+'/'+e.id, lat:lat, lon:lon, tags:t, kind:kind};
      }).filter(Boolean);
    }).catch(function(){ return []; });
}
function openEditorByTarget(target, contesto){
  document.querySelectorAll('nav button').forEach(function(x){
    x.classList.toggle('on', x.getAttribute('data-t')==='map'); });
  var isDb = target.indexOf('db/')===0;
  var q = isDb ? 'fountains?select=*&id=eq.'+target.slice(3)
               : 'fountains?select=*&osm_id=eq.'+encodeURIComponent(target.slice(4));
  sel(q).then(function(rows){
    vMap();
    setTimeout(function(){
      if(rows.length){ openEditor(rows[0]); return; }

      /* Nessuna riga ancora: è un punto di OpenStreetMap che nessuno ha
         mai toccato. Prima qui si apriva un punto nuovo con lat 0, lon 0,
         stato "rotta" e stato bloccato — valori pensati per il flusso
         "segnala un guasto" e riusati per tutto il resto. Chi arrivava qui
         per correggere un nome, salvando, spostava la fontanella al largo
         dell'Africa e la dichiarava guasta.

         Adesso si parte dai dati veri che la scheda di provenienza già
         conosce, e lo stato resta "sconosciuto" e non bloccato: aprire un
         punto per cambiargli il nome non deve esprimere nessuna opinione
         sull'acqua. */
      var ctx = contesto || {};
      openEditor({
        osm_id: isDb ? null : target.slice(4),
        lat: ctx.lat != null ? +ctx.lat : null,
        lon: ctx.lon != null ? +ctx.lon : null,
        kind: ctx.kind || 'fontanella',
        name: ctx.nome || '',
        status: 'unknown',
        status_locked: false,
        _new: true,
        _noGeo: ctx.lat == null      // senza coordinate non si può salvare: l'editor avvisa
      });
    },300);
  });
}
function openEditor(f, osmPoint){
  editing=f;
  var t=(osmPoint&&osmPoint.tags)||{};
  var h='<div class="card"><h3>'+(f._new?'Nuovo punto':'Modifica punto')+'</h3>'+
    '<div class="meta">'+(f.osm_id?'OpenStreetMap · '+esc(f.osm_id):'Punto tuo')+
    (f.id?' · id '+esc(f.id).slice(0,8):'')+'</div>';
  if(t.name||t.operator) h+='<div class="meta" style="margin-top:5px">OSM dice: '+esc(t.name||'')+' '+esc(t.operator||'')+'</div>';

  h+='<label>Nome</label><input id="fName" value="'+esc(f.name||'')+'" placeholder="Fontanella pubblica">';
  h+='<div class="grid2"><div><label>Tipo</label><select id="fKind">'+
      '<option value="fontanella"'+(f.kind!=='casa'?' selected':'')+'>Fontanella</option>'+
      '<option value="casa"'+(f.kind==='casa'?' selected':'')+'>Casa dell\'acqua</option></select></div>'+
      '<div><label>Stato</label><select id="fStatus">'+
      ['unknown|Sconosciuto','ok|Funzionante','works|Lavori in corso','broken|Rotta','removed|Rimossa'].map(function(o){
        var v=o.split('|'); return '<option value="'+v[0]+'"'+(f.status===v[0]?' selected':'')+'>'+v[1]+'</option>';
      }).join('')+'</select></div></div>';
  h+='<div class="grid2"><div><label>Costo</label><select id="fFee">'+
      '<option value="">Non specificato</option>'+
      '<option value="free"'+(f.fee==='free'?' selected':'')+'>Gratis</option>'+
      '<option value="paid"'+(f.fee==='paid'?' selected':'')+'>A pagamento</option></select></div>'+
      '<div><label>Potabilità</label><select id="fPot">'+
      '<option value="">Non specificata</option>'+
      '<option value="1"'+(f.potable===true?' selected':'')+'>Potabile</option>'+
      '<option value="0"'+(f.potable===false?' selected':'')+'>Non potabile</option></select></div></div>';
  h+='<label>Note pubbliche <span class="lim">max 100 caratteri</span></label>'+
     '<textarea id="fNotes" rows="2" maxlength="100">'+esc(f.notes||'')+'</textarea>'+
     '<div class="conta" id="contaNote"></div>';
  h+='<label>Foto ufficiale</label>'+
     '<div id="fPhotoBox">'+
       '<img id="fPhotoPrev" class="foto-editor"'+
         (f.photo_url ? ' src="'+esc(f.photo_url)+'"' : ' hidden')+' alt="">'+
       '<div class="row" style="margin-top:8px">'+
         '<button type="button" class="btn ghost sm" id="fPhotoPick">'+
           (f.photo_url ? 'Cambia foto' : 'Carica una foto')+'</button>'+
         '<button type="button" class="btn bad sm" id="fPhotoDel"'+
           (f.photo_url ? '' : ' hidden')+'>Togli</button>'+
       '</div>'+
       // accept generico + niente capture: su telefono compaiono sia
       // la fotocamera sia la galleria, su computer il selettore file
       '<input type="file" id="fPhotoFile" accept="image/*" hidden>'+
       '<div class="meta" id="fPhotoStato"></div>'+
       '<input id="fPhoto" value="'+esc(f.photo_url||'')+'" placeholder="https://…" '+
         'style="margin-top:8px" title="indirizzo della foto">'+
     '</div>';
  h+='<div class="grid2"><div><label>Lat</label><input id="fLat" value="'+(f.lat||'')+'"></div>'+
      '<div><label>Lon</label><input id="fLon" value="'+(f.lon||'')+'"></div></div>';
  h+='<div class="check"><input type="checkbox" id="fCard"'+(f.requires_card?' checked':'')+
      '><label for="fCard" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Serve la tessera sanitaria</label></div>';
  h+='<div class="check"><input type="checkbox" id="fLock"'+(f.status_locked?' checked':'')+
      '><label for="fLock" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Blocca lo stato (i voti degli utenti non lo cambiano)</label></div>';
  h+='<div class="check"><input type="checkbox" id="fHide"'+(f.hidden?' checked':'')+
      '><label for="fHide" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Nascondi dalla mappa pubblica</label></div>';
  h+='<div class="row"><button class="btn ok" id="fSave">Salva</button>'+
      '<button class="btn ghost" id="fCancel">Annulla</button>'+
      (f.id?'<button class="btn bad" id="fDel">Elimina</button>':'')+'</div></div>';

  el('editor').innerHTML=h;
  el('editor').scrollIntoView({behavior:'smooth',block:'start'});

  el('fCancel').onclick=function(){ el('editor').innerHTML=''; editing=null; };

  /* ---- Foto: caricamento diretto da fotocamera o galleria ----
     Prima qui c'era solo un campo dove incollare un indirizzo a mano,
     il che presupponeva che la foto fosse già online da qualche parte.
     Ora si sceglie il file e basta: viene compressa con lo stesso
     criterio delle foto della community (~45 KB) e caricata su
     Storage sotto admin/. Il campo con l'indirizzo resta visibile e
     modificabile, per i casi in cui la foto sia già altrove. */
  (function fotoEditor(){
    var file  = el('fPhotoFile'), prev = el('fPhotoPrev'),
        stato = el('fPhotoStato'), campo = el('fPhoto'),
        pick  = el('fPhotoPick'),  togli = el('fPhotoDel');
    if(!file) return;

    function mostra(url){
      campo.value = url || '';
      if(url){ prev.src = url; prev.hidden = false; togli.hidden = false;
               pick.textContent = 'Cambia foto'; }
      else   { prev.removeAttribute('src'); prev.hidden = true; togli.hidden = true;
               pick.textContent = 'Carica una foto'; }
    }

    pick.onclick  = function(){ file.click(); };
    togli.onclick = function(){ mostra(''); stato.textContent = 'Foto tolta. Ricordati di salvare.'; };

    // se modifichi l'indirizzo a mano, l'anteprima segue
    campo.oninput = function(){
      var v = campo.value.trim();
      if(v){ prev.src = v; prev.hidden = false; togli.hidden = false; }
      else { prev.hidden = true; togli.hidden = true; }
    };

    file.onchange = function(){
      var f = file.files && file.files[0];
      if(!f) return;
      if(!/^image\//.test(f.type)){ toast('Quello non è un file immagine.'); file.value=''; return; }

      pick.disabled = true;
      stato.textContent = 'Comprimo…';

      ricComprimi(f)
        .then(function(blob){
          stato.textContent = 'Carico… ('+Math.round(blob.size/1024)+' KB)';
          var nome = 'admin/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
          return fetch(CFG.SUPABASE_URL+'/storage/v1/object/photos/'+nome, {
            method:'POST',
            headers:H({'Content-Type':'image/jpeg','x-upsert':'true'}),
            body: blob
          }).then(function(resp){
            if(!resp.ok) return resp.text().then(function(t){
              throw new Error('HTTP '+resp.status+' '+t.slice(0,80));
            });
            return photoUrl(nome);
          });
        })
        .then(function(url){
          mostra(url);
          stato.textContent = 'Caricata. Premi Salva per applicarla.';
        })
        ['catch'](function(e){
          stato.textContent = '';
          toast('Foto non caricata: '+e.message, 7000);
        })
        .then(function(){ pick.disabled = false; file.value=''; });
    };
  })();
  if(el('fDel')) el('fDel').onclick=function(){
    if(!confirm('Eliminare questo punto?')) return;
    del('fountains','id=eq.'+f.id).then(function(){
      toast('Eliminato.'); el('editor').innerHTML=''; loadMap(); });
  };
  var note = el('fNotes'), contaN = el('contaNote');
  if(note && contaN){
    var aggiornaConta = function(){
      var restano = 100 - note.value.length;
      contaN.textContent = restano + ' caratteri';
      contaN.classList.toggle('finiti', restano <= 10);
    };
    note.oninput = aggiornaConta;
    aggiornaConta();
  }

  el('fSave').onclick=function(){
    var pot=el('fPot').value;
    var body={
      osm_id: f.osm_id||null,
      lat:+el('fLat').value, lon:+el('fLon').value,
      kind:el('fKind').value,
      name:el('fName').value.trim()||null,
      notes:el('fNotes').value.trim()||null,
      status:el('fStatus').value,
      status_locked:el('fLock').checked,
      fee:el('fFee').value||null,
      potable: pot===''?null:(pot==='1'),
      requires_card:el('fCard').checked,
      hidden:el('fHide').checked,
      photo_url:el('fPhoto').value.trim()||null
    };
    if(!isFinite(body.lat)||!isFinite(body.lon)||!body.lat){
      toast(f._noGeo
        ? 'Di questo punto non ho le coordinate. Trovalo su "Mappa e modifiche" '+
          'e aprilo da lì, oppure incolla latitudine e longitudine a mano.'
        : 'Coordinate non valide.', 7000);
      return;
    }
    var b=el('fSave'); b.disabled=true; b.textContent='Salvo…';
    var p = f.id
      ? patch('fountains','id=eq.'+f.id, body)
      : api('fountains?on_conflict=osm_id',{method:'POST',
          headers:H({'Prefer':'resolution=merge-duplicates,return=representation'}),
          body:JSON.stringify(body)});
    p.then(function(){ toast('Salvato.'); el('editor').innerHTML=''; loadMap(); })
     .catch(function(e){ b.disabled=false; b.textContent='Salva'; toast('Errore: '+e.message); });
  };
}

/* ============================================================
   HOME -- tutto quello che succede, in un colpo d'occhio.
   Le pagine nuove (Home, Note, Citta') non usano caricaContesti():
   quella fa ricerche live su OpenStreetMap/Overpass, giuste per
   poche righe alla volta ma lente su liste piu' lunghe. Qui si legge
   dalla tabella punti, che teniamo aggiornata noi e non fa rete.
   ============================================================ */

/* Le stesse identiche letture che fa l'app pubblica, ma fatte da qui
   con la chiave anonima, non con l'accesso da amministratore. Se una
   di queste si rompe, si rompe per chiunque stia solo cercando una
   fontanella: e' il controllo che il 30 luglio ci sarebbe servito
   prima di scoprirlo da un utente. Sola lettura, nessuna scrittura:
   non consuma nulla, si puo' far girare quante volte si vuole. */
/* I controlli interrogano il database COME UN VISITATORE ANONIMO, non come
   admin: e' l'unico modo per accorgersi che il pubblico non vede piu'
   qualcosa. Quello sulle firme sarebbe diventato rosso da solo quando il
   permesso sulla colonna mancava e le foto erano sparite dal sito. */
var SALUTE = [
  {t:'Mappa', d:'Le fontanelle arrivano al pubblico',
   p:'fountains?select=id&hidden=eq.false&limit=1',
   aiuto:'Se e\u0300 rosso il sito non mostra nessuna fontanella. Controlla le policy della tabella fountains.'},
  {t:'Stato e voti', d:'Funziona / rotta e le stelle',
   p:'v_status?select=target&limit=1',
   aiuto:'Vista v_status irraggiungibile: le schede non mostrerebbero se una fontanella funziona.'},
  {t:'Foto', d:'Le foto pubblicate si vedono',
   p:'photos?select=id,url&approved=eq.true&limit=1',
   aiuto:'Il pubblico non vede le foto. Di solito e\u0300 un permesso mancante su photos.'},
  {t:'Firme', d:'La colonna firma e\u0300 leggibile',
   p:'photos?select=url,firma&approved=eq.true&limit=1',
   aiuto:'Manca il permesso sulla colonna: grant select (firma) on public.photos to anon; poi notify pgrst, \'reload schema\';'},
  {t:'Commenti', d:'I testi delle recensioni',
   p:'reviews?select=comment&approved=eq.true&comment=not.is.null&limit=1',
   aiuto:'I commenti non arrivano al pubblico. Controlla le policy di reviews.'},
  {t:'Citt\u00e0', d:'Le 100 pagine citt\u00e0',
   p:'citta?select=nome&limit=1',
   aiuto:'L\'elenco citta\u0300 non risponde: le pagine citta\u0300 restano senza dati.'}
];
function anonGet(path){
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path,
    {headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY}})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
function eseguiSalute(){
  return Promise.all(SALUTE.map(function(x){
    var t0 = Date.now();
    return anonGet(x.p)
      .then(function(){ return {c:x, ok:true,  ms:Date.now()-t0, err:null}; })
      .catch(function(e){ return {c:x, ok:false, ms:Date.now()-t0, err:e && e.message}; });
  }));
}

/* Avvisi gialli: non e' rotto niente, ma qualcosa aspetta te. */

    sel('submissions?select=id&state=eq.pending&limit=200').catch(function(){return[];}),

              aiuto: guasti.length ? 'Segnalazioni di guasto ancora aperte.' : 'Nessun guasto in sospeso.'});
    return out;
  });

var SALUTE_DETT = [];

/* Quattro rettangoli affiancati, non uno per controllo: quello che serve
   a colpo d'occhio e' se una FAMIGLIA di cose funziona, non quale delle
   sei interrogazioni ha risposto. Il dettaglio si apre toccando. */
var FAMIGLIE = [
  {n:'Sito',        chi:['Mappa','Stato e voti','Citt\u00e0']},
  {n:'Contenuti',   chi:['Foto','Firme','Commenti']},
  {n:'Da approvare',chi:['Coda foto','Proposte']},
  {n:'Guasti',      chi:['Guasti aperti']}
];

function saluteGriglia(risultati, avvisi){
  SALUTE_DETT = [];
  var tutti = risultati.map(function(r){
    return {nome:r.c.t, liv:r.ok?'ok':'bad', d:r.ok?'risponde':'NON RISPONDE',
      testo:(r.ok ? 'Risposta corretta in '+r.ms+' ms.' : 'Nessuna risposta valida. '+(r.err||'')) +
        '\n\nControlla: '+r.c.d+'\nInterrogazione: '+r.c.p+'\n\n'+r.c.aiuto};
  }).concat((avvisi||[]).map(function(a){
    return {nome:a.t, liv:a.liv, d:a.d, testo:a.aiuto};
  }));
  function trova(n){ return tutti.filter(function(t){ return t.nome===n; })[0]; }

  var celle = FAMIGLIE.map(function(f){
    var membri = f.chi.map(trova).filter(Boolean);
    if(!membri.length) return null;
    var rotti  = membri.filter(function(m){ return m.liv==='bad'; });
    var gialli = membri.filter(function(m){ return m.liv==='warn'; });
    var liv = rotti.length ? 'bad' : gialli.length ? 'warn' : 'ok';
    var sotto = rotti.length  ? rotti.map(function(m){ return m.nome; }).join(', ')
              : gialli.length ? gialli.map(function(m){ return m.d; }).join(' \u00b7 ')
              : 'tutto a posto';
    SALUTE_DETT.push({t:f.n, testo: membri.map(function(m){
      return (m.liv==='bad'?'\u2715 ':m.liv==='warn'?'! ':'\u2713 ')+m.nome+' \u2014 '+m.d+'\n'+m.testo;
    }).join('\n\n\u2014\u2014\u2014\n\n')});
    return {liv:liv, t:f.n, d:sotto, i:SALUTE_DETT.length-1};
  }).filter(Boolean);

  var rotti  = celle.filter(function(c){ return c.liv==='bad'; }).length;
  var gialli = celle.filter(function(c){ return c.liv==='warn'; }).length;
  var titolo = rotti ? 'Qualcosa non funziona'
             : gialli ? (gialli===1?'1 cosa aspetta te':gialli+' cose aspettano te')
             : 'Tutto a posto';
  return '<div class="home-card salute-card">'+
    '<div class="salute-t '+(rotti?'bad':gialli?'warn':'ok')+'">'+
      '<span class="pallone"></span>'+titolo+'</div>'+
    '<div class="salute-griglia">'+
      celle.map(function(c){
        return '<button class="salute-box '+c.liv+'" data-sal="'+c.i+'">'+
          '<span class="sb-t">'+esc(c.t)+'</span>'+
          '<span class="sb-d">'+esc(c.d)+'</span></button>';
      }).join('')+
    '</div><div class="salute-dett" id="saluteDett" hidden></div></div>';
}
function agganciaSalute(){
  el('view').querySelectorAll('[data-sal]').forEach(function(b){
    b.onclick = function(){
      var d = SALUTE_DETT[+b.getAttribute('data-sal')], box = el('saluteDett');
      if(!box) return;
      if(box.dataset.apert === b.getAttribute('data-sal')){ box.hidden=true; box.dataset.apert=''; return; }
      box.hidden = false;
      box.dataset.apert = b.getAttribute('data-sal');
      box.innerHTML = '<b>'+esc(d.t)+'</b><pre>'+esc(d.testo)+'</pre>';
    };
  });
}
function saluteHtml(risultati){
  return risultati.map(function(r){

      '<b style="color:'+(r.ok?'var(--acqua-deep)':'var(--rotta)')+'">'+(r.ok?'ok':'FERMO')+'</b></div>';

/* Un grafico a linea fatto a mano: niente librerie per dodici punti. */
function spark(valori){
  var w=280, h=44, max=Math.max(1, valori.reduce(function(a,v){return Math.max(a,v);},0));
  var n=valori.length, passo = n>1 ? w/(n-1) : w;
  var pts = valori.map(function(v,i){ return [i*passo, h-(v/max)*(h-4)-2]; });
  var linea = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join('');
  var area = linea+'L'+w.toFixed(1)+','+h+'L0,'+h+'Z';
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<path class="f" d="'+area+'"></path><path class="l" d="'+linea+'"></path></svg>';
}

function trendHtml(ora, prima){
  if(!prima) return '<span class="trend-nc">senza confronto</span>';
  var d = ora - prima;
  if(d===0) return '<span class="trend-pari">= invariato</span>';
  return '<span class="'+(d>0?'trend-su':'trend-giu')+'">'+(d>0?'\u2191 +':'\u2193 ')+d+'</span>';
}

/* Memoria locale del pannello: sta sul TUO dispositivo, non nel database.
   Serve a dire "cosa e' successo da quando non guardavi" senza registrare
   niente su nessuno. Se cancelli i dati del browser, riparte da oggi. */
function ricordo(k, val){
  try{
    if(val === undefined) return JSON.parse(localStorage.getItem('idr_adm_'+k) || 'null');
    localStorage.setItem('idr_adm_'+k, JSON.stringify(val));
  }catch(e){ return null; }
}

/* Giorni di fila con almeno un'apertura, contando all'indietro da oggi. */
function striscia(giorni){
  var n = 0;
  for(var i = giorni.length-1; i >= 0; i--){
    if((giorni[i].totale||0) > 0) n++;
    else if(i === giorni.length-1) continue;   // oggi puo' essere ancora a zero
    else break;
  }
  return n;
}
function recordVisite(giorni){
  var best = {giorno:null, totale:0};
  giorni.forEach(function(g){ if((g.totale||0) > best.totale) best = g; });
  return best;
}
/* Il traguardo tondo piu' vicino sopra il numero attuale. */
function traguardo(n){
  if(n == null) return null;
  var scalini = [10,25,50,75,100,150,200,250,300,400,500,750,1000,1500,2000,3000,5000];
  for(var i=0;i<scalini.length;i++) if(scalini[i] > n)
    return {meta:scalini[i], manca:scalini[i]-n};
  return null;
}

/* ---- Cosa e' successo da quando non guardavi ----
   Un totale fermo non dice niente; "sono successe queste cose senza di te"
   si'. Il momento dell'ultima visita sta solo su questo dispositivo. */
function novita(N, V, RW, FT, C){
  var prima = ricordo('visto');
  var righe = [], quando = '';

  if(prima){
    var d = new Date(prima);
    var giorni = Math.max(0, Math.floor((Date.now()-prima)/864e5));
    quando = giorni === 0 ? 'da stamattina' : giorni === 1 ? 'da ieri'
           : 'in ' + giorni + ' giorni';
    var visite = V.filter(function(g){ return new Date(g.giorno) >= new Date(d.toISOString().slice(0,10)); })
                  .reduce(function(n,g){ return n + (g.totale||0); }, 0);
    var nr = RW.filter(function(r){ return new Date(r.created_at) > d; }).length;
    var nf = FT.filter(function(f){ return new Date(f.created_at) > d; }).length;
    if(visite) righe.push('<b>'+visite+'</b> aperture');
    if(nr)     righe.push('<b>'+nr+'</b> '+(nr===1?'voto':'voti'));
    if(nf)     righe.push('<b>'+nf+'</b> '+(nf===1?'foto':'foto'));
  }

  /* prime volte: citta' che prima non c'erano */
  var viste = ricordo('citta') || [];
  var nuove = C.filter(function(c){ return c.ultima_attivita && viste.indexOf(c.nome) < 0; })
               .map(function(c){ return c.nome; });

  if(!prima)
    return '<div class="home-card novita"><div class="nv-t">Prima apertura della bacheca</div>'+
      '<div class="nv-p">Da adesso ti dico cosa succede fra una visita e l\u2019altra.</div></div>';

  if(!righe.length && !nuove.length)
    return '<div class="home-card novita calma"><div class="nv-t">Niente di nuovo '+quando+'</div>'+
      '<div class="nv-p">Nessuna apertura e nessun contributo da quando sei passato.</div></div>';

  var h = '<div class="home-card novita"><div class="nv-t">Mentre non guardavi, '+quando+'</div>';
  if(righe.length) h += '<div class="nv-righe">'+righe.join('<span class="pt">\u00b7</span>')+'</div>';
  if(nuove.length)
    h += '<div class="nv-prima">\u2726 Per la prima volta qualcuno ha contribuito '+
         (nuove.length===1 ? 'a <b>'+esc(nuove[0])+'</b>'
                           : 'in <b>'+nuove.length+' citt\u00e0 nuove</b>: '+esc(nuove.slice(0,3).join(', ')))+
         '</div>';
  return h + '</div>';
}

/* ---- Record e continuita' ---- */
function recordEStriscia(V){
  if(!V.length) return '';
  var rec = recordVisite(V), str = striscia(V);
  var oggi = (V[V.length-1]||{}).totale || 0;
  var h = '<div class="due-mini">';
  h += '<div class="mini"><b>'+rec.totale+'</b><span>record, '+
       (rec.giorno ? esc(ago(rec.giorno)) : '')+'</span></div>';
  h += '<div class="mini'+(str>=7?' bella':'')+'"><b>'+str+'</b><span>'+
       (str===1?'giorno di fila':'giorni di fila')+' con almeno un\u2019apertura</span></div>';
  h += '</div>';
  if(oggi > rec.totale - 1 && oggi >= rec.totale && oggi > 0)
    h = '<div class="primato">\u2726 Oggi \u00e8 il giorno con pi\u00f9 aperture di sempre</div>' + h;
  return h;
}

/* I comuni si ricavano dalle coordinate con Nominatim, che accetta una
   richiesta al secondo. Quelli gia' risolti restano scritti su questo
   dispositivo, cosi' alla seconda apertura la classifica e' istantanea.
   Nessun dato nuovo viene raccolto: e' il tuo browser che chiede, per
   fontanelle gia' pubbliche su OpenStreetMap. */
function comuniNoti(){ return ricordo('comuni') || {}; }

function comuniDeiContributi(RW, FT){
  var box = el('commuti');
  if(!box) return;

  var per = {};                       // target -> {voti, foto, ultimo}
  RW.forEach(function(r){
    var x = per[r.target] || (per[r.target] = {voti:0, foto:0, ultimo:r.created_at});
    x.voti++; if(r.created_at > x.ultimo) x.ultimo = r.created_at;
  });
  FT.forEach(function(f){
    var x = per[f.target] || (per[f.target] = {voti:0, foto:0, ultimo:f.created_at});
    x.foto++; if(f.created_at > x.ultimo) x.ultimo = f.created_at;
  });
  var targets = Object.keys(per);
  if(!targets.length){ box.innerHTML = '<div class="meta">Ancora nessun contributo.</div>'; return; }

  var cache = comuniNoti();
  var daFare = targets.filter(function(t){ return !cache[t]; });

  function disegna(){
    var agg = {};
    targets.forEach(function(t){
      var c = cache[t];
      if(!c) return;
      var a = agg[c] || (agg[c] = {nome:c, voti:0, foto:0, ultimo:'', punti:0});
      a.voti += per[t].voti; a.foto += per[t].foto; a.punti++;
      if(per[t].ultimo > a.ultimo) a.ultimo = per[t].ultimo;
    });
    var righe = Object.keys(agg).map(function(k){ return agg[k]; })
      .sort(function(a,b){ return a.ultimo < b.ultimo ? 1 : -1; });

    var mancanti = targets.filter(function(t){ return !cache[t]; }).length;
    box.innerHTML = (righe.length
      ? righe.slice(0,10).map(function(c){
          return '<div class="citta-riga">'+
            '<div class="cr-nome">'+esc(c.nome)+'</div>'+
            '<div class="cr-num">'+c.voti+' voti \u00b7 '+c.foto+' foto</div>'+
            '<div class="cr-quando">'+esc(ago(c.ultimo))+'</div></div>';
        }).join('')
      : '<div class="meta">Nessun comune riconosciuto.</div>')
      + (mancanti ? '<div class="meta" style="margin-top:8px">Sto risalendo ad altri '+
          mancanti+' luoghi\u2026 comparir\u00e0 tutto fra poco.</div>'
        : '<div class="meta" style="margin-top:8px">'+righe.length+
          (righe.length===1?' comune':' comuni')+' in tutto.</div>');
  }
  disegna();
  if(!daFare.length) return;

  /* Coordinate: prima quelle gia' in CTX, il resto da punti. */
  sel('punti?select=target,lat,lon&target=in.('+
      daFare.slice(0,150).map(function(t){ return '"'+t.replace(/"/g,'') + '"'; }).join(',')+')')
    .catch(function(){ return []; })
    .then(function(pp){
      var coord = {};
      pp.forEach(function(x){ coord[x.target] = x; });
      var lista = daFare.filter(function(t){ return coord[t]; });
      var i = 0;
      (function passo(){
        if(i >= lista.length){ ricordo('comuni', cache); disegna(); return; }
        var t = lista[i++], c = coord[t];
        chiediVia(c.lat, c.lon, function(){}, function(comune){
          if(comune) cache[t] = comune;
          if(i % 3 === 0 || i === lista.length){ ricordo('comuni', cache); disegna(); }
          passo();
        });
      })();
    });
}

function quadroN(n, etichetta, forte, spicca){
  return '<div class="qn'+(forte?' forte':'')+(spicca?' spicca':'')+'">'+

/* Barre per giorno: una per giorno, l'ultima piu' scura perche' e' oggi.
   Niente librerie: sono trenta rettangoli. */
function barreGiorni(giorni){
  if(!giorni.length) return '<div class="meta">Nessun dato sulle visite.</div>';
  var max = Math.max.apply(null, giorni.map(function(g){ return g.totale||0; }).concat([1]));
  return '<div class="barre" role="img" aria-label="visite degli ultimi giorni">'+
    giorni.map(function(g,i){
      var alt = Math.round(100*(g.totale||0)/max);
      var cl = i===giorni.length-1 ? ' oggi' : (i>=giorni.length-7 ? ' sett' : '');
      return '<i class="'+cl.trim()+'" style="--h:'+alt+'%;--r:'+(i*22)+'ms" '+
             'title="'+esc(g.giorno)+': '+(g.totale||0)+'"></i>';
    }).join('')+'</div>';
}
function animaBarre(){
  var b = el('view') && el('view').querySelectorAll('.barre i');
  if(!b) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    b.forEach(function(x){ x.style.height='var(--h)'; }); return;
  }
  requestAnimationFrame(function(){ b.forEach(function(x){ x.classList.add('su'); }); });
}

function fette(righe, dimensione, titolo){
  var r = righe.filter(function(x){ return x.dimensione===dimensione && (x.ultimi_30||0)>0; })
               .sort(function(a,b){ return b.ultimi_30-a.ultimi_30; });
  if(!r.length) return '';
  var tot = r.reduce(function(n,x){ return n+(x.ultimi_30||0); },0);
  return '<div class="gruppo-t">'+titolo+'</div>'+
    r.map(function(x){
      var pct = tot ? Math.round(1000*x.ultimi_30/tot)/10 : 0;
      var nome = (ETICHETTE[dimensione] && ETICHETTE[dimensione][x.valore]) || x.valore;
      return '<div class="barra-riga"><div class="barra-testa"><b>'+esc(nome)+'</b>'+
        '<span>'+x.ultimi_30+' \u00b7 '+pct+'%</span></div>'+
        '<div class="barra"><i style="width:'+pct+'%"></i></div></div>';
    }).join('');
}

var FONTI_NOTA = {

  problema:    {tabella:'problemi',    campo:'nota',    max:600},
  proposta:    {tabella:'submissions', campo:'note',    max:400}
};
var ETICH_NOTA  = {recensione:'recensione', segnalazione:'segnalazione', problema:'problema', proposta:'proposta'};
var COLORE_NOTA = {recensione:'', segnalazione:'warn', problema:'bad', proposta:'ok'};
var NOTE_TUTTE = [];
