name: Aggiorna i dati delle fontanelle

on:
  schedule:
    - cron: '0 3 1 * *'      # il primo del mese alle 3 di notte
  workflow_dispatch:          # oppure a mano dalla tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica da OpenStreetMap
        run: python3 tools/build_data.py --milano

      - name: Genera le pagine città
        run: python3 tools/build_pages.py --dominio https://idratati.it --indirizzi 12

      - name: Committa lo snapshot
        run: |
          git config user.name  "idratati-bot"
          git config user.email "actions@github.com"
          git add data/ citta/ sitemap.xml
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "Dati fontanelle aggiornati $(date +%Y-%m-%d)"
            git push
          fi
